externalDocs:
  description: Kho mã nguồn và hướng dẫn sử dụng dự án
  url: https://github.com/PC2005-cloud/dsh-pet

servers:
  - url: http://127.0.0.1:{port}
    description: |
      Dịch vụ Web DSH trên máy này. `{port}` = `ctx.webServer.port` (mặc định 3080 khi chạy `dsh web`).
      Tiền tố route luôn là `/dsh-pet-7340` (7340 là tên còn sót lại từ lịch sử, **không phải số cổng**).
    variables:
      port:
        default: "3080"
        description: Cổng thực tế mà dịch vụ Web DSH đang lắng nghe

tags:
  - name: State
    description: Poll trạng thái thống nhất — nguồn dữ liệu duy nhất, frontend lấy mỗi giây; chỉ đọc, chỉ trong bộ nhớ, không tác dụng phụ
  - name: Action
    description: Endpoint hành động — kích hoạt một hành vi của host, ghi vào State, chỉ trả `{ ok }`
  - name: Config
    description: Đọc, lưu cấu hình và thông tin metadata
  - name: Assets
    description: Phông chữ, biểu tượng thông báo, meme và tài nguyên hoạt ảnh
  - name: Voice
    description: Tổng hợp giọng nói — host kiểm tra tham số, xếp hàng và lưu bộ nhớ đệm; thành công thì trả trực tiếp tệp mp3
  - name: Memory
    description: Danh mục triển khai bộ nhớ dài hạn — bên thứ ba đăng ký tại đây, cung cấp các giá trị cho tùy chọn `memoryProvider`

paths:
  /dsh-pet-7340/state:
    get:
      tags: [State]
      operationId: getState
      summary: Lấy trạng thái thống nhất S
      description: |
        Trả về trạng thái S đã công bố trong bộ nhớ của host, với cấu trúc cố định:

        ```jsonc
        {
          "counter": 1755000000007,
          "sections": {
            "balance":    { "counter": 1755000000000, "data": { /* BalanceState */ } },
            "workStatus": { "counter": 1755000000001, "data": { /* WorkStatusSnapshot */ } },
            "notify":     { "counter": 1755000000002, "data": { /* NotifyFrame */ } },
            "config":     { "counter": 1755000000007, "data": {} }
          },
          "pets": {
            "main": {
              "say":      { "counter": 1755000000003, "data": { "text": "……", "duration": 10000, "anim": true } },
              "anim":     { "counter": 1755000000004, "data": { "name": "东张西望" } },
              "position": { "counter": 1755000000005, "data": { "x": 0.5, "y": 0.35, "mode": "spring" } },
              "throw":    { "counter": 1755000000006, "data": { "angle": 45, "power": 1 } },
              "lock":     { "counter": 1755000000007, "data": { "locked": false } }
            }
          }
        }
        ```

        **Quy ước và lưu ý**:

        - `sections` là các mục **toàn cục**, mọi phía dùng chung một bản; `pets.<id>` là dữ liệu riêng của **từng thú cưng**.
        - Năm slot (`say` / `anim` / `position` / `throw` / `lock`) của `pets.<id>` **được tạo cùng nhau**:
          chỉ cần ghi bất kỳ lá nào cho thú cưng đó thì cả năm khóa đều tồn tại; khóa chưa được ghi có dạng
          `{ "counter": 0, "data": null }`. Thú cưng **chưa từng có lá nào được ghi** thì toàn bộ mục đó không xuất hiện trong
          `pets`.
        - `position` / `throw` là **lệnh chuyển động** (host → renderer), cùng loại với `anim`: renderer đọc được là thực thi,
          **không ghi ngược lại**. Chúng là nơi nhận dữ liệu từ `POST /position` và `POST /throw`, bản thân không chứa trạng thái kiểu "thú cưng hiện đang ở đâu".
        - `pets.<id>.lock` là **trạng thái khóa chiếm quyền** (issue #122 mục 4), **khác ba mục trên: đây là trạng thái chứ không phải
          lệnh** — renderer đọc để quyết định "có đóng băng chính mình hay không" (không tung xúc xắc cho chuỗi ngẫu nhiên, tạm dừng hoạt ảnh tự phát hiện tại, bỏ qua biểu hiện số dư và trạng thái công việc từ nguồn **tự động**), rồi **tự** hẹn giờ mở khóa theo `expiresAt`. Xem `LockLeaf`.
        - `pets.<id>.say` có **hai dạng**: hiện bong bóng `{ text, image?, duration?, anim? }` và
          xóa `{ "clear": true }` (được ghi bởi `POST /bubble/clear`). Mặc định `duration` là 10 giây,
          `0` = không hiển thị; mặc định `anim` là `true` (liên kết với hoạt ảnh `events.whisper`), đặt rõ `false` = chỉ hiện bong bóng.
          Độc thoại và câu trả lời hội thoại **không ghi** hai trường này; bên tiêu thụ dùng giá trị mặc định — hành vi hoàn toàn như trước khi thay đổi.
        - **`sections.config` là tín hiệu thay đổi cấu hình** (`data` luôn là `{}`, chỉ cần xem `counter`): khi giá trị thay đổi nghĩa là cấu hình
          đã được ghi; bên tiêu thụ nên tải lại `GET /config`. **Hiện các bên ghi là `POST /pet-display` (menu chuột phải desktop thay đổi vị trí hiển thị)
          và `POST /pet-config` (ghi lại toàn bộ mục)** — cả hai đều có thể thay đổi cấu hình **không phải do chính trang khởi tạo**,
          nên phía trình duyệt chỉ có thể nhận biết qua tín hiệu này.
          Bản thân cấu hình quá lớn để đưa vào `/state` được gọi mỗi giây, vì vậy ở đây chỉ đặt một tín hiệu.
          Lưu / đồng bộ cấu hình (`PUT` / `POST /config`) **không ghi tín hiệu này**: bên gọi đã nhận được bản tổng hợp hoàn chỉnh.
          **Không phát hiện được thao tác người dùng sửa thủ công `main-config.jsonc` / `pet/*.json`** — host không còn đọc đĩa để so sánh mtime
          (làm vậy tương đương đọc đĩa mỗi nhịp); cần tải lại sau khi sửa.
        - **`counter` là phiên bản của toàn bộ S** (ở cấp cao nhất, **không phải lá**): nó là "mã lần ghi cuối cùng".
          Gửi lại nó dưới dạng `?since=` để cho biết "bản tôi đang có là phiên bản nào" — long polling dùng nó để quyết định có cần chờ hay không.
          `0` = chưa từng ghi lá nào.
        - `data` của lá là `null` nghĩa là "chưa từng ghi" (khi đó `counter` là `0`); bên tiêu thụ nên bỏ qua lá này.
        - **`counter` chỉ cập nhật khi nội dung được ghi**, không đổi ở mỗi yêu cầu. Vì thế cần phân biệt "dữ liệu không đổi" với "endpoint bị lỗi":
          trường hợp sau thể hiện qua HTTP không phải 2xx hoặc lỗi kết nối.
        - Phản hồi có `cache-control: no-cache, no-store`, có thể polling an toàn.
        - **Endpoint này tuyệt đối không kích hoạt lệnh gọi bên ngoài hoặc tạo nội dung bằng mô hình** — nó chỉ đọc bộ nhớ. Đây là bảo đảm cứng: polling mỗi giây
          không thể bị một yêu cầu chậm nào đó làm nghẽn tất cả.
        - Hãy dùng đường dẫn (`sections.balance`, `pets.<id>.say`) như các khóa **không trong suốt**,
          **đừng tách theo `.`**: id thú cưng có thể chứa dấu chấm (ví dụ `a.b`), tách ra chắc chắn sai.
          Để trích xuất id, hãy cắt theo tiền tố / hậu tố cố định.
        - Id thú cưng nằm trong `pets[].id` của cấu hình, mặc định là `main`. Để lấy mọi id, xem `GET /config`.

        **Long polling (cách dùng khuyến nghị)**

        Khi có `?since=<top-level counter>&timeout=<ms>` (**bắt buộc truyền cả cặp**), nếu phiên bản bên gọi đang có giống phiên bản hiện tại,
        host sẽ **treo** yêu cầu này cho đến khi có bất kỳ lá nào được ghi (trả về ngay) hoặc hết thời gian chờ — nhờ vậy thay đổi ở lá sẽ được nhận ngay,
        không cần polling rỗng theo khoảng thời gian cố định. **Không truyền cả hai tham số = trả về toàn bộ ngay**, hoàn toàn giống hành vi cũ không có long polling.

        Cách dùng khuyến nghị: lần đầu lấy dữ liệu không tham số → lưu `counter` → các lượt sau gửi kèm nó để chờ lâu → khi nhận phản hồi thì gửi lượt mới **ngay lập tức**.
        Khi nhàn rỗi, tần suất yêu cầu phụ thuộc vào `timeout` bạn chọn; độ trễ là "lá thay đổi thì nhận được ngay".
      parameters:
        - name: since
          in: query
          required: false
          description: |
            Phiên bản S mà bên gọi đang giữ (= `counter` cấp cao nhất trong phản hồi lượt trước).
            Khác phiên bản hiện tại → trả về ngay; giống nhau → treo yêu cầu. `0` hợp lệ ("tôi chưa có dữ liệu nào").
            **Bắt buộc truyền cùng với** `timeout`: chỉ truyền một tham số → `200` + `reason: bad-request`.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 1755000000007
        - name: timeout
          in: query
          required: false
          description: |
            Thời gian chờ tối đa (mili giây), chỉ nhận **số nguyên không âm** từ `0..10000`.
            `0` hợp lệ (tương đương "trả về ngay"). **Bắt buộc truyền cùng với** `since`: chỉ truyền một tham số → `200` + `reason: bad-request`.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
          example: 1000
      responses:
        "200":
          description: |
            Trạng thái hiện tại (khi long polling: đã nhận thay đổi hoặc đã hết thời gian chờ).

            `since` / `timeout` không hợp lệ (chỉ truyền một tham số, không phải số nguyên, số âm hoặc lớn hơn 10000) cũng trả `200`,
            khi đó body phản hồi là `{ "ok": false, "reason": "bad-request", "message": "..." }` —
            lỗi tham số cũng là kết luận do trình xử lý đưa ra.
          headers:
            cache-control:
              description: Luôn là `no-cache, no-store`
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PollState"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/work-status:
    post:
      tags: [Action]
      operationId: setWorkStatus
      summary: Ghi trạng thái công việc từ bên ngoài
      description: |
        Cung cấp cho chương trình bên ngoài (Codex, script, plugin khác) một điểm ghi trạng thái tối giản:
        `POST` đặt mức trạng thái cho slot bên ngoài cố định `api`, `DELETE` xóa slot và đưa về trạng thái rảnh.

        - Chỉ chấp nhận 6 mức; `task` là tùy chọn, bỏ qua = giữ nguyên lần trước, `null` / chuỗi rỗng = xóa.
        - Không truyền session/seq, không phân xử nhiều bên ghi hoặc quản lý lease; bên ghi sau cùng có hiệu lực.
        - Slot bên ngoài cùng phiên DSH tham gia vào thứ tự ưu tiên hiện có
          (waiting > error > working > thinking > result > success).
        - Bong bóng `success` / `error` tự thu lại sau 10 giây, nhưng trạng thái không tự xóa;
          muốn trở về rảnh phải gọi rõ `DELETE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [thinking, working, result, waiting, success, error]
                task:
                  description: |
                    Nội dung mô tả chi tiết công việc, hiển thị trong bong bóng. Tối đa 40 code point sau `trim()`;
                    bỏ qua = giữ giá trị hiện tại, `null` hoặc chuỗi rỗng = xóa.
                  oneOf:
                    - type: string
                    - type: "null"
      responses:
        "200":
          description: |
            Đã chấp nhận ghi; trả về trạng thái và nội dung công việc hiện tại của slot bên ngoài.

            `state` không xác định / kiểu `task` không hợp lệ / vượt quá 40 code point → cũng trả `200` +
            `{ "ok": false, "reason": "bad-request", "message": "..." }`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WorkStatusSnapshot"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: "Body không phải JSON hợp lệ (`reason: invalid-json`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: "Body vượt quá 8 KiB (`reason: payload-too-large`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
    delete:
      tags: [Action]
      operationId: clearWorkStatus
      summary: Xóa trạng thái công việc được ghi từ bên ngoài
      description: Xóa slot bên ngoài `api`, đưa thú cưng về trạng thái rảnh; idempotent (không có slot bên ngoài vẫn trả 204).
      responses:
        "204":
          description: Đã xóa (hoặc vốn không có slot bên ngoài).
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/balance:
    post:
      tags: [Action]
      operationId: refreshBalance
      summary: Làm mới số dư ngay một lần
      description: |
        Tra cứu số dư bằng **nhà cung cấp của hội thoại hiện tại** (`ctx.agentDefaultModel.currentSelection()`),
        rồi ghi kết quả vào `sections.balance`. Đây là endpoint hành động `POST`, **không trả dữ liệu số dư**.

        - Khi số dư không khả dụng (nhà cung cấp không hỗ trợ / thiếu thông tin xác thực / lấy dữ liệu thất bại), kết quả vẫn được ghi vào S,
          thể hiện dưới dạng `{ ok: false, reason, message }`; endpoint này **vẫn trả `ok: true`**,
          vì "bản thân hành động làm mới" đã hoàn tất. Để phân biệt, hãy đọc `sections.balance.data.ok`.
        - Khi ghi sẽ kèm dấu `manual: true` (chỉ khi lần làm mới này do người dùng chủ động kích hoạt),
          để bên tiêu thụ quyết định "khi số dư không khả dụng có cần nhất định hiện thông báo dạng chữ hay không".
        - Khi có `?pet=`, lá cũng kèm `petId`: **chỉ thú cưng này** hiện bong bóng và hoạt ảnh mức số dư; nếu không có thì không gắn chủ sở hữu,
          mọi thú cưng đã bật số dư vẫn hiển thị như thường (lệnh slash và làm mới định kỳ đều dùng cách này).
        - Host dùng **bộ hẹn giờ riêng** để làm mới định kỳ (chu kỳ lấy từ cấu hình
          `eventsRefreshSec.balance`, mặc định 1800 giây); frontend không cần polling endpoint này.
      parameters:
        - name: pet
          in: query
          required: false
          description: |
            Id thú cưng mục tiêu. Nếu truyền thì thú cưng phải tồn tại và lần lượt qua kiểm tra phía hiển thị (`surface`) cùng khóa chiếm quyền;
            bộ phân phối xử lý thống nhất điều kiện đang ngủ (nếu đang ngủ thì trả `sleeping`).
          schema:
            type: string
        - name: surface
          in: query
          required: false
          description: |
            Phía hiển thị. **Bắt buộc** nếu có `pet` (`web` / `desktop` / `both` / `any`); thiếu hoặc không hợp lệ thì trả `bad-request`.
            Tham số này không có hiệu lực nếu không truyền `pet`.
          schema:
            type: string
            enum: [web, desktop, both, any]
      responses:
        "200":
          description: Hành động làm mới đã hoàn tất (không có nghĩa là số dư khả dụng)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/environment:
    post:
      tags: [Action]
      operationId: queryEnvironment
      summary: Tra cứu thành phố và thời tiết hiện tại một lần
      description: |
        Tra cứu thành phố nơi máy này hiện đang ở (định vị IP, không cần key) và thời tiết hiện tại (Open-Meteo, không cần key).

        - Mặc định không có `?pet=` = **chỉ truy vấn**: chỉ trả dữ liệu, không ghi vào S.
        - Nếu có `pet` thì phải tồn tại và lần lượt qua hai kiểm tra phía hiển thị (`surface`) và khóa chiếm quyền; bộ phân phối xử lý thống nhất
          điều kiện đang ngủ (nếu đang ngủ thì trả `sleeping` cùng lời từ chối). Sau khi qua kiểm tra, kết quả được ghi vào `sections.env`,
          `petId` trong lá xác định thú cưng nào hiện bong bóng môi trường.
        - `?fresh=1` bỏ qua bộ nhớ đệm ba cấp (thành phố 6 giờ / tọa độ 7 ngày / thời tiết 1 giờ) để bắt buộc truy vấn lại;
          nếu thành công thì ghi đè cache; các trường hợp khác dùng cache và thường không tạo yêu cầu mạng.
        - `?ip=1` bỏ qua thành phố thời tiết trong cấu hình (`environmentCity`) và định vị theo IP đầu ra; mặc định ưu tiên thành phố trong cấu hình.
          Nút "Kiểm tra" trên trang cài đặt luôn gửi tham số này — nếu không gửi thì sẽ trả nguyên thành phố người dùng đã điền.
        - Không tìm thấy dữ liệu không phải lỗi: vẫn trả `ok: true`, chỉ lược bỏ các trường `region` / `city` / `weather` không lấy được.
      parameters:
        - name: pet
          in: query
          required: false
          description: |
            Id thú cưng mục tiêu. Mặc định = chỉ truy vấn (không ghi S, không kèm `petId`); nếu truyền thì phải tồn tại và vượt qua kiểm tra.
          schema:
            type: string
        - name: fresh
          in: query
          required: false
          description: |
            `1` = bỏ qua cache để truy vấn lại bắt buộc (menu chuột phải "Tra cứu thời tiết" luôn gửi giá trị này). Mặc định hoặc giá trị khác = dùng cache.
          schema:
            type: string
            enum: ["0", "1"]
        - name: ip
          in: query
          required: false
          description: |
            `1` = bỏ qua thành phố thời tiết trong cấu hình (`environmentCity`), định vị theo IP đầu ra (nút "Kiểm tra" trên trang cài đặt luôn gửi giá trị này).
            Mặc định hoặc giá trị khác = dùng thành phố trong cấu hình nếu có.
          schema:
            type: string
            enum: ["0", "1"]
        - name: surface
          in: query
          required: false
          description: |
            Phía hiển thị. **Bắt buộc** nếu có `pet` (`web` / `desktop` / `both` / `any`), dùng để xác định thú cưng có hiển thị ở phía này hay không;
            thiếu hoặc không hợp lệ thì trả `bad-request`. Tham số này không có hiệu lực nếu không truyền `pet`.
          schema:
            type: string
            enum: [web, desktop, both, any]
      responses:
        "200":
          description: |
            Kết quả truy vấn. Mã trạng thái HTTP luôn là 200 (ngoại trừ 405): lỗi nghiệp vụ được biểu thị bằng `ok: false`.

            Các giá trị `reason`: `unknown-pet` (thú cưng không tồn tại), `pet-not-displayed` (thú cưng hiện không hiển thị ở phía này),
            `locked` (đang bị bên thứ ba chiếm quyền), `sleeping` (đang ngủ, kèm lời từ chối),
            `generate-error` (đọc cấu hình thất bại).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EnvironmentResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/focus-session:
    post:
      tags: [Action]
      operationId: focusSession
      summary: Yêu cầu trang chuyển sang phiên được chỉ định
      description: |
        Yêu cầu trang chuyển sang phiên được chỉ định. Đây là endpoint hành động: chỉ ghi ý định vào `sections.focusSession`,
        không trả kết quả chuyển trang và cũng không xác minh phiên đó có tồn tại hay không (id không xác định sẽ bị phía trang bỏ qua).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                  description: |
                    Id phiên mục tiêu. Sau `trim()` không được để trống hoặc là giá trị sentinel `unknown`,
                    giới hạn 128 ký tự; nếu không đáp ứng thì trả `ok: false` + `reason: bad-request`.
                  example: session-742cf7de-d1ce-4694-bfde-77158ce9e0ca
      responses:
        "200":
          description: Ý định đã được ghi vào `sections.focusSession` (không có nghĩa là trang đã chuyển sang phiên đó).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionResponse"
        "400":
          description: "Nội dung yêu cầu không phải JSON hợp lệ (`reason: invalid-json`)."
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/whisper:
    post:
      tags: [Action]
      operationId: whisper
      summary: Yêu cầu thú cưng được chỉ định nói ngay một câu
      description: |
        Tạo một câu độc thoại theo nhân vật `whisperPrompt` của mục cấu hình chứa thú cưng đó, ghi vào `pets.<id>.say`,
        đồng thời **trả kèm** văn bản được tạo ra (`text`; nếu bật tùy chọn ảnh và chọn trúng ảnh thì có thêm `image`).

        - Văn bản vẫn được ghi vào `pets.<id>.say` như trước: các bên tiêu thụ khác tiếp tục đọc từ `/state`; giá trị trả về chỉ
          giúp bên gọi không phải lấy thêm một lượt — cả hai là cùng một văn bản, không phải hai nguồn dữ liệu.

        - Cấu hình `whisperEnabled` **không khóa endpoint này**: trường đó chỉ tắt độc thoại tự động định kỳ,
          kích hoạt thủ công / qua API luôn khả dụng và không bị ảnh hưởng.
        - Khi tạo thất bại thì **không ghi vào S** (không giả tạo nội dung, cũng không hiện bong bóng lỗi); host ghi một dòng `console.warn`,
          endpoint này trả `{ ok: false, reason: 'generate-error' }`.
        - Nếu mục cấu hình của thú cưng bật `whisperImageEnabled` và pool meme không rỗng,
          hệ thống sẽ chọn ngẫu nhiên một ảnh và ghi vào trường `image` của lá cùng với văn bản.
        - Khi có `?image=`, chuyển sang **chỉ dùng ảnh được chỉ định**: không bị `whisperImageEnabled` khóa (chọn ảnh thủ công là ý định tường minh);
          nếu tên không có trong pool thì trả `unknown-image`, **không âm thầm thay bằng ảnh khác**.
        - Chọn model: ưu tiên `whisperModel` trong cấu hình mục; nếu để trống thì dùng model của hội thoại hiện tại.
          Nếu tạo nội dung bằng model được chỉ định thất bại, sẽ **tự động chuyển về model của hội thoại hiện tại** và thử lại một lần.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
        - name: image
          in: query
          required: false
          description: |
            Tên meme được dùng trong lần này (= khóa trong `memes` của mục cấu hình chứa thú cưng đó, không gồm phần mở rộng).
            Nếu truyền thì chỉ dùng ảnh này; nếu không có trong pool (sai tên hoặc tệp ảnh đã bị xóa) thì trả `unknown-image`.
            Mặc định = chọn ngẫu nhiên một ảnh theo `whisperImageEnabled`, hoặc chỉ trả văn bản.
          schema:
            type: string
      responses:
        "200":
          description: |
            Kết quả tạo nội dung. Lưu ý mã trạng thái HTTP **luôn là 200** (ngoại trừ 405): lỗi được biểu thị bằng `ok: false`,
            để bên gọi chỉ cần phân tích một tầng, không cần phân biệt "lỗi HTTP" với "lỗi nghiệp vụ".

            Các giá trị `reason`: `provider-missing` (không có model khả dụng — trong chế độ độc lập luôn là giá trị này),
            `generate-error` (tạo nội dung hoặc IO thất bại, kèm `message`), `unknown-pet` (thú cưng mục tiêu bị xóa
            giữa lần đọc "để xác thực" và lần đọc trước khi tạo — hiếm gặp nhưng được báo đúng sự thật, **không âm thầm dùng `main` để tạo nội dung**,
            cũng không ghi lá cho thú cưng không còn tồn tại), `unknown-image` (tên chỉ định bằng `?image=` không nằm trong pool),
            `bad-request` (thiếu `surface` / giá trị không hợp lệ),
            `pet-not-displayed` (kèm `display`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SayResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/broadcast:
    post:
      tags: [Action]
      operationId: broadcast
      summary: Bơm nội dung từ bên thứ ba — ghi văn bản bên ngoài cung cấp vào bong bóng
      description: |
        Khác với `POST /whisper`: **endpoint này không tạo nội dung**; bên gọi tự cung cấp văn bản, host chỉ chuyển tiếp
        và hiển thị. Các plugin khác phía host (ví dụ plugin "nữ hầu" tuần tra muốn nói thay chủ một câu sau khi kiểm tra xong) dùng endpoint này để gửi văn bản vào
        bong bóng thú cưng, biến thú cưng thành hiện thân của tính cách đó.

        Văn bản được ghi vào `pets.<id>.say` — **cùng một lá** với lời lẩm bẩm và câu trả lời hội thoại, nên cả trình duyệt lẫn desktop
        tự hiển thị trong vòng 1 giây, **không cần sửa phía tiêu thụ**. Đây là endpoint hành động, chỉ trả `{ ok }`; đọc văn bản từ
        `/state`.

        **Kiểm tra hợp lệ** (chỉ cần một điều kiện không đạt là trả HTTP 200 + `ok: false`, cùng quy ước với `POST /chat`):

        - Bắt buộc có `text`; sau `trim()` không được để trống;
        - **Không giới hạn độ dài hay tần suất**: việc bơm nội dung là hành động chủ động của bên gọi; bên gọi tự chịu trách nhiệm về nội dung và tần suất,
          host không âm thầm loại bỏ, cắt ngắn hay xếp hàng;
        - Bắt buộc có `pet`, và phải là thú cưng thật sự tồn tại (thiếu → `pet-required`, không tồn tại → `unknown-pet`);
        - **Có hai cách đính kèm ảnh, chỉ chọn một** (mục 1 "đăng ký tài nguyên" của issue #122):
          - `image`: chỉ chấp nhận tên **nằm trong kho meme của mục thú cưng đó** (tức khóa trong `memes` của mục đó và thực sự tồn tại trong chuỗi thư mục meme
            — `pet/<素材根>-memes/` (độc quyền) hoặc `memes/` → `assets/memes/` bên trong gói).
            Tên ngoài kho → `ok: false` + `reason: unknown-image` (dùng chung kiểm tra với chọn ảnh hội thoại);
          - `url`: **địa chỉ ảnh do bên thứ ba cung cấp**, URL đầy đủ, không tra kho — tài nguyên nằm ở bên gọi nên dĩ nhiên không có trong kho.
            Chỉ cho phép scheme `http` / `https` (`file:` sẽ cho tiến trình kết xuất desktop đọc được mọi tệp cục bộ).
          - **Cung cấp cả hai → `bad-request`**: hai dạng loại trừ lẫn nhau; không đoán ý định khi chưa rõ.
        - `duration` không bắt buộc, là thời gian hiển thị bong bóng (mili giây). Mặc định `10000`; **`0` là giá trị hợp lệ**, nghĩa đen là
          "không hiển thị" (yêu cầu vẫn được tiếp nhận, chỉ không kết xuất); số âm / `NaN` / `Infinity` / không phải số → `bad-request`.
          **Không đặt giới hạn trên** — bên gọi tự chịu trách nhiệm, như với nội dung và tần suất;
        - `anim` không bắt buộc, quyết định có phát kèm một lần hoạt ảnh `events.whisper` hay không. Mặc định `true` (= hành vi cũ).
          **Chỉ giá trị chính xác `false` mới tắt** (các giá trị như chuỗi `"false"` đều được xử lý là "phát kèm"). Khi tắt, phía kết xuất
          **không tra kho hoạt ảnh, không đổi nguồn**, nên cấu hình thú cưng không có `events.whisper` cũng không ảnh hưởng cách "chỉ bật bong bóng".

        Hai tham số mới **độc lập với nhau**, mỗi tham số điều khiển một việc:

        - `anim: false` + `duration: 3000` → chỉ bật bong bóng trong 3 giây, không phát hoạt ảnh;
        - `anim: true` + `duration: 0` → vẫn phát hoạt ảnh nhưng không bật bong bóng;
        - `duration: 0` **không** thu bong bóng đang hiển thị — việc đó thuộc `POST /bubble/clear`;
          hai thao tác được cố ý tách biệt.

        Khi ghi vào lá, `duration` / `anim` là **giá trị hiệu lực sau phân tích** (giá trị mặc định cũng được điền tường minh),
        nên đọc `/state` là thấy thời lượng và công tắc phát kèm thực tế, không cần tự đoán giá trị mặc định.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Nội dung muốn cho thú cưng nói. Sau `trim()` không được để trống; không giới hạn độ dài.
                image:
                  type: string
                  description: |
                    **Tên** ảnh tùy chọn (khóa trong cấu hình `memes` = tên tệp ảnh không có phần mở rộng, không gồm đường dẫn).
                    Phải có trong `memes` của mục thú cưng đó và thực sự tồn tại trong chuỗi thư mục meme; nếu không, trả `ok: false` +
                    `reason: unknown-image`. Chọn **một trong hai** với `url` (cung cấp cả hai → `bad-request`).
                  example: 可爱
                url:
                  type: string
                  format: uri
                  description: |
                    **Địa chỉ** ảnh tùy chọn — ảnh do bên thứ ba cung cấp, URL đầy đủ (mục 1 của issue #122).
                    Không tra kho meme; chỉ cho phép scheme `http` / `https`, các scheme khác → `ok: false` + `reason: bad-request`.
                    Chọn **một trong hai** với `image`.

                    **Plugin này không xử lý truy cập liên miền**: ảnh ở trình duyệt dùng `<img src>` (không bị CORS hạn chế),
                    nhưng hoạt ảnh dùng `fetch`; địa chỉ khác miền yêu cầu phía cung cấp tự gửi `Access-Control-Allow-Origin`.
                    Khi plugin và plugin bên thứ ba chạy trong cùng DSH, cùng cổng, địa chỉ cùng miền tự nhiên không gặp vấn đề này.
                  example: https://cdn.example.com/拒绝换壁纸.png
                duration:
                  type: number
                  minimum: 0
                  default: 10000
                  description: |
                    Thời gian hiển thị bong bóng (mili giây). Mặc định `10000`; `0` có nghĩa đen là "không hiển thị" (giá trị hợp lệ).
                    Số âm / số không hữu hạn / không phải số → `ok: false` + `reason: bad-request`. Không đặt giới hạn trên.
                  example: 3000
                anim:
                  type: boolean
                  default: true
                  description: |
                    Có phát kèm một lần hoạt ảnh `events.whisper` hay không. Mặc định `true` (hành vi cũ).
                    **Chỉ giá trị chính xác `false` mới tắt** — mọi giá trị khác (kể cả chuỗi `"false"`) đều được xử lý là "phát kèm".
                  example: false
                speak:
                  type: boolean
                  default: false
                  description: |
                    Lần này có **đọc thành tiếng** câu này hay không. Mặc định `false` = chỉ bật bong bóng, không phát âm thanh.
                    **Chỉ giá trị chính xác `true` mới phát** — mọi giá trị khác (kể cả chuỗi `"true"`) đều được xử lý là không phát.
                    Cần đồng thời qua hai điều kiện với `?surface=`: `speak: true` và `surface` chỉ định một phía cụ thể (`web` / `desktop`)
                    thì mới ghi `voiceTo`; với `both` / `any` / không có `surface`, không chỉ định phía nên không phía nào đọc.
                  example: true
            examples:
              textOnly:
                summary: Chỉ nói một câu (mặc định 10 giây + phát kèm hoạt ảnh)
                value:
                  text: 主人，该喝水了
              withMeme:
                summary: Kèm một meme có sẵn trong gói
                value:
                  text: 巡检完毕，一切正常
                  image: 厉害了我的鲸
              withUrl:
                summary: Kèm ảnh **do bạn tự lưu trữ** (cung cấp địa chỉ đầy đủ, không tra kho)
                value:
                  text: 巡检完毕，一切正常
                  url: https://cdn.example.com/拒绝换壁纸.png
              noAnimShort:
                summary: Chỉ bật bong bóng trong 3 giây, không phát hoạt ảnh nói
                value:
                  text: 该喝水了
                  duration: 3000
                  anim: false
      responses:
        "200":
          description: |
            Luôn trả 200 (trừ 405/400). Lỗi được biểu thị bằng `ok: false`; `reason` có thể là
            `bad-request` (văn bản trống / `duration` không hợp lệ / thiếu hoặc sai `surface`), `pet-required` (thiếu pet),
            `unknown-pet`, `unknown-image`, `generate-error` (ví dụ không đọc được cấu hình),
            `pet-not-displayed` (kèm `display`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'Phần thân yêu cầu không phải JSON hợp lệ (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/bubble/clear:
    post:
      tags: [Action]
      operationId: clearBubble
      summary: Xóa bong bóng — thu bong bóng lời nói đang hiển thị của thú cưng
      description: |
        Ghi một **lệnh xóa** vào `pets.<id>.say`; phía kết xuất thu bong bóng lời nói trong vòng 1 giây
        ("thu hồi sớm", mục 5 của issue #122). Đây là thao tác ngược với `POST /broadcast`: endpoint kia bật bong bóng, endpoint này thu bong bóng.

        **Chỉ thu bong bóng lời nói**:

        - Không ảnh hưởng bong bóng số dư hay trạng thái công việc;
        - Cũng **không** ảnh hưởng ba lá `anim` / `position` / `throw` — hoạt ảnh đang phát vẫn tiếp tục.
          Bong bóng và hành động là hai khóa, được **giải phóng riêng** (mục 5 của issue #122). Endpoint này không có nghĩa "dừng hoạt ảnh".

        **Xóa được biểu thị bằng một dạng riêng**: lá ghi `{ "clear": true }`, **không phải văn bản trống**.
        Phía tiêu thụ xem văn bản trống là không hợp lệ và bỏ qua cả lượt (xem `SayLeaf`), nên không thể biểu thị thao tác "xóa".

        **Có tính lũy đẳng**: nếu hiện không có bong bóng, vẫn trả `{ "ok": true }` — ý định "làm bong bóng biến mất" đã được thỏa mãn khi trạng thái đang trống,
        vì vậy endpoint này **không có lỗi kiểu "không tồn tại bong bóng"**.

        **Chốt kiểm soát chiếm dụng** (mục 4 của issue #122): khi đang có chiếm dụng, chỉ bên giữ khóa (có `?lock=` chính xác) mới được xóa —
        nếu không, bên thứ ba gọi một lần là xóa mất bong bóng của bên khác. **Khi không có chiếm dụng, bước này luôn được cho qua**, hành vi hoàn toàn như trước khi chỉnh sửa.

        **Không có phần thân yêu cầu.** Đây là endpoint hành động, chỉ trả `{ ok }`; để xác nhận kết quả, đọc `pets.<id>.say` trong `/state`.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      responses:
        "200":
          description: |
            Luôn trả 200 (trừ 405). Lỗi được biểu thị bằng `ok: false`; `reason` có thể là
            `pet-required` (thiếu pet), `unknown-pet` (id được chỉ định không tồn tại),
            `bad-request` (thiếu / sai `surface`), `pet-not-displayed` (kèm `display`),
            `generate-error` (ví dụ không đọc được cấu hình). **Không có bong bóng hiện tại không phải là lỗi.**
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/anim:
    post:
      tags: [Action]
      operationId: playAnimation
      summary: Phát hoạt ảnh theo yêu cầu — cho thú cưng phát một hoạt ảnh được chỉ định
      description: |
        Chọn **một trong hai** dạng (mục 1 "đăng ký tài nguyên" của issue #122):

        - **`name` (tên hoạt ảnh trong kho)**: hiệu ứng **hoàn toàn giống khi bấm cây "Hành động" trong menu chuột phải** — cả hai phía dùng chung
          hàm xử lý thao tác menu (trình duyệt `handleMenuAction` / desktop `sprite.onMenuAction`), nên các ngữ nghĩa tự nhất quán: hiệu chỉnh gương
          (hoạt ảnh chữ bị ép quay trái trước khi phát nếu hướng đang là phải), hoạt ảnh di chuyển thực sự dịch chuyển, các hoạt ảnh khác phát một lần.
          Tên được ghi vào `pets.<id>.anim`; phía tiêu thụ phát bằng cách đổi nguồn sau khi phát hiện `counter` thay đổi trong vòng 1 giây.
          **Tên hoạt ảnh cũng là tên tệp tài nguyên** (`/dsh-pet-7340/thumb/<素材根>/<名字>.webm`), vì vậy tên phải là một trong các tên có thể bấm trong cấu hình
          `animations` của thú cưng — phía phát không có phương án dự phòng cho tên không tồn tại
          (404 → tải thất bại → biểu hiện là "bấm mà không có phản hồi"), nên host chặn trước khi ghi.
        - **`url` (địa chỉ tài nguyên do bên thứ ba cung cấp)**: URL đầy đủ, **không tra kho hoạt ảnh** — tài nguyên nằm ở bên gọi,
          đương nhiên tên này không có trong kho. Chỉ cho phép scheme `http` / `https` (`file:` cho phép tiến trình kết xuất desktop đọc
          mọi tệp cục bộ). Khi nhận được, phía tiêu thụ **đổi nguồn và phát trực tiếp một lần, không dùng ngữ nghĩa menu** — địa chỉ thuần không có thuộc tính "có phải hoạt ảnh chữ / di chuyển hay không". Cả hai phía đều chỉ "chèn phát một đoạn": phát xong thì quay lại chuỗi hoạt ảnh bình thường.

        **Kiểm tra hợp lệ** (chỉ cần một điều kiện không đạt là trả HTTP 200 + `ok: false`):

        - Phải cung cấp **đúng một** trong `name` và `url`: cung cấp cả hai hoặc không cung cấp cái nào → `bad-request` (ý định không rõ, không đoán
          thay bên gọi);
        - Nếu có `name`, tên phải nằm trong kho hoạt ảnh của thú cưng đó; nếu có `url`, phải là địa chỉ đầy đủ dùng http/https;
        - Bắt buộc có `pet`, và phải là thú cưng thật sự tồn tại (thiếu → `pet-required`, không tồn tại → `unknown-pet`);
        - `facing` không bắt buộc; nếu có thì phải là `left` / `right`, nếu không → `bad-request`
          (giá trị sai **không bị âm thầm bỏ qua**, theo cùng quy ước với `mode` của `POST /position`).

        **Hướng quay (`facing`, tùy chọn)**

        `left` = giữ nguyên tài nguyên, `right` = lật gương (phía kết xuất áp dụng `scaleX(-1)`).

        - **Không truyền thì không đổi hướng**: thú cưng giữ nguyên hướng **hiện tại** — không phải "mặc định về `left`"; lá `S` thậm chí không ghi trường này
          (do đó có thể phân biệt về cấu trúc giữa "không yêu cầu" và "yêu cầu `left`");
        - Nếu truyền thì đặt hướng đó và **giữ nguyên**, đến khi thú cưng tự phát xong một hoạt ảnh quay hướng (kho `animations.turn`) để đổi hướng,
          hoặc lần phát theo yêu cầu tiếp theo chỉ định hướng khác;
        - Áp dụng cho **cả hai** dạng `name` và `url` (`url` không dùng ngữ nghĩa menu nhưng vẫn lật gương);
        - **Giá trị chỉ định tường minh ưu tiên hơn hiệu chỉnh gương phía kết xuất "ép hoạt ảnh chữ (nhóm `noMirror`) quay trái trước khi phát"**:
          muốn `right` thì chỉ định `right` — đổi lại chữ trong hoạt ảnh chữ cũng sẽ bị lật gương.

        **Plugin này không xử lý truy cập liên miền**: phía tiêu thụ cả hai nền tảng đều dùng `fetch` + blob (để tránh hiện tượng stall khi tải luồng),
        vì vậy **địa chỉ khác miền yêu cầu phía cung cấp tự gửi `Access-Control-Allow-Origin`**. Khi plugin và plugin bên thứ ba chạy cùng
        DSH, cùng cổng, địa chỉ cùng miền tự nhiên không gặp vấn đề — host **không làm proxy**, vì vậy cũng không có bề mặt SSRF.

        **Nhiều thú cưng: kho hoạt ảnh được chia theo "mục", không phải một kho toàn cục**

        Thú cưng trong cấu hình chính dùng chung kho của mục `main`; mỗi loại được định nghĩa trong `pet/<名>-config.json` dùng `animations` riêng trong
        tệp đó (nhiều phiên bản cùng loại chia sẻ một kho). Vì vậy, muốn biết "thú cưng này có thể phát hoạt ảnh nào" phải tra theo mục của nó —
        **dùng tên của thú cưng chính để phát cho thú cưng pet pack chắc chắn sẽ nhận `unknown-animation`**:

        1. `GET /config` → mỗi khóa cấp cao nhất là một mục (`main`, `test1`…), `pets[]` bên dưới mục đó là các phiên bản của nó;
        2. Dựa vào id trong `?pet=` để tìm mục chứa thú cưng đó;
        3. `animations` của mục đó là tập hoạt ảnh có thể phát cho thú cưng này (hợp của bảy kho `idle` / `turn` / `drag` / `clicks` /
           `moves.actions` / `categories` / `events`, loại bỏ trùng lặp để khớp với menu chuột phải).

        Ngoài ra, **tài nguyên pet pack là độc quyền** (`pet/<素材根>-animation/`, không dùng lại kho tài nguyên chính): tên còn phải
        thực sự tồn tại trong thư mục đó; nếu không, host vẫn cho qua (kiểm tra chỉ dựa vào kho), nhưng phía phát tải tài nguyên sẽ nhận 404 và biểu hiện là "bấm mà không có phản hồi".

        **Lưu ý**: ngữ nghĩa `once` là "chèn phát một đoạn" — phát xong sẽ quay lại chuỗi hoạt ảnh bình thường (giống bấm một lần trong menu).
        Khi phát cùng một hoạt ảnh liên tiếp hai lần, `counter` tăng và thông thường hoạt ảnh sẽ phát lại; nhưng nếu lần thứ hai xảy ra trong khoảng
        phía phát chưa sẵn sàng sau lần chuyển nguồn trước đó, logic chống lặp có thể bỏ qua (biểu hiện là chỉ phát một lần).
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Phải cung cấp **đúng một** trong `name` và `url`. Cung cấp cả hai hoặc không cung cấp cái nào → `ok: false` + `reason: bad-request`.
              properties:
                name:
                  type: string
                  description: |
                    Tên hoạt ảnh cần phát. Phải là tên có thể bấm trong cấu hình `animations` của thú cưng đó
                    (hợp của bảy kho `idle` / `turn` / `drag` / `clicks` / `moves.actions` / `categories` /
                    `events`), nếu không trả `ok: false` + `reason: unknown-animation`.
                    Chọn một trong hai với `url`.
                  example: 东张西望
                url:
                  type: string
                  format: uri
                  description: |
                    **Địa chỉ** tài nguyên cần phát — hoạt ảnh do bên thứ ba cung cấp, URL đầy đủ (mục 1 của issue #122).
                    **Không tra kho hoạt ảnh**; chỉ cho phép scheme `http` / `https`, các scheme khác → `ok: false` +
                    `reason: bad-request`. Chọn một trong hai với `name`.

                    Phía tiêu thụ không dùng ngữ nghĩa menu (không hiệu chỉnh gương / dịch chuyển thật), chỉ đổi nguồn và phát một lần.
                    Trình duyệt áp đặt giới hạn truy cập liên miền mà plugin không thể vượt qua: địa chỉ bên ngoài yêu cầu phía cung cấp gửi `Access-Control-Allow-Origin`,
                    còn cùng miền (plugin bên thứ ba đăng ký tuyến riêng trên cùng cổng DSH) thì không gặp vấn đề này.
                  example: https://cdn.example.com/拉侧栏.webm
                facing:
                  type: string
                  enum: [left, right]
                  description: |
                    **Hướng quay** khi phát đoạn này (tùy chọn). `left` = giữ nguyên tài nguyên, `right` = lật gương.
                    **Không truyền thì không đổi hướng** (giữ hướng hiện tại của thú cưng, không mặc định về `left`); nếu truyền thì phải là một trong hai giá trị
                    này, nếu không trả `ok: false` + `reason: bad-request` (giá trị sai không bị âm thầm bỏ qua).
                    Giá trị chỉ định tường minh ưu tiên hơn hiệu chỉnh gương "ép hoạt ảnh chữ quay trái trước khi phát".
                  example: right
            examples:
              turn:
                summary: Phát một hoạt ảnh quay hướng (tên trong kho)
                value:
                  name: 东张西望
              facing:
                summary: Chỉ định hướng quay (sang phải, lật gương)
                value:
                  name: 东张西望
                  facing: right
              move:
                summary: Phát hoạt ảnh di chuyển (thú cưng thực sự di chuyển, giống thao tác trong menu)
                value:
                  name: 螃蟹走路
              byUrl:
                summary: Phát hoạt ảnh **do bạn tự lưu trữ** (cung cấp địa chỉ đầy đủ, không tra kho)
                value:
                  url: https://cdn.example.com/拉侧栏.webm
      responses:
        "200":
          description: |
            Luôn trả 200 (trừ 405/400). Lỗi được biểu thị bằng `ok: false`; `reason` có thể là
            `bad-request` (tên trống / `facing` không hợp lệ / thiếu hoặc sai `surface`), `pet-required` (thiếu pet),
            `unknown-pet`, `unknown-animation`, `generate-error` (ví dụ không đọc được cấu hình),
            `pet-not-displayed` (kèm `display`).
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required: [playbackId]
                        properties:
                          playbackId:
                            type: string
                            description: |
                              **Mã xác nhận** cho lần phát theo yêu cầu này. `ok: true` chỉ có nghĩa là yêu cầu đã được tiếp nhận;
                              dùng mã này để tra `GET /playback/{id}` mới biết hoạt ảnh đã phát xong hay chưa.
                            example: pb-mfh2k1-1
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'Phần thân yêu cầu không phải JSON hợp lệ (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/position:
    post:
      tags: [Action]
      operationId: setPetPosition
      summary: Điều khiển vị trí — di chuyển thú cưng đến vị trí chỉ định
      description: |
        Di chuyển thú cưng được chỉ định đến tọa độ chuẩn hóa và ghi vào `pets.<id>.position`; phía kết xuất sẽ thực hiện sau khi phát hiện
        `counter` thay đổi trong vòng 1 giây. Đây là endpoint hành động, chỉ trả `{ ok }` (khi thành công còn trả `x`/`y` sau khi host giới hạn tọa độ).

        **Ý nghĩa tọa độ (khác nhau giữa hai phía, hãy đọc kỹ)**: `x`/`y` là tọa độ chuẩn hóa của **tâm** thú cưng, hợp lệ trong `0~1`.
        Chọn tâm thay vì góc trên bên trái để bên gọi **không cần biết kích thước thú cưng** — nếu dùng góc trên bên trái, muốn căn giữa phải vào
        `GET /config` để tra `size` của thú cưng này trước.

        - **Lớp phủ trình duyệt**: `0~1` là **khung nhìn**. `0.5` = chính giữa màn hình.
        - **Desktop**: `0~1` là **hình chữ nhật bao quanh hợp của vùng làm việc trên tất cả màn hình** — không phải màn hình chính hay riêng một màn hình nào.
          Với hai màn hình đặt cạnh nhau, `x: 0.5` rơi vào đường nối giữa hai màn hình; với ba màn hình cùng chiều rộng, `x: 1/3` xấp xỉ mép trái màn hình thứ hai.
          Vì vậy, **cùng một `x` có ý nghĩa khác nhau trên hai phía**; bên gọi cần biết mình đang thao tác với phía nào.

        **Tọa độ vượt biên hoặc không thể tới đều bị giới hạn**:

        - **Vượt `0~1`**: host giới hạn về biên trước khi ghi.
        - **Rơi vào khoảng trống giữa các màn hình** (chỉ desktop): hình chữ nhật bao có **những vùng trống lớn không thuộc màn hình nào** trong bố cục không đều
          (đã đo, khoảng 23.7% diện tích của cấu hình hai màn hình dạng chữ T ngược bên phải là khoảng trống). Điểm đến được giới hạn về **màn hình có thể tới gần nhất**; tiêu chí
          hoàn toàn giống `relayout()` của host (đưa thú cưng về vùng nhìn thấy sau khi màn hình thay đổi).

        `x`/`y` trong phản hồi là giá trị **sau khi host giới hạn**.

        **Cho phép nửa thân vượt khỏi màn hình**: truyền `0.01` thì thú cưng thực sự được chuyển đến đó, không giới hạn thêm theo kiểu "thân chạm mép".
        Khi người dùng kéo thủ công, thú cưng vẫn chạm mép bằng thân — hai đường xử lý không ảnh hưởng lẫn nhau.

        **Không đụng đến hoạt ảnh**: đây là giao diện chỉ điều khiển vị trí — không đổi `anim`, không phát hoạt ảnh đi bộ. Nếu thú cưng đang đi, lời gọi này sẽ
        ngắt chuyển động đi bộ và kết thúc theo logic hiện có.

        **Âm thầm bỏ qua nếu trùng lúc người dùng kéo**: phía kết xuất phát hiện ngón tay đang chạm lên thú cưng (kể cả bấm và kéo) thì bỏ qua lượt này.
        Lúc đó endpoint vẫn **trả `ok: true`** — endpoint hành động chỉ có nghĩa là "đã tiếp nhận", không có nghĩa "đã có hiệu lực" (cùng hợp đồng với `POST /anim`).
        Lượt bị bỏ qua không làm thay đổi lá, bên gọi cũng không thể quan sát qua `/state`.

        **Bắt buộc có `mode`, gồm ba chế độ di chuyển** (cả ba đều dùng động học sẵn có ở phía kết xuất; giao diện này chỉ chọn cách di chuyển):

        | `mode` | Cách di chuyển |
        | --- | --- |
        | `instant` | Đến vị trí trong một khung hình |
        | `spring` | Dùng lò xo quá giảm chấn như khi kéo theo con trỏ (`springStep`) để đuổi theo mượt mà — **không có thời gian hành trình**, tự kết thúc khi "đủ gần và đủ chậm" |
        | `line` | Đi **theo đường thẳng** trong `duration` mili giây (nội suy trong không gian pixel), đến đích chính xác |

        `duration` **chỉ bắt buộc với chế độ `line`** (số hữu hạn không âm, `0` = đến nơi ngay); ở chế độ `instant` / `spring`,
        nếu có truyền thì cũng **bị bỏ qua** — bên gọi thường dùng lại nguyên mẫu body; báo lỗi vì trường này chỉ buộc họ phải xóa trường đó đi.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, y, mode]
              properties:
                x:
                  type: number
                  description: |
                    Tọa độ ngang chuẩn hóa của **tâm** thú cưng, hợp lệ `0~1`. Tọa độ vượt biên hoặc rơi vào khoảng trống giữa nhiều màn hình trên desktop
                    đều bị giới hạn (xem mục "Ý nghĩa tọa độ" ở trên).
                  example: 0.5
                y:
                  type: number
                  description: |
                    Tọa độ dọc chuẩn hóa của **tâm** thú cưng, hợp lệ `0~1`. Tọa độ vượt biên hoặc rơi vào khoảng trống giữa nhiều màn hình trên desktop
                    đều bị giới hạn (xem mục "Ý nghĩa tọa độ" ở trên).
                  example: 0.35
                mode:
                  type: string
                  enum: [instant, spring, line]
                  description: |
                    Chế độ di chuyển, **bắt buộc**; thiếu hoặc không phải một trong ba giá trị này → `bad-request`.
                  example: line
                duration:
                  type: number
                  description: |
                    Thời gian hành trình của chế độ `line` (mili giây): **bắt buộc ở chế độ này**, là số hữu hạn không âm, `0` = đến nơi ngay;
                    số âm / `NaN` / `Infinity` / không phải số → `bad-request`. **Không đặt giới hạn trên**.
                    Trường này bị bỏ qua trong chế độ `instant` / `spring`.
                  example: 1200
              examples:
                instant:
                  summary: Nhảy ngay đến góc dưới bên trái
                  value:
                    x: 0.05
                    y: 0.9
                    mode: instant
                spring:
                  summary: Dùng lò xo để di chuyển mượt đến phía trên, gần chính giữa màn hình
                  value:
                    x: 0.5
                    y: 0.35
                    mode: spring
                line:
                  summary: Đi thẳng trong 1,2 giây đến phía trên, gần chính giữa màn hình
                  value:
                    x: 0.5
                    y: 0.35
                    mode: line
                    duration: 1200
      responses:
        "200":
          description: |
            Luôn trả 200 (trừ 405/400): lỗi được biểu thị bằng `ok: false`, nên bên gọi chỉ cần phân tích một lớp.
            Khi thành công, trả thêm `x`/`y` — **giá trị sau khi host giới hạn**.
            Các `reason` khác: `bad-request` (tọa độ/chế độ không hợp lệ / thiếu hoặc sai `surface`),
            `pet-not-displayed` (kèm `display`).
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required: [x, y]
                        properties:
                          x:
                            type: number
                            description: Tọa độ ngang có hiệu lực thực tế (sau khi giới hạn)
                          y:
                            type: number
                            description: Tọa độ dọc có hiệu lực thực tế (sau khi giới hạn)
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'Phần thân yêu cầu không phải JSON hợp lệ (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/throw:
    post:
      tags: [Action]
      operationId: throwPet
      summary: Ném tự nhiên — cấp vận tốc ban đầu để thú cưng bay đi
      description: |
        Cấp vận tốc ban đầu cho thú cưng được chỉ định và ghi vào `pets.<id>.throw`; phía kết xuất sẽ thực hiện khi phát hiện `counter`
        thay đổi qua lần thăm dò trong vòng 1 giây. Thú cưng **cất cánh từ vị trí hiện tại**, không cần bị "bắt" trước.

        **Hiệu ứng vật lý hoàn toàn giống khi người dùng tự tay vung ném**: trọng lực, nảy khi va vào tường, ma sát mặt đất, xác định vượt ranh giới nhiều màn hình, hiệu ứng nén bật nảy khi tiếp đất,
        va chạm giữa các thú cưng (khi bật `petCollision` trong cấu hình), và cập nhật vị trí sau khi dừng đều đi cùng một luồng xử lý.

        **Đơn vị của `angle` là độ, `0` = hướng phải, ngược chiều kim đồng hồ là chiều dương**: `90` = hướng lên, `-90` = hướng xuống.
        Lưu ý đây là **quy ước toán học**, không phải quy ước màn hình (trục y trên màn hình hướng xuống), vì vậy "ném lên" phải ghi `90`, không phải `270`.
        Mọi số thực đều hợp lệ; không cần tự chuẩn hóa về `0~360`.

        **Quan hệ giữa `power` và giới hạn mềm 3600 px/s** (điểm này dễ nhầm): vận tốc ban đầu = `power × 1200`,
        sau đó áp dụng giới hạn tốc độ mềm hiện có `3600 × (1 − e^(−v/3600))` — cùng giới hạn tốc độ với thao tác kéo rồi vung ném. Vì vậy:

        | `power` | Vận tốc ban đầu thực tế |
        | --- | --- |
        | `1.0` | ≈ 1021 px/s |
        | `3.0` | ≈ 2276 px/s |
        | → ∞ | → 3600 px/s |

        Nghĩa là `1.0` là mốc **trước khi áp dụng giới hạn mềm**, không phải vận tốc ban đầu thực tế. Mọi giá trị `power` đều tăng đơn điệu, phân biệt được và luôn không vượt quá 3600.

        **Mọi giá trị `power` đều thực sự tạo ra cú ném**: khi thả sau thao tác kéo, vận tốc dưới 500 px/s được xem là "đặt xuống nhẹ nhàng" (theo ngữ nghĩa kéo, tức là tay đã dừng), nhưng endpoint này không có ngưỡng đó; `power` nhỏ đến đâu cũng vẫn ném.

        **Nếu trùng lúc người dùng đang kéo thì lệnh bị âm thầm bỏ qua**: giống `POST /position`, và cũng trả về `ok: true`.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [angle, power]
              properties:
                angle:
                  type: number
                  description: |
                    Hướng, đơn vị là **độ**. `0` = hướng phải, **ngược chiều kim đồng hồ là chiều dương** (`90` = hướng lên, `-90` = hướng xuống).
                    Mọi số thực đều hợp lệ, không cần tự chuẩn hóa.
                  example: 45
                power:
                  type: number
                  exclusiveMinimum: 0
                  description: |
                    Hệ số lực, phải > 0. `1.0` tương ứng 1200 px/s **trước khi áp dụng giới hạn tốc độ mềm**
                    (vận tốc ban đầu thực tế khoảng 1021 px/s, xem bảng trên).
                  example: 1
              examples:
                upRight:
                  summary: Ném lên phía trên bên phải, lực vừa
                  value:
                    angle: 45
                    power: 1
                hardLeft:
                  summary: Vung mạnh lên phía trên bên trái
                  value:
                    angle: 135
                    power: 3
      responses:
        "200":
          description: |
            Luôn là 200 (ngoại trừ 405/400). Lỗi được biểu thị bằng `ok: false`; `reason` có thể là
            `bad-request` (góc/lực không hợp lệ / thiếu hoặc sai `surface`), `pet-required` (không cung cấp pet),
            `unknown-pet`, `generate-error` (không đọc được cấu hình, v.v.), `pet-not-displayed` (kèm `display`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'Nội dung yêu cầu không phải JSON hợp lệ (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/lock:
    post:
      tags: [Action]
      operationId: acquireLock
      summary: Khóa chiếm quyền — lấy khóa / gia hạn (gộp một)
      description: |
        Mục 4 của issue #122: "chiếm quyền hành động/bong bóng độc lập". Khi plugin bên thứ ba cần thực hiện một chuỗi phối hợp (mở thanh bên / nhảy bắt linh vật /
        đá vào thanh bên), trước tiên hãy lấy khóa. Trong thời gian này, plugin **độc quyền** điều khiển thú cưng: ngoài bên giữ khóa, không ai có thể tác động — 5 endpoint hành động
        (`/anim`, `/broadcast`, `/position`, `/throw`, `/bubble/clear`) phải kèm `?lock=<lockId>`,
        còn hoạt ảnh ngẫu nhiên, tự đi lại, tự lẩm bẩm, tự hiển thị số dư và biểu hiện trạng thái làm việc của thú cưng đều nhường quyền.

        **Lấy khóa sẽ đánh thức thú cưng đang ngủ trước** (khóa = bên thứ ba tiếp quản): `pets.<id>.sleep` lập tức được ghi thành `sleeping: false`,
        phía kết xuất phát hoạt ảnh "thức dậy" một lần rồi vào chuỗi hoạt ảnh bình thường; gọi lại `POST /sleep` trong khi bị chiếm quyền sẽ trả về `locked`.

        **Lấy khóa sẽ ngắt lần phát theo yêu cầu đang chạy**: hoạt ảnh ở tiền cảnh bị tạm dừng tại thời điểm đó, nhưng **mở băng sẽ không tiếp tục hoạt ảnh ấy**
        (mở băng sẽ quay về idle / khôi phục cấp độ, tương đương thay nguồn và ghi đè hoạt ảnh đó), vì vậy hoạt ảnh thực sự không phát đến hết — biên nhận báo đúng
        `cancelled` + `reason: frozen`, thay vì để `playing` mãi khiến bên gọi đang chờ `?wait=ended` phải đợi vô ích đến hết timeout. **Lần phát theo yêu cầu của bên giữ khóa không bị ảnh hưởng** (thứ tự bình thường là lấy khóa rồi mới yêu cầu phát; gia hạn cũng không đóng băng lại).

        **Một khóa, toàn bộ hoặc không gì cả**, và **các bên thứ ba không giành quyền của nhau**: ai đến trước được trước; nếu khóa đã có thì trả về `locked` + `expiresAt`
        để quyết định lúc nào thử lại. Chỉ **người dùng** có thể giành quyền — kéo / nhấp vào thú cưng hoặc ẩn / đóng nó sẽ thu hồi quyền chiếm ngay lập tức
        (dạng `force` của `POST /lock/release`, do phía kết xuất báo lên).

        **Lấy khóa và gia hạn dùng chung một endpoint**: có `lockId` nghĩa là gia hạn; không có thì tạo khóa mới.
        Bên giữ khóa cần thực hiện **heartbeat** vài giây một lần để gia hạn; chính lần gọi này đồng thời thăm dò "khóa của tôi còn hiệu lực không"
        — nếu mất khóa thì trả về `lock-lost` + `cause`, do đó không có endpoint "kiểm tra khóa" riêng.

        **Bảng chân trị** (mỗi ô có kết quả xác định, không phỏng đoán thay bên gọi):

        | body | Khóa hiện tại | Kết quả |
        | --- | --- | --- |
        | Không có `lockId` | Không có khóa | Tạo mới |
        | Không có `lockId` | Có khóa | `locked` + `expiresAt` |
        | Có `lockId` | Khớp | Gia hạn (giữ nguyên mã) |
        | Có `lockId` | Có khóa nhưng không khớp | `lock-lost` / `unknown` |
        | Có `lockId` | Không có khóa | `lock-lost` / `cause` trong tombstone |

        **Có id nhưng hiện không có khóa thì luôn báo lỗi, không khôi phục**: sau khi hết hạn / được giải phóng / bị giành quyền, không thể dùng mã cũ để gia hạn,
        cũng không thể dùng cách này tạo lại khóa — nếu không, sự thật "tôi đã mất khóa" sẽ bị âm thầm xóa đi và bên giữ khóa tưởng chuỗi phối hợp vẫn đang diễn ra.

        **Có giới hạn**: trạng thái lưu trong bộ nhớ + TTL (mặc định 2 phút, tối đa 30 phút); gỡ plugin / khởi động lại host sẽ làm toàn bộ khóa hết hiệu lực —
        nếu bên gọi bị lỗi, thú cưng cũng không bị khóa vĩnh viễn. **Không có bộ định thời**: hết hạn được kiểm tra theo kiểu lười; `expiresAt` trong lá `/state`
        là nguồn sự thật duy nhất, phía kết xuất tự **bỏ trạng thái đứng yên** dựa vào đó (xem `LockLeaf`).

        **Khi không có khóa, phân nhánh theo việc có gửi `lock` hay không**: không gửi → mọi thứ như cũ, hành vi của 5 endpoint hành động giống nguyên văn trước khi thay đổi
        (ranh giới quan trọng nhất của issue #122: "khi không có chiếm quyền phối hợp hợp lệ, API không thay đổi hành vi ban đầu của pet"); có gửi nhưng không tìm thấy khóa
        → `lock-lost` + `cause`, hợp đồng thuê cũ không thể tiếp tục thực hiện yêu cầu đến muộn (mục 4 của issue #122).
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lockId:
                  type: string
                  description: Có = **gia hạn**, không có = **tạo mới**. Phải là mã đang có hiệu lực hiện tại.
                  example: lk-mfh2k1-1
                ttl:
                  type: number
                  default: 120000
                  minimum: 1000
                  maximum: 1800000
                  description: |
                    Thời gian chiếm quyền (mili giây). Mặc định là `120000` (2 phút), phạm vi `1000~1800000` (1 giây~30 phút);
                    khi gia hạn, mặc định **dùng lại giá trị ban đầu**.
                    Mặc định 2 phút là có chủ ý: một chuỗi phối hợp thường kéo dài từ vài chục giây đến một hoặc hai phút; **ngay cả khi bên gọi chưa triển khai gia hạn
                    hoặc bỏ lỡ một nhịp thì cũng không mất khóa giữa chừng** (mất khóa sẽ khiến thú cưng được mở băng ngay, rất khó truy tìm nguyên nhân).
                    Giá trị vượt phạm vi / không hữu hạn → `ok: false` + `reason: bad-request` (**không kẹp giá trị**: nếu bên gọi nhập sai thời lượng,
                    cần biết ngay thay vì nhận được khóa ngắn hơn hoặc dài hơn dự định).
                  example: 120000
            examples:
              acquire:
                summary: Lấy khóa (mặc định 2 phút)
                value: {}
              renew:
                summary: Gia hạn (kéo dài thêm 2 phút cho cùng mã khóa)
                value:
                  lockId: lk-mfh2k1-1
      responses:
        "200":
          description: |
            Luôn là 200 (ngoại trừ 405/400). Lỗi được biểu thị bằng `ok: false`; `reason` có thể là
            `bad-request` (`ttl` / `lockId` không hợp lệ / thiếu hoặc sai `surface`), `pet-required` (không cung cấp pet),
            `unknown-pet`, `locked` (kèm `expiresAt`), `lock-lost` (kèm `cause`),
            `pet-not-displayed` (kèm `display` — không lấy được khóa: thú cưng này hiện không hiển thị ở phía bạn muốn).
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required: [lockId, petId, expiresAt]
                        properties:
                          lockId:
                            type: string
                            description: Mã của lần chiếm quyền này. Mọi thao tác tiếp theo đều phải kèm mã này (`?lock=`).
                            example: lk-mfh2k1-1
                          petId:
                            type: string
                            description: Thú cưng nào đang được chiếm quyền.
                            example: main
                          expiresAt:
                            type: integer
                            format: int64
                            description: Thời điểm hết hạn (epoch mili giây).
                            example: 1755000030000
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'Nội dung yêu cầu không phải JSON hợp lệ (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/lock/release:
    post:
      tags: [Action]
      operationId: releaseLock
      summary: Giải phóng quyền chiếm (bên giữ khóa kết thúc / người dùng tiếp quản)
      description: |
        Thu hồi quyền chiếm hiện tại trên thú cưng này; mọi thứ lập tức trở về bình thường (ghi tiếp nguồn tự động, chuỗi ngẫu nhiên tiếp tục tung xúc xắc, phía kết xuất bỏ đóng băng).

        **Chọn đúng một trong hai dạng** (`lockId` và `force` phải **có chính xác một**, có cả hai hoặc không có cái nào → `bad-request`):

        - `lockId`: **bên giữ khóa tự kết thúc**, ghi `cause` là `released`;
        - `force: true`: **phía kết xuất** báo "người dùng đã tiếp quản" — gọi khi người dùng kéo / nhấp vào thú cưng hoặc ẩn / đóng nó,
          ghi `cause` là `preempted`. Bên thứ ba không cần gọi dạng này.

        Vì sao "người dùng tiếp quản" phải do phía kết xuất báo: khóa nằm trong bộ nhớ của host, còn **sự kiện chuột không đến được host** — phía kết xuất là nơi duy nhất
        biết người dùng đã thao tác. Nếu không báo, sau khi người dùng kéo thú cưng đi, khóa vẫn còn và thú cưng tiếp tục bị đóng băng đến khi TTL hết
        (issue #122: "Khi người dùng chủ động dừng, ẩn hoặc đóng, cũng cần hủy được chuỗi phối hợp để tránh thú cưng bị khóa vĩnh viễn").

        **Có tính lũy đẳng**: khi hiện không có quyền chiếm, vẫn trả về `{ "ok": true }` — ý định "làm khóa biến mất" đã được đáp ứng khi trạng thái vốn trống.
        Nhưng nếu đang có khóa mà `lockId` **không khớp**, bắt buộc báo lỗi (`lock-lost`): không được giải phóng nhầm khóa của người khác.

        **Không tác động đến bản thân hoạt ảnh / bong bóng / vị trí**: hoạt ảnh đang chạy vẫn tiếp tục, bong bóng vẫn dùng bộ định thời riêng. Endpoint này chỉ thu hồi "quyền điều khiển".
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                `lockId` và `force` phải **có chính xác một**. Có cả hai hoặc không có cái nào → `ok: false` + `reason: bad-request`.
              properties:
                lockId:
                  type: string
                  description: "Bên giữ khóa kết thúc: mã chiếm quyền hiện đang có hiệu lực."
                  example: lk-mfh2k1-1
                force:
                  type: boolean
                  description: |
                    **Chỉ chấp nhận đúng `true`** (cách hiểu lỏng lẻo có thể xem giá trị truyền nhầm là thật, dẫn đến thu hồi khóa của người khác — thà kiểm tra nghiêm ngặt).
                    Phía kết xuất dùng giá trị này để thu hồi khóa vô điều kiện khi người dùng kéo / nhấp / ẩn / đóng.
                  example: true
            examples:
              byHolder:
                summary: Bên giữ khóa kết thúc
                value:
                  lockId: lk-mfh2k1-1
              byUser:
                summary: Phía kết xuất báo người dùng tiếp quản (kéo / nhấp)
                value:
                  force: true
      responses:
        "200":
          description: |
            Luôn là 200 (ngoại trừ 405/400). Lỗi được biểu thị bằng `ok: false`; `reason` có thể là
            `bad-request` (cả hai đều có / đều thiếu / sai kiểu), `pet-required` (không cung cấp pet),
            `unknown-pet`, `lock-lost` (`lockId` không khớp, kèm `cause`). **Hiện không có khóa không phải là lỗi.**
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'Nội dung yêu cầu không phải JSON hợp lệ (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/sleep:
    post:
      tags: [Action]
      operationId: putPetToSleep
      summary: Cho thú cưng đi ngủ (host chọn cả bộ hoạt ảnh ngủ và ghi vào lá trạng thái)
      description: |
        Chuyển sang trạng thái ngủ. Host chọn ngẫu nhiên **cả bộ** từ `animations.sleep` của mục này, sau đó chọn ngẫu nhiên một hoạt ảnh trong các ứng viên cho từng đoạn,
        ghi vào `pets.<id>.sleep` và trả về tên của cả ba đoạn trong phản hồi; phía kết xuất dùng các giá trị đó để phát "bắt đầu (một lần) →
        lặp (vô hạn)". Đánh thức bằng `POST /wake` hoặc khi người dùng nhấp vào thú cưng.

        Trong khi ngủ: host bỏ qua các nguồn tự động (lẩm bẩm / số dư / nhắc việc cần làm), đồng thời từ chối các endpoint thủ công (`anim` / `whisper`
        / `chat` / `balance` / `broadcast` / `bubble/clear` / `menu/click`); khi từ chối, trả về
        `reason: sleeping` và hiển thị một câu thoại từ `sleepRefuseTexts` cấp mục. **Nhường quyền khi đang giữ khóa**:
        lệnh gọi kèm `lock=` không bị giới hạn bởi trạng thái ngủ (ý nghĩa của khóa chính là trao quyền điều khiển cho bên thứ ba).

        **Có tính lũy đẳng**: nếu đã ngủ thì giữ nguyên bộ hoạt ảnh hiện tại, không phát lại, vẫn trả về `ok: true` (`changed: false`).
        Nếu mục này không cấu hình `animations.sleep` → `ok: false` + `reason: no-sleep-animations`.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
      responses:
        "200":
          description: |
            Luôn là 200 (ngoại trừ 405). Thành công kèm `sleeping: true` và các giá trị `start` / `loop` / `end` được chọn lần này;
            lỗi được biểu thị bằng `ok: false`; `reason` có thể là `bad-request`, `pet-required`, `unknown-pet`,
            `locked` / `lock-required` / `lock-lost` (chặn do quyền chiếm), `no-sleep-animations`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/wake:
    post:
      tags: [Action]
      summary: Đánh thức thú cưng đang ngủ
      operationId: wakePet
      description: |
        Thoát trạng thái ngủ: host ghi `pets.<id>.sleep = { sleeping: false }`; phía kết xuất phát hoạt ảnh "thức dậy (một lần)" rồi
        quay lại chuỗi ngẫu nhiên. **Có tính lũy đẳng**: nếu vốn không ngủ thì vẫn trả về `ok: true` (`changed: false`).
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
      responses:
        "200":
          description: |
            Luôn là 200 (ngoại trừ 405). Thành công kèm `sleeping: false` và `changed` (lần này có thực sự tỉnh dậy hay không);
            lỗi được biểu thị bằng `ok: false`; `reason` có thể là `pet-required`, `unknown-pet` hoặc ba lý do chặn do quyền chiếm.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/pose:
    get:
      tags: [Action]
      operationId: getPetPose
      summary: Đọc trạng thái thực tế của thú cưng trên desktop (vị trí + hướng)
      description: |
        Trả về trạng thái thực tế được báo lên gần nhất của thú cưng **trên desktop**: tọa độ chuẩn hóa của **tâm** thú cưng + hướng.

        **Chỉ desktop có endpoint này.** Vị trí thú cưng trên web **vốn thuộc riêng từng trang** (khi mở hai tab, vị trí hai bên vốn đã
        khác nhau); lưu một ảnh chụp trạng thái vào host sẽ sai về mặt ngữ nghĩa (bản ghi sau ghi đè bản trước) — vì vậy web dùng dịch vụ chỉ đọc Cordis **trong trang**
        `petApi7340`:

        ```js
        // Plugin client bên thứ ba trong cùng trang; không lấy được = phiên bản cũ, không ném lỗi
        const svc = ctx.get('petApi7340');
        const pose = svc ? svc.pose('main') : null; // → { x, y, facing } | null
        ```

        Hai phía **hoàn toàn thống nhất về tên trường và quy ước tọa độ**, chỉ khác cách "lấy" (web đọc khi cần, không gửi yêu cầu).

        **Không yêu cầu `surface`**: đây là endpoint **đọc** (`GET /chat`, `GET /playback/{id}` cũng không cần), hơn nữa miền xác định của endpoint này vốn chỉ có một bề mặt.

        Tọa độ **dùng cùng quy ước** với `POST /position`: tâm thú cưng, chuẩn hóa 0~1; trên desktop, chuẩn tham chiếu là **hình chữ nhật hợp nhất của tất cả màn hình**
        — vì vậy có thể đưa trực tiếp giá trị đọc được trở lại `/position`. Khi thú cưng bị kéo ra ngoài mép màn hình, tâm có thể hơi vượt khỏi
        0~1 (**không giới hạn**: trạng thái thực tế phải khớp với những gì nhìn thấy).

        Ảnh chụp trạng thái được tạo bằng cách **đẩy khi thay đổi + tiết lưu** (kéo / tự đi lại / ném / lệnh `/position` / xoay người theo lượt), không phải
        thăm dò: `updatedAt` là căn cứ duy nhất để xác định "trạng thái này mới đến mức nào". Trả về `pose-unavailable` khi desktop chưa chạy hoặc vừa khởi động lại.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      responses:
        "200":
          description: |
            Luôn là 200 (ngoại trừ 405). Lỗi được biểu thị bằng `ok: false`; `reason` có thể là
            `pet-required` (không cung cấp pet), `unknown-pet` (không có pet này trong cấu hình),
            `pet-not-displayed` (kèm `display` — cấu hình không hiển thị pet trên desktop nên endpoint này không có ý nghĩa với pet đó),
            `pose-unavailable` (đang hiển thị trên desktop nhưng chưa nhận được báo cáo nào), `generate-error` (không đọc được cấu hình, v.v.).
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required: [petId, x, y, facing, updatedAt]
                        properties:
                          petId:
                            type: string
                            description: ID của thú cưng này (phản hồi lại để bên gọi đối chiếu đối tượng đích).
                            example: main
                          x:
                            type: number
                            description: Tọa độ ngang chuẩn hóa của **tâm** thú cưng (cùng quy ước với `POST /position`).
                            example: 0.42
                          y:
                            type: number
                            description: Tọa độ dọc chuẩn hóa của **tâm** thú cưng.
                            example: 0.87
                          facing:
                            type: string
                            enum: [left, right]
                            description: Hướng (cùng thuật ngữ `facing` của `POST /anim`).
                          updatedAt:
                            type: integer
                            format: int64
                            description: Thời điểm phía kết xuất báo cáo (epoch mili giây) — căn cứ duy nhất để xác định "mới đến mức nào".
                            example: 1755000000000
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/pose/report:
    post:
      tags: [Action]
      operationId: reportPetPose
      summary: Phía kết xuất desktop báo trạng thái thực tế (kênh nội bộ, bên thứ ba không cần gọi)
      description: |
        Kênh nội bộ **phía kết xuất → host**: thú cưng desktop báo trạng thái thực tế **khi có thay đổi** (kết thúc kéo / kết thúc tự đi lại /
        ném xong và dừng / hoàn tất lệnh `/position` / xoay người theo lượt). Luồng desktop (`dsh-pet-bridge://`) và HTTP dùng
        chung một phần triển khai.

        Host chỉ lưu một **ảnh chụp trạng thái trong bộ nhớ**, **không ghi vào `/state`** — đó là kênh một chiều "để phía kết xuất đọc"; ghi vào đó chỉ đánh thức
        tất cả các yêu cầu thăm dò dài đang chờ.

        **Tiết lưu được thực hiện ở phía kết xuất** (gộp còn khoảng 2.5 lần/giây, đồng thời có trailing edge để bổ sung giá trị cuối sau khi dừng); bên gọi
        không cần tự tiết lưu.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, y, facing]
              properties:
                x:
                  type: number
                  description: Tọa độ ngang chuẩn hóa của tâm thú cưng (số hữu hạn; **chấp nhận cả giá trị vượt phạm vi**, không kẹp giá trị)
                  example: 0.42
                y:
                  type: number
                  description: Như trên, tọa độ dọc
                  example: 0.87
                facing:
                  type: string
                  enum: [left, right]
                  description: Hướng (chỉ chấp nhận đúng hai literal; sai chữ hoa/thường sẽ trả về `bad-request`)
            examples:
              typical:
                summary: Một báo cáo thông thường
                value:
                  x: 0.42
                  y: 0.87
                  facing: right
      responses:
        "200":
          description: |
            Luôn là 200 (ngoại trừ 405/400). Lỗi được biểu thị bằng `ok: false`; `reason` có thể là
            `bad-request` (`x`/`y` không phải số hữu hạn, `facing` không hợp lệ), `pet-required`, `unknown-pet`,
            `generate-error` (không đọc được cấu hình, v.v.).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'Nội dung yêu cầu không phải JSON hợp lệ (`{ "error": "invalid JSON body" }`)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/playback/{id}:
    get:
      tags: [Action]
      operationId: getPlayback
      summary: Biên nhận phát — tra cứu trạng thái thực của một lần phát theo yêu cầu
      description: |
        `ok: true` của `POST /anim` **chỉ có nghĩa là đã tiếp nhận**, không có nghĩa video đã phát xong: tài nguyên không tồn tại, giải mã thất bại,
        bị hoạt ảnh khác ghi đè — phản hồi tiếp nhận đều không cung cấp thông tin nào (trước đây biểu hiện là "nhấn rồi không thấy gì").
        Endpoint này trả về **trạng thái thực** của lần phát theo yêu cầu đó — trạng thái được cập nhật từ báo cáo của **phía thực sự đang phát** (trình duyệt / tiến trình kết xuất desktop),
        host không phỏng đoán (đọc thời lượng video rồi đặt bộ định thời là sai: nếu tải thất bại thì video chưa hề bắt đầu phát,
        nhưng bộ định thời vẫn chạy đến "đã phát xong").

        **Máy trạng thái**: `accepted` → `playing` → `ended` / `failed` / `cancelled`.
        **Trạng thái kết thúc không thể thay đổi** (`ended` đến muộn không ghi đè `cancelled`); báo cáo lặp lại có tính lũy đẳng.

        **Chờ (cách dùng được khuyến nghị)**: khi gửi cả `wait` + `timeout` (**bắt buộc đi theo cặp**), yêu cầu sẽ **chờ**:
        nếu trạng thái đi vào tập `wait` thì trả về ngay (`matched: true`); nếu hết thời gian mà vẫn chưa vào thì trả về trạng thái tại thời điểm đó
        (`matched: false`). `wait` hỗ trợ **danh sách phân tách bằng dấu phẩy** — có ba trạng thái kết thúc; nếu chỉ chờ `ended`, khi thất bại bạn sẽ
        **đợi hết toàn bộ timeout một cách vô ích**; nên dùng `wait=ended,failed,cancelled`. Nếu không truyền cả hai thì trả về ngay.

        **Vòng đời**: bản ghi trạng thái kết thúc được giữ khoảng 60 giây rồi dọn dẹp; sau đó truy vấn trả về `200` +
        `reason: unknown-playback`. Tất cả bản ghi hết hiệu lực khi host khởi động lại
        (mã chỉ được đảm bảo duy nhất trong một lần chạy).

        **Không liên quan đến `/state`**: bản ghi phát là **tài nguyên theo từng bên gọi** (chỉ bên gọi đã yêu cầu lần phát đó quan tâm,
        có vòng đời, số lượng tăng theo số bên gọi thứ ba), **không nằm trong bản tin quảng bá toàn cục mỗi 1 giây** — nếu không, mỗi cửa sổ thú cưng
        phải chịu lưu lượng của mọi bản ghi phát thuộc mọi bên gọi.
      parameters:
        - name: id
          in: path
          required: true
          description: "`playbackId` trong phản hồi của `POST /anim`."
          schema:
            type: string
          example: pb-mfh2k1-1
        - name: wait
          in: query
          required: false
          description: |
            Các trạng thái cần chờ, phân tách bằng dấu phẩy (ví dụ `ended,failed,cancelled`). **Phải xuất hiện cùng `timeout`**;
            chỉ cung cấp một trong hai sẽ trả về `200` + `reason: bad-request`. Nếu trạng thái hiện tại đã nằm trong danh sách thì **trả về ngay** (không chờ vô ích).
            Các giá trị hợp lệ là năm tên trạng thái (`accepted` / `playing` / `ended` / `failed` / `cancelled`).
          schema:
            type: string
          example: ended,failed,cancelled
        - name: timeout
          in: query
          required: false
          description: |
            Tối đa chờ bao nhiêu mili giây (`0`–`10000`). `0` là hợp lệ (trả về ngay ở nhịp tiếp theo).
            **Phải xuất hiện cùng `wait`**; số không nguyên / số âm / vượt giới hạn đều trả về `200` + `reason: bad-request`.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
          example: 10000
      responses:
        "200":
          description: |
            Bản ghi phát. `matched` cho biết có chờ được trạng thái trong `wait` hay không (nếu không truyền `wait` thì luôn là `false`).

            Mã không tồn tại hoặc đã hết hạn → `200` + `reason: unknown-playback`;
            tham số `wait` / `timeout` không hợp lệ → `200` + `reason: bad-request`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaybackRecord"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/playback/{id}/report:
    post:
      tags: [Action]
      operationId: reportPlayback
      summary: "Báo cáo trạng thái phát (kênh nội bộ: phía kết xuất → host)"
      description: |
        **Đây là nền tảng của biên nhận.** Host chỉ biết "đã tiếp nhận", không biết video đã phát xong chưa — hoạt ảnh phát trong trình duyệt / tiến trình kết xuất desktop,
        chỉ phía đó biết sự thật. Vì vậy, nếu không có báo cáo qua endpoint này, `GET /playback/{id}` sẽ luôn dừng ở `accepted`.

        **Bên gọi thứ ba không cần gọi endpoint này**; phía kết xuất của chính plugin sẽ gửi báo cáo vào bốn thời điểm:

        | status | Thời điểm |
        | --- | --- |
        | `playing` | Video **thực sự bắt đầu hiển thị hình ảnh** (`play()` hoàn tất, không phải chỉ "đặt src") |
        | `ended` | Phát đến cuối |
        | `failed` | Không lấy được tài nguyên / giải mã thất bại / tự phát bị từ chối / hệ thống di động đang bận (xem `reason`) |
        | `cancelled` | Bị hoạt ảnh **không phải phát theo yêu cầu** ghi đè (nhấp / kéo / lẩm bẩm / số dư / trạng thái làm việc / thu hồi khi rảnh) |

        Host ghi `accepted` khi tiếp nhận, **không chấp nhận báo cáo trạng thái này từ phía kết xuất** (gửi lên sẽ trả 400).
        Mọi báo cáo sau trạng thái kết thúc đều bị bỏ qua nhưng vẫn trả về 200 (lũy đẳng) — `ended` đến muộn sẽ không ghi đè `cancelled`.

        Việc "bị lần phát theo yêu cầu mới ghi đè" do **host** đánh dấu trực tiếp khi tiếp nhận yêu cầu phát mới; không cần phía kết xuất báo cáo.
      parameters:
        - name: id
          in: path
          required: true
          description: "`playbackId`."
          schema:
            type: string
          example: pb-mfh2k1-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [playing, ended, failed, cancelled]
                  description: 'Chỉ chấp nhận bốn giá trị này — `accepted` là trạng thái host tiếp nhận; báo cáo giá trị đó sẽ trả về 400.'
                reason:
                  type: string
                  description: |
                    Lý do tùy chọn (chuỗi tự do). Hiện tại phía kết xuất sử dụng: `asset-load` / `decode-error` /
                    `play-rejected` / `busy` / `superseded` / `frozen` (bị ngắt do đóng băng bởi khóa chiếm quyền).
              examples:
                playing:
                  summary: Thực sự bắt đầu phát
                  value:
                    status: playing
                ended:
                  summary: Đã phát xong
                  value:
                    status: ended
                failed:
                  summary: Không lấy được tài nguyên
                  value:
                    status: failed
                    reason: asset-load
      responses:
        "200":
          description: |
            Luôn là 200: `{ "ok": true }`. Cả **trạng thái đã được cập nhật** lẫn **bị bỏ qua theo tính lũy đẳng** (báo cáo sau trạng thái kết thúc hoặc báo cáo trùng trạng thái)
            đều được xem là thành công — với bên báo cáo, "đã ở trạng thái đó rồi" cũng là thành công.

            Mã không tồn tại hoặc đã hết hạn → `200` + `reason: unknown-playback`;
            tên trạng thái không hợp lệ (bao gồm `accepted`) → `200` + `reason: bad-request`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: "Nội dung yêu cầu không phải JSON hợp lệ (`reason: invalid-json`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/attachment:
    get:
      tags: [Assets]
      operationId: getAttachmentImage
      summary: Tải lại ảnh hội thoại theo tham chiếu tệp đính kèm
      description: |
        Đổi `attachmentId` trong `messages[].image` của `GET /chat` thành ảnh có thể hiển thị.

        Chỉ chấp nhận `sha256:<64 ký tự hex viết thường>`: dịch vụ tệp đính kèm của máy chủ tính đường dẫn đối tượng theo hàm băm nội dung; plugin không tự ghép đường dẫn.
        Không xác minh ảnh thuộc về thú cưng nào — id là hàm băm nội dung, không thể đoán; dịch vụ cũng chỉ lắng nghe trên loopback.

        Tệp đính kèm được định địa chỉ theo nội dung và không thể thay đổi, nên trình duyệt có thể lưu phản hồi vào bộ nhớ đệm; ở chế độ độc lập (không có dịch vụ tệp đính kèm), luôn trả về 404.
      parameters:
        - name: id
          in: query
          required: true
          description: "`attachmentId` trong tham chiếu tệp đính kèm (dạng `sha256:…`); bị thiếu hoặc sai định dạng → 400."
          schema:
            type: string
            pattern: "^sha256:[a-f0-9]{64}$"
      responses:
        "200":
          description: Nội dung ảnh. `Content-Type` được xác định theo chữ ký tệp (png / jpeg / gif / webp); phản hồi có header bộ nhớ đệm.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: id bị thiếu hoặc sai định dạng (`text/plain`).
        "404":
          description: Tệp đính kèm không tồn tại, không phải ảnh có thể hiển thị hoặc chế độ hiện tại không có dịch vụ tệp đính kèm (`text/plain`).
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/chat:
    get:
      tags: [Action]
      operationId: getChatMemory
      summary: Đọc cửa sổ ghi nhớ hội thoại gần đây
      description: |
        Trả về một số lượt hội thoại gần nhất của thú cưng này (**đọc một lần, không phải polling**), để điền lịch sử khi mở hộp thoại.

        Máy chủ là bên duy nhất đọc/ghi bộ nhớ (lưu vào `memory.json`); trình duyệt và máy tính chỉ là các client,
        vì vậy hai giao diện trong cùng một phiên bản DSH **mặc nhiên dùng chung một bộ nhớ**. Tệp được lưu đầy đủ, không xóa;
        phản hồi chỉ cắt lấy phần cuối theo `chatMemoryRounds` (mặc định 5 lượt, 1 lượt = 1 câu hỏi và 1 câu trả lời);
        nếu truyền `?rounds=`, sẽ cắt theo giá trị đó (chỉ ảnh hưởng lần đọc này, không đổi số lượt ngữ cảnh của các hội thoại sau).
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - name: rounds
          in: query
          description: Số lượt đọc trong lần này (0–200); nếu không truyền thì dùng cấu hình `chatMemoryRounds`. Giá trị không hợp lệ → `bad-request`.
          schema:
            type: integer
            minimum: 0
            maximum: 200
      responses:
        "200":
          description: |
            Cửa sổ gần đây nhất. **Lỗi cũng trả về 200** (`{ ok: false, reason }`), phân biệt bằng `ok`:
            `pet-required` (không cung cấp pet), `unknown-pet` (không có thú cưng này), `bad-request` (`rounds` không hợp lệ),
            `generate-error` (đọc bộ nhớ / cấu hình thất bại).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, messages, rounds]
                    properties:
                      ok:
                        type: boolean
                        const: true
                      messages:
                        type: array
                        description: Tin nhắn được sắp xếp theo thời gian tăng dần, tối đa `rounds * 2` tin
                        items:
                          $ref: "#/components/schemas/ChatMemoryMessage"
                      rounds:
                        type: integer
                        description: Số lượt áp dụng trong lần này (nếu có `?rounds=` thì dùng giá trị đã truyền, nếu không thì lấy từ cấu hình `chatMemoryRounds`)
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Action]
      operationId: sendChat
      summary: Gửi lời nhắn cho thú cưng được chỉ định và tạo câu trả lời
      description: |
        Tạo câu trả lời cùng ngữ cảnh lịch sử, ghi cặp “hỏi + đáp” vào bộ nhớ và ghi câu trả lời vào `pets.<id>.say`,
        đồng thời **trả kèm** nội dung phản hồi (`text`; nếu bộ tạo chọn ảnh minh họa thì có thêm `image`).

        Văn bản vẫn được ghi vào `pets.<id>.say` như trước: các bên tiêu thụ khác tiếp tục đọc từ `/state`; giá trị trả về chỉ
        giúp bên gọi không phải truy vấn thêm một nhịp — cả hai là cùng một văn bản, không phải hai nguồn dữ liệu.

        - Văn bản được `trim()`; văn bản rỗng → `{ ok: false, reason: 'bad-request' }`.
        - Văn bản dài hơn **2000 ký tự** → `{ ok: false, reason: 'bad-request' }`.
        - Chọn mô hình: ưu tiên `chatModel` được cấu hình cho mục; nếu để trống thì dùng mô hình của hội thoại hiện tại.
          Nếu tạo bằng mô hình chỉ định thất bại, sẽ **tự động chuyển về mô hình của hội thoại hiện tại** và thử lại một lần.
        - Bộ nhớ ghi lại tham chiếu ảnh, tên ảnh minh họa và tên hoạt ảnh của lượt này (để hiển thị trong lịch sử trò chuyện), nhưng khi phát lại lịch sử **chỉ gửi nội dung văn bản**:
          thông tin ảnh và dấu hoạt ảnh không được đưa vào ngữ cảnh, nếu không ảnh/hoạt ảnh cũ sẽ bị gửi lại cho mô hình ở mỗi lượt.
        - **Liên kết hoạt ảnh hội thoại** (cấu hình `chatAnimationEnabled`, mặc định bật): khi bật, danh sách hoạt ảnh trong
          `animations.categories` được thêm vào prompt; khi phù hợp ngữ cảnh, mô hình ghi `[动作:名称]` ở cuối câu trả lời.
          Khi được chấp nhận, xử lý theo **cùng luồng ghi** với `POST /anim`: ghi `pets.<id>.anim` (`name` + `playbackId`) trước,
          sau đó ghi `pets.<id>.say` (có `anim: false`; bong bóng không kích hoạt hoạt ảnh lẩm nhẩm và cũng không thay thế hoạt ảnh vừa phát); dấu này được loại khỏi nội dung bong bóng và bộ nhớ.
          Nếu mô hình chỉ ghi dấu mà không có nội dung, chỉ phát hoạt ảnh, không hiện bong bóng. Tùy chọn này độc lập với tùy chọn ảnh: có thể bật cả hai hoặc chỉ bật một.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/SurfaceQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 2000
                  description: Nội dung tin nhắn của người dùng
                attachment:
                  type: object
                  required: [mediaType, data]
                  description: |
                    Tùy chọn: gửi kèm một ảnh trong lượt hội thoại này (một khung ảnh chụp màn hình do người dùng chủ động gửi).

                    - **Nếu không truyền, hành vi giữ nguyên từng chữ như phiên bản cũ**; ảnh được ghi vào bộ nhớ (chỉ lưu tham chiếu tệp đính kèm, không lưu nội dung), **không đưa vào ngữ cảnh**,
                      và cũng không hiển thị trong bong bóng.
                    - Dữ liệu byte được dịch vụ tệp đính kèm của máy chủ chuẩn hóa và lưu xuống đĩa (định địa chỉ theo nội dung, loại bỏ ảnh trùng); chế độ độc lập không có dịch vụ tệp đính kèm,
                      nên gửi ảnh luôn trả về `bad-request`.
                  properties:
                    mediaType:
                      type: string
                      enum: [image/png, image/jpeg, image/webp, image/gif]
                      description: Loại phương tiện của ảnh; dịch vụ tệp đính kèm từ chối nếu không khớp với loại thực sau khi giải mã.
                    data:
                      type: string
                      description: |
                        Dữ liệu byte ảnh được mã hóa base64 chuẩn. **Không chấp nhận** tiền tố URL `data:`;
                        có ký tự không hợp lệ, padding không chuẩn hoặc vượt giới hạn triển khai → `bad-request`.
            examples:
              hello:
                summary: Chào hỏi
                value:
                  text: 今天过得怎么样？
              withImage:
                summary: Đặt câu hỏi kèm ảnh chụp màn hình
                value:
                  text: 屏幕上这个报错是什么？
                  attachment:
                    mediaType: image/jpeg
                    data: "<base64 编码的 JPEG 字节>"
      responses:
        "200":
          description: |
            Luôn trả về 200 (trừ 405). Các giá trị `reason`: `pet-required` (không cung cấp pet), `unknown-pet` (không có thú cưng này,
            hoặc bị xóa khi đang chờ khóa bộ nhớ — trường hợp này **không ghi bộ nhớ cũng không ghi bong bóng**),
            `bad-request` (tin nhắn rỗng/quá dài / `surface` bị thiếu hoặc không hợp lệ / ảnh hoặc base64 sai định dạng /
            vượt giới hạn triển khai / chế độ hiện tại không hỗ trợ ảnh), `provider-missing` (không có nhà cung cấp hội thoại khả dụng),
            `pet-not-displayed` (có `display`), `generate-error` (tạo nội dung / IO thất bại, bao gồm lưu tệp đính kèm thất bại).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SayResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [Action]
      operationId: deleteChatHistory
      summary: Xóa bộ nhớ hội thoại của thú cưng được chỉ định
      description: |
        Xóa lịch sử hội thoại đã lưu trên đĩa, **không thể hoàn tác**.

        - Có `?ts=` (có thể lặp lại): chỉ xóa các lượt này. Hai tin nhắn trong một lượt dùng chung `ts`; khớp một tin thì xóa cả lượt.
        - Không có `?ts=`: xóa toàn bộ lịch sử của thú cưng đó.
        - Khi xóa hết lịch sử của một thú cưng, xóa luôn các nút rỗng; không để lại đối tượng rỗng trong `memory.json`.
        - Không xác minh `surface`: thao tác xóa là quản lý lưu trữ, không thay đổi trạng thái hiển thị ở phía render.
        - Dùng chung một hàng đợi ghi với hội thoại, không xen kẽ với câu trả lời đang tạo.
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - name: ts
          in: query
          required: false
          description: |
            Dấu thời gian của các lượt cần xóa (mili giây, lấy từ `messages[].ts` của `GET /chat`); có thể truyền nhiều giá trị lặp lại.
            Bất kỳ giá trị nào không phải số nguyên không âm → `bad-request`. Không truyền giá trị nào = xóa tất cả.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              format: int64
              minimum: 0
      responses:
        "200":
          description: |
            Luôn trả về 200 (trừ 405). Thành công là `{ ok: true, removed }`; thất bại là `{ ok: false, reason }`:
            `pet-required` (không cung cấp pet), `unknown-pet` (không có thú cưng này), `bad-request` (`ts` không hợp lệ),
            `generate-error` (đọc/ghi bộ nhớ thất bại).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, removed]
                    properties:
                      ok:
                        type: boolean
                        const: true
                      removed:
                        type: integer
                        description: Số tin nhắn thực tế đã xóa (1 lượt = 2 tin); bằng 0 nếu không khớp
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/chat/memory:
    get:
      tags: [Action]
      operationId: listOrphanChatMemory
      summary: Liệt kê lịch sử hội thoại còn sót của thú cưng đã xóa
      description: |
        Sau khi thú cưng bị xóa khỏi cấu hình, lịch sử của nó vẫn còn trong `memory.json`; các nhóm này không thể truy cập qua `GET /chat`
        (vì endpoint đó yêu cầu thú cưng phải tồn tại) và cũng không tự biến mất. Endpoint này liệt kê chúng, **chỉ trả về số lượng và thời điểm cuối,
        không trả về nội dung tin nhắn**.
      responses:
        "200":
          description: |
            Luôn trả về 200. Thành công: `{ ok: true, orphans }`; đọc thất bại: `{ ok: false, reason: 'generate-error' }`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, orphans]
                    properties:
                      ok:
                        type: boolean
                        const: true
                      orphans:
                        type: array
                        description: Mỗi nhóm còn sót là một mục; mảng rỗng nếu không có mục nào
                        items:
                          type: object
                          required: [entry, petId, messages, lastTs]
                          properties:
                            entry:
                              type: string
                              description: Mục sở hữu (thư mục gốc tài nguyên)
                            petId:
                              type: string
                            messages:
                              type: integer
                              description: Số tin nhắn còn sót trong nhóm này
                            lastTs:
                              type: integer
                              format: int64
                              description: Dấu thời gian của tin nhắn cuối cùng (mili giây); bằng 0 nếu không có tin nhắn
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [Action]
      operationId: clearOrphanChatMemory
      summary: Xóa lịch sử hội thoại còn sót của thú cưng đã xóa
      description: Xóa một lần tất cả các nhóm “không còn trong cấu hình nhưng vẫn còn trong bộ nhớ”, **không thể hoàn tác**.
      responses:
        "200":
          description: |
            Luôn trả về 200. Thành công: `{ ok: true, pets, messages }` (số thú cưng và tin nhắn đã xóa; đều bằng 0 nếu không có dữ liệu còn sót);
            thất bại: `{ ok: false, reason: 'generate-error' }`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok, pets, messages]
                    properties:
                      ok:
                        type: boolean
                        const: true
                      pets:
                        type: integer
                      messages:
                        type: integer
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: Đọc cấu hình hoàn chỉnh sau khi hợp nhất
      description: |
        Trả về **cấu hình hoàn chỉnh đã hợp nhất**: kết quả hợp nhất sâu giữa cấu hình mặc định tích hợp (`assets/config.jsonc`)
        và lớp cấu hình người dùng (`$DSH_HOME/dsh-pet/main-config.jsonc`),
        trong đó mọi mục đều có đầy đủ trường (danh sách hoạt ảnh, trọng số, tham số vật lý, nội dung trạng thái làm việc, v.v.);
        trình duyệt/máy tính/trang cài đặt có thể sử dụng trực tiếp, **không cần xác thực hay giá trị dự phòng**.

        Khóa cấp cao nhất là “tên mục” (`main`, `test1`, v.v.), không phải mảng.

        **Một mục = một “loại”**: danh sách hoạt ảnh (`animations`), trọng số phát, tính cách (`whisperPrompt`),
        meme (`memes`), mô hình, v.v. thuộc về mục đó; `pets[]` bên dưới là các thực thể của mục — nhiều thú cưng cùng loại dùng chung
        danh sách và tài nguyên. Vì vậy, để biết “một thú cưng có thể phát hoạt ảnh nào / dùng meme nào”, cần **tìm mục sở hữu theo id của nó trước**
        rồi lấy cấu hình: mục `main` được hợp nhất từ mặc định tích hợp và lớp người dùng; mục `pet/<名>-config.json` được ghi đè
        bằng tệp của loại tương ứng. Không có danh sách hoạt ảnh toàn cục áp dụng cho mọi thú cưng.
      responses:
        "200":
          description: |
            Cấu hình hoàn chỉnh (cấp cao nhất là tên mục → đối tượng cấu hình của mục đó).

            Lỗi đọc cấu hình (cài đặt bị hỏng / IO) là kết quả nghiệp vụ: vẫn trả về `200` +
            `{ "ok": false, "reason": "generate-error", "message": "..." }`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    put:
      tags: [Config]
      operationId: saveConfig
      summary: Lưu cấu hình lớp người dùng
      description: |
        **Dựng lại theo danh sách cho phép** lớp người dùng rồi ghi xuống đĩa; sau đó trả về cấu hình tổng hợp đã lưu (cùng dữ liệu với `GET /config`).

        Cần lưu ý những điểm sau:

        - **Chỉ giữ lại các trường trong danh sách cho phép**: `id`/`name`/`size`/`sizePercent`/`balanceEnabled`/
          `whisperEnabled`/`workStatusEnabled`/`fixedEnabled`/`display`/`position` của `pets[]`, cùng các trường cấp cao nhất
          `notificationsEnabled`/`notifyWhenFocused`/`clickSoundEnabled`/`whisperImageEnabled`/`chatImageEnabled`/
          `chatAnimationEnabled`/`confineToScreen`/`trayEnabled`/`voiceEnabled`/`voiceName`/`voiceWhisperEnabled`/
          `voiceTodoEnabled`/`voiceNotifyEnabled`/`physics`/`font`/`whisperModel`/`chatModel`/`chatMemoryRounds`/
          `chatImageLimit`.
          Các trường còn lại dùng lại giá trị ban đầu trong tệp người dùng trên đĩa (được giữ nguyên qua xử lý), vì vậy khi lưu từ trang cài đặt
          **sẽ không xóa** các tinh chỉnh bạn đã tự viết (như `whisperPrompt`/`memes`/`eventsRefreshSec`).
          Trường trong danh sách cho phép cũng chỉ được xử lý như vậy nếu **thực sự được gửi** trong request body: nếu không gửi thì giữ nguyên giá trị cũ, không đặt lại mặc định.
        - Nếu tệp lớp người dùng **tồn tại nhưng không thể phân tích ngay cả dưới dạng JSONC** (bị hỏng thực sự), mặc định **chưa ghi xuống đĩa**;
          trả về `200` + `reason: user-config-unparsable` (kèm `needConfirm`, `userFile`) để bên gọi xác nhận —
          vì việc dựng lại theo danh sách cho phép sẽ âm thầm xóa toàn bộ nội dung còn lại trong tệp. Thêm `?force=1` nếu đã xác nhận muốn dựng lại.
        - Sau khi lưu thành công, máy chủ sẽ **khởi động lại bất đồng bộ** Desktop Helper (các giá trị như `display`/`size` có thể thay đổi),
          không chặn phản hồi.
      parameters:
        - name: force
          in: query
          required: false
          description: Đặt thành `1` để bỏ qua bước kiểm tra trước về “lớp người dùng không thể phân tích”, buộc dựng lại và ghi xuống đĩa
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveConfigRequest"
            examples:
              singlePet:
                summary: Lưu một thú cưng
                value:
                  pets:
                    - id: main
                      name: 蓝毛小女仆
                      size: 462
                      balanceEnabled: true
                      whisperEnabled: true
                      workStatusEnabled: true
                      fixedEnabled: false
                      display: both
                      position:
                        corner: bottom-right
                        marginX: 24
                        marginY: 24
                  notificationsEnabled: true
                  notifyWhenFocused: false
                  whisperImageEnabled: true
                  chatImageEnabled: true
      responses:
        "200":
          description: |
            Lưu thành công → cấu hình tổng hợp sau khi lưu.

            **Lỗi nghiệp vụ** → `{ "ok": false, "reason": "...", "message": "..." }`; các giá trị `reason`:
            `bad-request` (cấu hình thú cưng không hợp lệ), `user-config-unparsable` (kèm `needConfirm`, `userFile`),
            `generate-error` (ghi xuống đĩa thất bại; chi tiết chỉ được ghi vào log).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: "Request body không phải JSON hợp lệ (`reason: invalid-json`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Config]
      operationId: syncConfigFromDefault
      summary: Ghi đè cấu hình lớp người dùng bằng mặc định tích hợp
      description: |
        Ghi toàn bộ **nội dung gốc (bao gồm chú thích)** của `assets/config.jsonc` trong gói vào tệp cấu hình người dùng.
        Thao tác này vừa “khôi phục mặc định”, vừa để lại cho người dùng một bản cấu hình đầy đủ có thể chỉnh sửa trực tiếp,
        không cần tự sao chép từ trong gói.

        Sau khi ghi xuống đĩa, khởi động lại Desktop Helper bất đồng bộ và trả về cấu hình tổng hợp mới.
      responses:
        "200":
          description: |
            Đồng bộ thành công → cấu hình tổng hợp mới.

            **Lỗi nghiệp vụ** → `200` + `{ "ok": false, "reason": "generate-error", "message": "..." }`
            (thiếu tệp mặc định / không thể ghi vào thư mục người dùng: báo lỗi rõ ràng, tuyệt đối không âm thầm để lại tệp cấu hình dở dang).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/pet-display:
    post:
      tags: [Config]
      operationId: setPetDisplay
      summary: Thay đổi vị trí hiển thị của một thú cưng
      description: |
        Thay đổi `display` của thú cưng theo id và trả về cấu hình tổng hợp sau thay đổi (cùng dữ liệu với `GET /config`).

        Đây là **dạng rút gọn cho một thú cưng** của `PUT /config`: bên gọi không cần gửi lại toàn bộ `pets[]` (việc đó dễ ảnh hưởng nhầm
        các thú cưng khác cùng lớp và buộc bên gọi tự xác định phải ghi vào lớp nào). Mục menu chuột phải “Vị trí hiển thị” ở cả máy tính và trình duyệt đều dùng endpoint này.

        **Máy chủ tra cứu lớp sở hữu, bên gọi không cần truyền**: `id` là **duy nhất toàn cục** sau khi hợp nhất (`mergePet` bỏ qua
        các thực thể trùng lặp); máy chủ định vị bằng `findPetInstance`, rồi chọn tệp để ghi theo mục sở hữu — mục `main` ghi vào
        `$DSH_HOME/dsh-pet/main-config.jsonc`, thú cưng dạng tệp ghi vào `pet/<前缀>-config.json` (cũng hỗ trợ `.jsonc`).

        Ngữ nghĩa ghi giống `PUT /config`: dựng lại theo danh sách cho phép + giữ nguyên giá trị cũ trên đĩa (không xóa các trường tinh chỉnh tự viết).
        Sau khi ghi xuống đĩa, cũng **khởi động lại bất đồng bộ** Desktop Helper mà không chặn phản hồi — phản hồi có thể chưa kịp gửi
        (tiến trình khởi tạo thường chính là Desktop Helper sắp bị thay thế); bên gọi có thể gửi yêu cầu mà không chờ phản hồi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, display]
              properties:
                id:
                  type: string
                  description: id của thực thể thú cưng (duy nhất toàn cục sau khi hợp nhất)
                display:
                  type: string
                  enum: [web, desktop, both, none]
                  description: |
                    Vị trí hiển thị đích: `web` chỉ trên web / `desktop` chỉ trên máy tính / `both` cả hai / `none` không hiển thị ở đâu.
                    Sau khi chọn `none`, thú cưng này sẽ ẩn ở cả hai giao diện; có thể khôi phục bằng danh sách thả xuống “Vị trí hiển thị” trong trang cài đặt.
            examples:
              toWeb:
                summary: Ẩn khỏi máy tính, giữ trên web
                value:
                  id: main
                  display: web
      responses:
        "200":
          description: |
            **Thay đổi thành công** → cấu hình tổng hợp sau thay đổi (cùng dữ liệu với `GET /config`);
            **Lỗi nghiệp vụ** → `{ ok: false, reason, message }` (dành cho kết quả nghiệp vụ, không dùng 400/404,
            nếu không bên gọi sẽ nhầm kết quả nghiệp vụ thành lỗi tầng truyền tải).

            Các giá trị `reason`: `pet-required` (thiếu `id` / chuỗi rỗng / chỉ có khoảng trắng), `bad-request` (`display`
            không thuộc enum / cấu hình thú cưng của lớp đó không hợp lệ), `unknown-pet` (không tìm thấy thú cưng này, bao gồm trường hợp bị bỏ qua khi hợp nhất do id trùng với mục khác),
            `generate-error` (đọc cấu hình thất bại / ghi xuống đĩa thất bại / không tìm thấy tệp cấu hình của mục).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: "Request body không phải JSON hợp lệ (`reason: invalid-json`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/pet-config:
    post:
      tags: [Config]
      operationId: savePetLayer
      summary: Ghi lại tất cả thực thể của một loại
      description: |
        Ghi toàn bộ `pets[]` của một “loại” vào tệp cấu hình riêng của loại đó và trả về cấu hình tổng hợp sau khi ghi
        (cùng dữ liệu với `GET /config`).

        Endpoint này lấp khoảng trống giữa hai endpoint ghi hiện có: `PUT /config` chỉ ghi cấu hình chính của người dùng, `POST /pet-display`
        chỉ thay đổi `display` của một thú cưng. Endpoint này ghi theo “mục”: `entry` là tiền tố tên tệp của
        `pet/<名>-config.json` (= thư mục gốc tài nguyên); máy chủ tự xác định tệp đích, bên gọi không cần truyền đường dẫn.

        Các điểm cần biết:

        - **Thay thế toàn bộ**: `pets` phải chứa **tất cả thực thể** của mục đó; bỏ sót một thực thể đồng nghĩa với xóa nó.
        - **Dựng lại theo danh sách cho phép + giữ nguyên các trường khác**: mỗi thực thể chỉ giữ `id`/`name`/`size`/`sizePercent`/`balanceEnabled`/
          `whisperEnabled`/`workStatusEnabled`/`fixedEnabled`/`display`/`position`/`whisperPrompt`;
          các trường cấp cao nhất của tệp như `animations`/`animationWeights`/`whisperPrompt`/`memes` được giữ nguyên.
        - **Không chấp nhận trường toàn cục**: ngay cả khi được gửi, `notificationsEnabled`/`physics`/`font`/`whisperModel`, v.v.
          cũng không được ghi vào lớp này — trường toàn cục chỉ thuộc `main` và được ghi bằng `PUT /config`.
        - **Từ chối `entry: "main"`**: lớp main cũng cần các trường toàn cục, nên phải dùng `PUT /config`.
        - **Ghi lại sẽ làm mất chú thích**: các chú thích `//` trong `pet/*.jsonc` sẽ bị chuyển thành JSON thuần (giống `POST /pet-display`).
        - **id duy nhất toàn cục giữa các mục**: nếu id thực thể trùng với loại khác, yêu cầu sẽ bị từ chối trước khi ghi xuống đĩa (`bad-request`),
          nếu không khi đọc, mục trùng sẽ bị âm thầm bỏ qua.
        - Sau khi ghi xuống đĩa, cũng **khởi động lại bất đồng bộ** Desktop Helper mà không chặn phản hồi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry, pets]
              properties:
                entry:
                  type: string
                  description: |
                    Tên mục = tiền tố tên tệp của `pet/<名>-config.json(c)` = thư mục gốc tài nguyên.
                    Không chấp nhận `main` hoặc các ký tự không hợp lệ như dấu phân cách đường dẫn.
                pets:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/PetEntry"
            examples:
              oneInstance:
                summary: Chuyển loại glm thành một thực thể trên web
                value:
                  entry: glm
                  pets:
                    - id: glm1
                      name: GLM 龙娘
                      size: 360
                      balanceEnabled: false
                      whisperEnabled: true
                      workStatusEnabled: true
                      fixedEnabled: false
                      display: web
                      position:
                        corner: top-right
                        marginX: 24
                        marginY: 100
      responses:
        "200":
          description: |
            **Ghi thành công** → cấu hình tổng hợp sau khi ghi (cùng dữ liệu với `GET /config`);
            **Lỗi nghiệp vụ** → `{ ok: false, reason, message }` (không biểu đạt kết quả nghiệp vụ bằng 400/404).

            Các giá trị `reason`: `bad-request` (thiếu `entry` / `entry` không hợp lệ / `entry` là `main` /
            `pets` rỗng hoặc có trường không hợp lệ / id xung đột với loại khác), `unknown-entry` (loại này không có tệp cấu hình),
            `generate-error` (đọc cấu hình hoặc ghi xuống đĩa thất bại).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: "Request body không phải JSON hợp lệ (`reason: invalid-json`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/config/meta:
    get:
      tags: [Config]
      operationId: getConfigMeta
      summary: Danh sách đường dẫn tệp cấu hình và vị trí lưu trữ
      description: |
        Nguồn dữ liệu hiển thị cho các mục “Cấu hình nâng cao” và “Gỡ cài đặt và lưu trữ” trên trang cài đặt:
        cho biết cấu hình và từng loại dữ liệu được lưu ở đâu, tệp log nằm ở đâu, và lệnh gỡ cài đặt cần dùng profile nào.
      responses:
        "200":
          description: Danh sách đường dẫn. Endpoint này chỉ đọc đường dẫn và môi trường, không đưa ra quyết định nghiệp vụ nên không có phản hồi lỗi.
          content:
            application/json:
              schema:
                type: object
                required: [user, default, animations, logs, storage, profile]
                properties:
                  user:
                    type: string
                    description: Đường dẫn tuyệt đối đến tệp cấu hình lớp người dùng
                  default:
                    type: string
                    description: Đường dẫn tuyệt đối đến cấu hình mặc định tích hợp trong gói
                  animations:
                    type: string
                    description: Đường dẫn tuyệt đối đến thư mục gốc tài nguyên hoạt ảnh của người dùng
                  todos:
                    type: string
                    description: |
                      Đường dẫn tuyệt đối đến tệp dữ liệu việc cần làm (`$DSH_HOME/dsh-pet/todos.json`).
                      Dữ liệu cấp người dùng, không chia theo thú cưng: nội dung việc, thời hạn và trạng thái hoàn thành đều nằm ở đây; xóa tệp đồng nghĩa xóa toàn bộ việc cần làm.
                  logs:
                    type: string
                    description: |
                      Đường dẫn tuyệt đối đến tệp log hợp nhất (`$DSH_HOME/dsh-pet/logs.txt`).
                      DSH bản desktop không có console, nên toàn bộ log hoạt động của plugin được ghi vào tệp này.
                      Giới hạn mỗi tệp là 1 MB; khi đầy, chỉ giữ lại 512 KB mới nhất.
                  storage:
                    type: array
                    description: Tất cả vị trí lưu trên đĩa (dữ liệu người dùng / runtime Electron / bộ nhớ đệm desktop / bộ nhớ đệm tải xuống / bản thân plugin)
                    items:
                      $ref: "#/components/schemas/StorageEntry"
                  profile:
                    type: string
                    description: |
                      Tên profile DSH, dùng để ghép lệnh gỡ cài đặt
                      `dsh plugin --profile <名> remove dsh-pet`. Nếu không suy ra được thì trả chuỗi rỗng.

  /dsh-pet-7340/models:
    get:
      tags: [Config]
      operationId: listModels
      summary: Liệt kê nhà cung cấp và mô hình có thể chọn
      description: |
        Nguồn dữ liệu cho danh sách thả xuống “Mô hình AI” trên trang cài đặt, **cùng nguồn** với bộ chọn mô hình của DSH —
        đều lấy từ dịch vụ host `llm`: `listProviders()` là các tuyến nhà cung cấp đang hoạt động đã đăng ký,
        `listModels(provider)` là các mô hình thuộc tuyến đó.

        - Chỉ đọc, không có tác dụng phụ.
        - Nếu không liệt kê được mô hình của một nhà cung cấp (adapter không hỗ trợ / sự cố mạng), chỉ đặt `models` của nhà cung cấp đó thành mảng rỗng,
          **không làm hỏng toàn bộ danh sách**.
        - Nếu chưa đăng ký tuyến nhà cung cấp nào, dùng `listConfigurableProviders()`
          (các tuyến mà adapter khai báo có thể cấu hình) để danh sách thả xuống không bị trống.
        - Nếu thiếu `name` của nhà cung cấp/mô hình thì dùng `id` thay thế.
      responses:
        "200":
          description: |
            Danh sách nhà cung cấp và mô hình. Không lấy được danh sách nghĩa là dependency không khả dụng (host không cung cấp adapter llm / lỗi khi liệt kê toàn bộ mô hình),
            trường hợp này cũng trả `200` + `{ "ok": false, "reason": "generate-error", "message": "..." }`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [providers]
                    properties:
                      providers:
                        type: array
                        items:
                          $ref: "#/components/schemas/Provider"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/reload:
    post:
      tags: [Action]
      operationId: reload
      summary: Tải lại desktop (khởi động lại Helper)
      description: |
        Khởi động lại tiến trình desktop Helper và tạo lại tất cả cửa sổ thú cưng desktop theo cấu hình mới nhất.
        Dùng **cùng một** quy trình khởi động lại với thao tác lưu cấu hình (hàng đợi tuần tự + đợi tiến trình cũ thoát hẳn rồi mới khởi chạy tiến trình mới),
        vì vậy thay đổi về số lượng thú cưng / `display` / `size` cũng có hiệu lực.

        **Lưu ý**: bên gọi thường chính là Helper sắp bị khởi động lại, nên không đảm bảo phản hồi được gửi đến nơi.
        Vì vậy, triển khai không chờ khởi động lại xong mà trả `200` ngay.
      responses:
        "200":
          description: Đã được đưa vào hàng đợi khởi động lại
          content:
            application/json:
              schema:
                type: object
                required: [reloading]
                properties:
                  reloading:
                    type: boolean
                    const: true
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/quit:
    get:
      tags: [Action]
      operationId: probeQuit
      summary: Kiểm tra host có cho phép thoát hay không
      description: |
        Kiểm tra khả năng “Thoát” trong khay hệ thống (issue #178). Chỉ khi chế độ độc lập cung cấp dịch vụ `shutdownApp`
        thì `canQuit` mới là `true`; chế độ desktop trong DSH không có khả năng này, trả `false` và không hiển thị mục thoát trong menu khay hệ thống.
        Khả năng được xác định **tại thời điểm yêu cầu**, không lưu đệm.
      responses:
        "200":
          description: Kết quả kiểm tra khả năng
          content:
            application/json:
              schema:
                type: object
                required: [canQuit]
                properties:
                  canQuit:
                    type: boolean
              example:
                canQuit: false
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Action]
      operationId: quitHost
      summary: Yêu cầu host thoát (“Thoát” trong khay hệ thống)
      description: |
        Trả `200` ngay rồi gọi bất đồng bộ `shutdownApp` của host để hoàn tất (dừng Helper + đóng dịch vụ + thoát).
        Bên gọi thường chính là Helper sắp bị dừng, nên **không đảm bảo phản hồi được gửi đến nơi**.

        Nếu host không cung cấp khả năng thoát thì vẫn trả `200`, nhưng có `ok:false, reason:"unsupported"`
        (theo quy ước của endpoint hành động: không hỗ trợ không phải lỗi ở tầng giao thức, giống `POST /pet-display`).
      responses:
        "200":
          description: Đã chấp nhận yêu cầu thoát hoặc thông báo rõ là không hỗ trợ
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  reason:
                    type: string
                    enum: [unsupported]
                  message:
                    type: string
              example:
                ok: true
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  "/dsh-pet-7340/thumb/{petId}/{file}":
    get:
      tags: [Assets]
      operationId: getAnimation
      summary: Lấy tài nguyên hoạt ảnh của thú cưng
      description: |-
        Quyền sở hữu tài nguyên được xác định dựa trên việc thú cưng có thư mục tài nguyên riêng `pet/<petId>-animation/` hay không:

        - **Có** (thú cưng pet pack): chỉ tìm trong thư mục đó; không tìm thấy thì báo lỗi rõ ràng `404` — **tuyệt đối không dùng chung** tài nguyên khác.
        - **Không có** (mọi thú cưng cấu hình chính, kể cả nhiều thú cưng do người dùng thêm): dùng chuỗi tài nguyên chính —
          ưu tiên thư mục người dùng `main-animation/<webm|mov>`, sau đó đến `assets/<webm|mov>` trong gói.
          Dùng chung bất kể số lượng thú cưng.

        `petId` là **định danh** (tức `<名>` trong `<名>-animation`), không phải đoạn đường dẫn:
        chứa dấu phân cách / ký tự dành riêng thì trả `400`, trước mọi bước ghép đường dẫn. Tên hợp lệ (kể cả tiếng Trung) vẫn dùng bình thường.
      parameters:
        - name: petId
          in: path
          required: true
          description: Định danh gốc tài nguyên (thú cưng pet pack dùng `<名>`, thú cưng chính truyền `main`)
          schema:
            type: string
        - name: file
          in: path
          required: true
          description: Tên tệp hoạt ảnh (có thể chứa đường dẫn con). **Phần mở rộng phải là `.webm` hoặc `.mov`**
          schema:
            type: string
      responses:
        "200":
          description: Tệp hoạt ảnh
          content:
            video/webm:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        "400":
          description: |
            `petId` chứa ký tự không hợp lệ; hoặc phần mở rộng không phải `.webm`/`.mov`
            (`unsupported animation format`); hoặc số đoạn đường dẫn không đúng.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: "Không tìm thấy tài nguyên (`dsh-pet: asset not found`)"
          content:
            text/plain:
              schema:
                type: string

  /dsh-pet-7340/voice/hear:
    post:
      tags: [Voice]
      operationId: transcribeVoice
      summary: Nhận dạng một đoạn ghi âm thành văn bản
      description: |
        Ngược với `/voice/speak`: đầu vào là âm thanh, đầu ra là văn bản.

        - **Nhiều triển khai cùng tồn tại**: plugin host có thể đăng ký triển khai nhận dạng riêng qua dịch vụ Cordis `petApi7340.speech.register`;
          `/voice/hear-providers` liệt kê tất cả triển khai khả dụng.
        - Nếu không truyền `provider` thì dùng cấu hình `main.speechProvider`; nếu không phân giải được thì từ chối bằng `bad-request`,
          không âm thầm chuyển sang triển khai khác.
        - Âm thanh phải là **WAV PCM16 / 16kHz / đơn âm**, mã hóa base64 trong trường `audio`.
          Mọi container khác (mp3/webm/ogg) hoặc tần số lấy mẫu khác đều bị từ chối. Định dạng do triển khai kiểm tra;
          nếu không hợp lệ thì trả `generate-error` kèm thông báo gốc.
        - Triển khai tự động phát hiện ngôn ngữ; yêu cầu không có tham số ngôn ngữ.
        - Sau giải mã, kích thước không được vượt 7 MiB (khoảng 200 giây âm thanh đơn âm 16kHz): giới hạn request body là 10 MiB, base64 làm tăng thêm khoảng một phần ba.
        - Nhận dạng toàn bộ đoạn âm thanh một lần, không truyền phát.
        - Lỗi tham số trả `bad-request`, thiếu khả năng (chưa cài plugin hoặc chưa cấu hình key) trả `unsupported`,
          lỗi nhận dạng trả `generate-error`; cả ba đều trả HTTP 200 + `{ ok: false, reason, message }`.
          Chỉ khi request body không phải JSON hợp lệ mới trả 400; sai phương thức trả 405.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audio]
              properties:
                audio:
                  type: string
                  description: Base64 của WAV PCM16/16kHz/đơn âm; tối đa 7 MiB sau giải mã (khoảng 200 giây).
                provider:
                  type: string
                  description: ID triển khai nhận dạng, xem các giá trị tại `/voice/hear-providers`; mặc định dùng cấu hình `main.speechProvider`.
      responses:
        "200":
          description: |
            Khi thành công trả `{ ok: true, text }`; khi thất bại trả `{ ok: false, reason, message }`,
            `reason` có thể là `bad-request` (tham số không hợp lệ) / `unsupported` (triển khai không khả dụng: chưa cài plugin, chưa cấu hình key
            hoặc mô hình chưa sẵn sàng) / `generate-error` (nhận dạng lỗi hoặc hết thời gian chờ).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  text:
                    type: string
                    description: Chỉ xuất hiện khi thành công.
                  reason:
                    type: string
                    description: Chỉ xuất hiện khi thất bại.
                  message:
                    type: string
                    description: Chỉ xuất hiện khi thất bại.
        "400":
          description: Request body không phải JSON hợp lệ.
        "405":
          description: Phương thức không phải POST.

  /dsh-pet-7340/voice/hear-providers:
    get:
      tags: [Voice]
      operationId: getHearProviders
      summary: Liệt kê triển khai nhận dạng giọng nói khả dụng
      description: Cùng nguồn dữ liệu với trường `provider` của `/voice/hear`; phía frontend dùng danh sách này để hiển thị bộ chọn, không mã hóa cứng ID.
      responses:
        "200":
          description: Danh mục triển khai nhận dạng, theo thứ tự đăng ký.
          content:
            application/json:
              schema:
                type: object
                required: [ok, providers]
                properties:
                  ok:
                    type: boolean
                    const: true
                  providers:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id:
                          type: string
                          description: ID provider, ví dụ `dsh`; đây là giá trị được ghi vào cấu hình `main.speechProvider`.
                        name:
                          type: string
                          description: Tên hiển thị, ví dụ `DSH 语音插件`.
        "405":
          description: Phương thức không phải GET.

  /dsh-pet-7340/memory/providers:
    get:
      tags: [Memory]
      operationId: getMemoryProviders
      summary: Liệt kê triển khai bộ nhớ dài hạn khả dụng
      description: Cùng nguồn với tùy chọn cấu hình `main.memoryProvider`; `native` tích hợp luôn đứng đầu, các mục còn lại theo thứ tự đăng ký. Frontend dùng danh sách này để hiển thị bộ chọn, không mã hóa cứng ID.
      responses:
        "200":
          description: Danh mục triển khai bộ nhớ.
          content:
            application/json:
              schema:
                type: object
                required: [ok, providers]
                properties:
                  ok:
                    type: boolean
                    const: true
                  providers:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id:
                          type: string
                          description: ID provider, ví dụ `native`; đây là giá trị được ghi vào cấu hình `main.memoryProvider`.
                        name:
                          type: string
                          description: Tên hiển thị, ví dụ `内置记忆`.
        "405":
          description: Phương thức không phải GET.

  /dsh-pet-7340/voice/speak:
    post:
      tags: [Voice]
      operationId: synthesizeVoice
      summary: Tổng hợp một đoạn giọng nói
      description: |
        Tổng hợp một đoạn văn bản tiếng Trung thành mp3 hoặc wav; khi thành công trả trực tiếp nội dung tệp.

        - **Nhiều triển khai cùng tồn tại**: plugin host có thể đăng ký triển khai riêng qua dịch vụ Cordis `petApi7340.voice.register`,
          mỗi triển khai khai báo danh sách giọng riêng; `/voice/voices` liệt kê toàn bộ giọng, nhóm theo provider.
        - ID giọng có dạng đầy đủ `provider/音色`; nếu không truyền `voice` thì dùng cấu hình `main.voiceName`.
          Nếu không phân giải được thì từ chối bằng `bad-request`, không thay bằng giọng khác.
        - Định dạng đầu ra do triển khai khai báo (mp3 / wav), `Content-Type` của phản hồi phải tương ứng.
        - Mỗi tổ hợp “giọng đầy đủ + tốc độ + văn bản” chỉ được tổng hợp một lần; nếu có trong bộ nhớ đệm thì không gọi triển khai nữa. ID đầy đủ bao gồm
          provider nên đổi triển khai hoặc giọng sẽ không khớp âm thanh cũ.
        - Tổng hợp được thực hiện tuần tự, tối đa 3 yêu cầu trong hàng đợi; vượt quá thì trả `voice-busy`, bên gọi có thể thử lại sau.
        - Lỗi tham số, hàng đợi đầy và lỗi upstream đều là lỗi nghiệp vụ: HTTP 200 + `{ ok: false, reason, message }`.
        Chỉ khi request body không phải JSON hợp lệ mới trả 400; sai phương thức trả 405.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  description: Văn bản cần tổng hợp; sau khi trim không được rỗng, tối đa 500 ký tự UTF-16.
                  maxLength: 500
                voice:
                  type: string
                  description: |
                    ID giọng đầy đủ (`provider/音色`), xem các giá trị tại `/voice/voices`;
                    mặc định dùng cấu hình `main.voiceName`; nếu không có cả hai hoặc không phân giải được thì từ chối bằng `bad-request`.
                rate:
                  type: string
                  description: Biểu thức tốc độ prosody, ví dụ `+0%` / `-10%`; cho phép -50%..+100%, mặc định `+0%`.
                  pattern: "^[+-][0-9]{1,3}%$"
      responses:
        "200":
          description: |
            Khi thành công, phản hồi là âm thanh mp3 hoặc wav (do triển khai khai báo); khi thất bại, phản hồi là JSON `{ ok: false, reason, message }`,
            `reason` có thể là `bad-request` (tham số không hợp lệ) / `voice-busy` (hàng đợi đầy) / `generate-error` (upstream lỗi hoặc hết thời gian chờ).
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                required: [ok, reason, message]
                properties:
                  ok:
                    type: boolean
                    const: false
                  reason:
                    type: string
                  message:
                    type: string
        "400":
          description: Request body không phải JSON hợp lệ.
        "405":
          description: Phương thức không phải POST.

  /dsh-pet-7340/voice/voices:
    get:
      tags: [Voice]
      operationId: getVoices
      summary: Liệt kê giọng đọc khả dụng
      description: |
        Liệt kê các giọng của mọi triển khai đã đăng ký, nhóm theo provider; frontend dùng danh sách này để hiển thị bộ chọn giọng, không mã hóa cứng ID.
        `id` của giọng có dạng đầy đủ và chính là giá trị được ghi vào cấu hình `main.voiceName`.
      responses:
        "200":
          description: Danh mục giọng đọc, nhóm theo thứ tự đăng ký.
          content:
            application/json:
              schema:
                type: object
                required: [ok, providers]
                properties:
                  ok:
                    type: boolean
                    const: true
                  providers:
                    type: array
                    items:
                      type: object
                      required: [id, name, voices]
                      properties:
                        id:
                          type: string
                          description: ID provider, ví dụ `edge`.
                        name:
                          type: string
                          description: Tên hiển thị, dùng làm tiêu đề nhóm trên trang cài đặt.
                        voices:
                          type: array
                          items:
                            type: object
                            required: [id, name]
                            properties:
                              id:
                                type: string
                                description: ID đầy đủ, ví dụ `edge/zh-CN-XiaoyiNeural`.
                              name:
                                type: string
                              tag:
                                type: string
                                description: Phụ đề hiển thị, ví dụ “nữ · năng động”; có thể không có.
        "405":
          description: Phương thức không phải GET.

  /dsh-pet-7340/character:
    get:
      tags: [Assets]
      operationId: getCharacter
      summary: Lấy ảnh tham chiếu nhân vật (để bên thứ ba giữ đúng nhân vật khi tự tạo ảnh)
      description: |
        Dựa theo thư mục gốc tài nguyên để trả ảnh tham chiếu nhân vật (thường là ảnh ba góc nhìn), giúp plugin bên thứ ba giữ nhất quán nhân vật khi tự tạo ảnh.

        **dsh-pet không gọi hộ mô hình tạo ảnh**: endpoint này chỉ cung cấp “thế nào là giống nhân vật này”; việc tạo ảnh, mô hình, key và
        tính phí đều thuộc bên gọi. Vì vậy không cần cấu hình nhà cung cấp hình ảnh và không tiêu hao hạn mức của host.

        Thứ tự tìm kiếm: `pet/<素材根>-character.<ext>` (có sẵn trong pet pack) →
        `assets/<素材根>-character.<ext>` trong gói (được phát hành kèm). Thử lần lượt phần mở rộng png / jpg / jpeg / webp / gif,
        trả về kết quả khớp đầu tiên; phần mở rộng cũng quyết định `content-type`.

        Tên tham số là `root`, không phải `pet`: giá trị cần là thư mục gốc tài nguyên (tiền tố thư mục), không phải ID instance thú cưng của `PetIdQuery.pet` ở endpoint khác.
        Cùng quy ước với `/logo?root=` và `/pet-avatar?root=`.
      parameters:
        - name: root
          in: query
          required: true
          description: |
            Thư mục gốc tài nguyên (tiền tố tên tệp của `pet/<名>-config.json(c)`) — **bắt buộc**, không có giá trị mặc định:
            tự đoán mặc định có thể khiến bên gọi âm thầm lấy ảnh của thú cưng khác. Chứa ký tự không hợp lệ như dấu phân cách đường dẫn → 400.
          schema:
            type: string
          example: main
      responses:
        "200":
          description: |
            Byte ảnh; `content-type` được xác định bởi phần mở rộng khớp.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "400":
          description: Thiếu `root` hoặc `root` chứa ký tự không hợp lệ như dấu phân cách đường dẫn (`text/plain`).
        "404":
          description: "Không có ảnh tham chiếu nhân vật cho thư mục gốc tài nguyên này (`text/plain`, nội dung `dsh-pet: character not found`)."

  /dsh-pet-7340/logo:
    get:
      tags: [Assets]
      operationId: getLogo
      summary: Lấy ảnh đại diện thú cưng (mặc định là logo plugin)
      description: |
        Không có tham số thì trả `assets/logo.png` trong gói. Chỉ cho phép truy cập đúng tệp này — thư mục gốc `assets/` còn chứa tệp cấu hình,
        không mở cả thư mục thành thư mục tĩnh nên đường dẫn không chấp nhận đoạn bổ sung (thêm một đoạn sẽ trả 400).

        Khi có `root=<素材根>`, trước tiên tìm ảnh đại diện do pet pack đó tải lên (`pet/<素材根>-avatar.<ext>`,
        phần mở rộng được xác định từ header tệp, có thể là png / jpg / webp / gif); nếu chưa tải lên thì dùng logo trong gói.
        Với `root=main` (mục tích hợp), **không tìm** tệp tùy chỉnh và luôn trả logo trong gói.

        Tên tham số là `root`, không phải `pet`: giá trị ở đây là thư mục gốc tài nguyên (tiền tố thư mục, ví dụ `baimao`), không phải ID instance thú cưng
        của `PetIdQuery.pet` trong endpoint khác (`pets[].id`, ví dụ `main`). Tên giống nhau nhưng ý nghĩa khác nhau; nếu gọi theo
        ý nghĩa đã biết của `pet`, bên gọi có thể âm thầm nhận ảnh mặc định.

        `v` là tham số bất kỳ để phá bộ nhớ đệm; host không phân tích giá trị này.
      parameters:
        - name: root
          in: query
          required: false
          description: |
            Thư mục gốc tài nguyên (tiền tố tên tệp `pet/<名>-config.json(c)`). Bỏ qua hoặc dùng `main` → trả logo trong gói.
            Chứa ký tự không hợp lệ như dấu phân cách đường dẫn → 400.
          schema:
            type: string
          example: baimao
        - name: v
          in: query
          required: false
          description: Giá trị phiên bản để phá bộ nhớ đệm (đổi giá trị khi mở bảng / làm mới / tải lên thành công); host bỏ qua.
          schema:
            type: string
      responses:
        "200":
          description: |
            Ảnh. Mặc định là PNG; nếu `root` khớp ảnh đại diện tùy chỉnh thì dùng định dạng thực tế của tệp.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "400":
          description: Đường dẫn có thêm đoạn hoặc `root` chứa ký tự không hợp lệ như dấu phân cách đường dẫn (`text/plain`).
        "404":
          description: Gói không có logo (cài đặt bị hỏng, `text/plain`).

  /dsh-pet-7340/pet-avatar:
    post:
      tags: [Assets]
      operationId: uploadPetAvatar
      summary: Tải lên / ghi đè ảnh đại diện pet pack
      description: |
        Ghi một ảnh thành `pet/<素材根>-avatar.<ext>`, ghi đè ảnh đại diện cũ của cùng thư mục gốc tài nguyên.
        Phần mở rộng được xác định bằng **magic number trong header tệp** (png / jpg / webp / gif), không dựa vào tên tệp; khi đổi định dạng sẽ xóa các
        tệp có phần mở rộng cũ khác. Nếu có nhiều tệp cùng tồn tại, khi đọc sẽ chọn tệp được sửa gần đây nhất.

        Vì sao dùng base64 thay vì luồng nhị phân thô: host giải mã request body theo utf8 thống nhất, khiến dữ liệu nhị phân bị hỏng ngay khi giải mã.

        Một số điểm cần biết:

        - **Chỉ dành cho pet pack**: từ chối trực tiếp `root=main` (mục tích hợp) — thư mục `pet/` không nhận ảnh đại diện tích hợp,
          mục tích hợp luôn dùng logo mặc định của plugin.
        - **Giới hạn 768 KiB sau giải mã**: giới hạn riêng theo kích thước ảnh đại diện, không liên quan giới hạn request body;
          trang cài đặt thu nhỏ cạnh dài của ảnh xuống 512 trước khi tải lên.
        - **Chỉ kiểm tra “ảnh đại diện là tệp ảnh + nằm trong giới hạn”**: không cắt, không mã hóa lại; bên gọi chịu trách nhiệm về kích thước và chất lượng ảnh.
        - Có hiệu lực **ngay sau khi ghi ra đĩa**: đây không phải trường cấu hình, không cần `PUT /config` và cũng không cần khởi động lại desktop Helper.
        - Mọi instance cùng thư mục gốc tài nguyên **dùng chung** một ảnh đại diện (tên tệp dựa trên thư mục gốc, không dựa trên ID instance).
      parameters:
        - name: root
          in: query
          required: true
          description: |
            Thư mục gốc tài nguyên (tiền tố tên tệp `pet/<名>-config.json(c)`) — **bắt buộc** và không được là `main`.
          schema:
            type: string
          example: baimao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base64]
              properties:
                base64:
                  type: string
                  description: |
                    Base64 chuẩn không có tiền tố `data:`. Từ chối đầu vào không chuẩn (cùng quy tắc kiểm tra tệp đính kèm của `/chat`),
                    không âm thầm giải mã thành byte khác.
            examples:
              upload:
                summary: 给 baimao 换一张 PNG
                value:
                  base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
      responses:
        "200":
          description: |
            **Thành công** → `{ ok: true }`;
            **Lỗi nghiệp vụ** → `{ ok: false, reason, message }` (không dùng 400/404 để biểu đạt kết quả nghiệp vụ).

            Các giá trị `reason`: `bad-request` (thiếu `root` / `root` không hợp lệ / `root` là `main` /
            thiếu `base64` hoặc base64 không chuẩn), `unsupported` (header tệp không phải PNG / JPEG / WebP / GIF),
            `internal-error` (ghi tệp thất bại).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'Request body không phải JSON hợp lệ: `400` + `{"ok":false,"reason":"invalid-json"}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "413":
          description: 'Kích thước sau giải mã vượt 768 KiB: `413` + `{"ok":false,"reason":"payload-too-large"}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  "/dsh-pet-7340/sound/{file}":
    get:
      tags: [Assets]
      operationId: getSound
      summary: Lấy tệp hiệu ứng âm thanh khi nhấp
      description: Đọc từ `assets/sound/` trong gói (cấu trúc phẳng, **không có** đoạn petId); hiện chỉ có `click-duck.wav`.
      parameters:
        - $ref: "#/components/parameters/AssetFile"
      responses:
        "200":
          description: Tệp hiệu ứng âm thanh
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: "Không tìm thấy hiệu ứng âm thanh (`dsh-pet: sound not found`)"
          content:
            text/plain:
              schema:
                type: string

  "/dsh-pet-7340/font/{file}":
    get:
      tags: [Assets]
      operationId: getFont
      summary: Lấy tệp phông chữ
      description: Đọc từ `assets/fonts/` trong gói (cấu trúc phẳng, **không có** đoạn petId).
      parameters:
        - $ref: "#/components/parameters/AssetFile"
      responses:
        "200":
          description: Tệp phông chữ
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: "Không tìm thấy phông chữ (`dsh-pet: font not found`)"
          content:
            text/plain:
              schema:
                type: string

  "/dsh-pet-7340/pic/{file}":
    get:
      tags: [Assets]
      operationId: getPic
      summary: Lấy biểu tượng thông báo / ảnh meme
      description: |
        Ảnh tĩnh có hai dạng:

        - `/dsh-pet-7340/pic/<名>.png` → ảnh tĩnh như biểu tượng thông báo, con trỏ kéo và hình hướng dẫn trò chơi (`<名>` có thể chứa thư mục con):
          ưu tiên thư mục người dùng `$DSH_HOME/dsh-pet/pic/`, sau đó đến `assets/pic/` trong gói; ghi đè theo từng tệp.
          Lớp người dùng nằm ngoài gói; nâng cấp hoặc cài lại plugin chỉ khôi phục tài nguyên trong gói, không ghi đè tệp cùng tên do người dùng thêm.
        - `/dsh-pet-7340/pic/memes/<素材根>/<名>.png` → ảnh meme (ảnh dùng cho lẩm bẩm / ảnh kèm hội thoại),
          **quyền sở hữu tài nguyên** được xác định theo thư mục gốc tài nguyên, cùng quy ước với hoạt ảnh (`/thumb`):
          1. Nếu `pet/<素材根>-memes/` tồn tại (loại đó có meme riêng): **chỉ tìm trong thư mục đó**; không tìm thấy thì báo lỗi rõ ràng `404`,
             **tuyệt đối không quay về** thư mục khác;
          2. Nếu không tồn tại: ưu tiên thư mục người dùng `$DSH_HOME/dsh-pet/memes/`, sau đó đến `assets/memes/` trong gói (hợp nhất theo từng tệp,
             cùng cấu trúc với chuỗi tài nguyên chính `main-animation/<ext> → assets/<ext>` trong gói).

          Thư mục gốc tài nguyên = khóa mục của thú cưng đó (`assetRoot`: thú cưng cấu hình chính dùng `main`, thú cưng dạng tệp dùng tiền tố tệp cấu hình).
          Dạng hai đoạn cũ `/dsh-pet-7340/pic/memes/<名>.png` vẫn hoạt động, tương đương chuỗi fallback của thư mục gốc tài nguyên `main`
          (client chưa nâng cấp vẫn lấy được meme trong gói như trước).

          `素材根` là **định danh** (không phải đoạn đường dẫn): chứa dấu phân cách / ký tự dành riêng thì trả `400`, trước mọi bước ghép đường dẫn.
          Tên meme chính là tên tệp (không gồm thư mục con); cả hai dùng chung cơ chế kiểm tra ngăn truy cập vượt đường dẫn.
      parameters:
        - $ref: "#/components/parameters/AssetFile"
      responses:
        "200":
          description: Tệp ảnh
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "400":
          description: "Thư mục gốc tài nguyên chứa ký tự không hợp lệ (`dsh-pet: invalid asset root`)"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: "Không tìm thấy ảnh (`dsh-pet: pic not found`)"
          content:
            text/plain:
              schema:
                type: string

  /dsh-pet-7340/menu/item:
    post:
      tags: [Action]
      operationId: registerMenuItems
      summary: Đăng ký mục menu chuột phải bên thứ ba (thay thế toàn bộ mục của owner đó)
      description: |
        Dùng endpoint này khi plugin khác muốn thêm mục riêng vào menu chuột phải của thú cưng. Mọi mục bên thứ ba đều được gom dưới menu cấp một **“Thêm”**:
        nếu `label` là duy nhất trong tất cả mục bên thứ ba thì hiển thị trực tiếp (`Thêm / 弹弓`); nếu `label` trùng,
        mỗi `owner` có một menu con riêng dưới “Thêm” (`Thêm / owner / label`) để phân biệt các mục cùng tên.
        Các mục menu của host được cố định và không tham gia kiểm tra trùng tên.

        **Đăng ký = thay thế toàn bộ**: tất cả mục menu hiện tại của owner đó = `labels` trong lần gọi này (các mục không có trong danh sách cùng dấu kích hoạt
        đều bị xóa). Mỗi lần gọi mô tả đầy đủ “hiện tôi có những gì”, nên không để lại mục mồ côi; bên gọi
        cũng không cần biết lần trước đã đăng ký gì. Muốn xóa mục thì dùng `DELETE /menu/item?owner=`.

        **`owner` có hai vai trò**: vừa là khóa phân vùng (luồng sự kiện được tách theo nó), vừa là tên nhóm cấp một (hiển thị trực tiếp cho người dùng),
        vì vậy có thể dùng tiếng Trung. Bên đăng ký chịu trách nhiệm về nhãn menu; host **không khử trùng lặp, đánh số hay ghi nguồn** — nếu hai plugin cùng đặt tên
        “弹弓” thì sẽ hiển thị hai mục “弹弓”, mỗi mục trả sự kiện về owner tương ứng.

        Giới hạn: `owner` ≤ 64 ký tự, `label` ≤ 32 ký tự (sau trim không rỗng, cấm ký tự điều khiển), mỗi owner ≤ 20 mục,
        toàn cục ≤ 32 owner. Dữ liệu nằm trong bộ nhớ tiến trình và bị xóa khi DSH khởi động lại (plugin cần đăng ký lại sau khi tải lại).

        Sau khi đăng ký, ghi ngay vào `sections.menu` của `/state`; trình duyệt và desktop nhận được ở nhịp tiếp theo — **không cần khởi động lại desktop
        Helper**.

        **Lỗi nghiệp vụ vẫn trả 200** (theo quy ước của `/anim` và `/lock`): kiểm tra `ok`, `reason` cho biết loại lỗi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, labels]
              properties:
                owner:
                  type: string
                  maxLength: 64
                  description: Khóa phân vùng + tên nhóm cấp một. Cho phép tiếng Trung.
                  example: 小游戏
                labels:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: Nhãn mục menu (tự loại bỏ mục trùng trong cùng owner, giữ vị trí xuất hiện đầu tiên).
                  items:
                    type: string
                    maxLength: 32
                  example: [弹弓, 钓鱼]
      responses:
        "200":
          description: "Thành công `{ ok: true }`; thất bại `{ ok: false, reason, message }`"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  reason:
                    type: string
                    description: "Nguyên nhân thất bại: `bad-request` / `invalid-owner` / `invalid-labels` / `invalid-label` / `too-many-items` / `too-many-owners`"
                  message:
                    type: string
        "400":
          description: "Request body không phải JSON hợp lệ (`invalid JSON body`)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "405":
          description: Phương thức không được phép (chỉ chấp nhận POST / DELETE)
    delete:
      tags: [Action]
      operationId: clearMenuOwner
      summary: Xóa toàn bộ mục menu của một owner
      description: |
        Xóa toàn bộ mục menu của owner đó (bao gồm các dấu kích hoạt chưa được lấy). **Idempotent**: nếu owner vốn không tồn tại →
        `removed: 0`, vẫn được xem là thành công nên thử hủy đăng ký lại không gây lỗi.

        Sau khi xóa, long-poll đang chờ của owner đó sẽ được đánh thức; khi truy vấn lại không tìm thấy owner → `{ ok:false, reason:
        "unknown-owner" }`; bên gọi có thể đăng ký lại. Các owner khác không bị ảnh hưởng.
      parameters:
        - name: owner
          in: query
          required: true
          description: Owner cần xóa (mã hóa URL; với tiếng Trung phải dùng `encodeURIComponent`)
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: "Thành công `{ ok: true, removed: 2 }`; thất bại `{ ok: false, reason, message }`"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  removed:
                    type: integer
                    description: Số mục menu đã xóa (0 nếu owner không tồn tại)
                  reason:
                    type: string
                    description: "Nguyên nhân thất bại: `invalid-owner`"
                  message:
                    type: string
        "405":
          description: Phương thức không được phép (chỉ chấp nhận POST / DELETE)

  /dsh-pet-7340/menu/events:
    get:
      tags: [State]
      operationId: pollMenuEvents
      summary: Truy vấn lượt nhấp mục menu bên thứ ba (đọc là tiêu thụ)
      description: |
        Trả về **toàn bộ ánh xạ** `label → petId | null` của owner đó (`null` = chưa được nhấp), đồng thời xóa hết các dấu sự kiện.
        **Trả về là tiêu thụ, không gửi lại**: nếu tiến trình bị lỗi trước khi xử lý xong thì lượt kích hoạt đó mất; đây là lựa chọn có chủ ý
        (người dùng nhấp menu = kích hoạt một lần, không phải hàng đợi tin nhắn).

        Nhấp cùng một mục hai lần liên tiếp chỉ tính một lần (ngữ nghĩa chốt, không đếm và không sắp xếp); `petId` cho biết thú cưng nào được nhấp —
        khi chạy nhiều instance, cùng mục menu có thể được nhấp trên các thú cưng khác nhau.

        Nếu truyền `wait` thì dùng long-poll: khi chưa có kích hoạt nào thì chờ; sẽ trả về khi có lượt nhấp / hết thời gian / owner được đăng ký lại.
        Khi hết thời gian, vẫn trả ánh xạ toàn `null` (không phải lỗi).

        **Mỗi owner chỉ nên có một bên tiêu thụ**: hai tiến trình truy vấn đồng thời sẽ tranh nhau (bên nào trả về trước nhận được dấu sự kiện).
      parameters:
        - name: owner
          in: query
          required: true
          description: Owner đã dùng khi đăng ký (mã hóa URL; với tiếng Trung phải dùng `encodeURIComponent`)
          schema:
            type: string
        - name: wait
          in: query
          required: false
          description: Thời lượng long-poll tính bằng mili giây; mặc định 0 = trả về ngay
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        "200":
          description: 'Thành công `{ ok: true, events }`; owner không tồn tại `{ ok: false, reason: "unknown-owner" }`'
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  events:
                    type: object
                    description: label → petId đã kích hoạt mục đó; null = chưa được kích hoạt (đã xóa sau khi đọc)
                    additionalProperties:
                      type: [string, "null"]
                  reason:
                    type: string
                    description: "Nguyên nhân thất bại: `unknown-owner` (chưa từng đăng ký / đã bị xóa / host đã khởi động lại)"
                  message:
                    type: string
        "405":
          description: Phương thức không được phép (chỉ chấp nhận GET)

  /dsh-pet-7340/menu/click:
    post:
      tags: [Action]
      operationId: reportMenuClick
      summary: Đầu kết xuất báo lượt nhấp menu (kênh nội bộ, bên thứ ba không gọi)
      description: |
        Trình duyệt và desktop gọi endpoint này khi người dùng nhấp mục menu bên thứ ba, đánh dấu mục là “được thú cưng này nhấp” và đánh thức long-poll
        đang chờ của owner đó. `delivered: false` (mục không còn tồn tại, đầu kết xuất đang dùng ảnh chụp của nhịp trước) là tình huống tranh chấp bình thường, vẫn trả 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, label, pet]
              properties:
                owner:
                  type: string
                  example: 小游戏
                label:
                  type: string
                  example: 弹弓
                pet:
                  type: string
                  description: Được nhấp trên thú cưng nào (dùng để phân biệt khi chạy nhiều instance)
                  example: main
      responses:
        "200":
          description: Kết quả báo cáo
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  delivered:
                    type: boolean
                    description: false = mục đó không còn tồn tại (tình huống tranh chấp bình thường, không phải lỗi)
        "405":
          description: Phương thức không được phép (chỉ chấp nhận POST)

  /dsh-pet-7340/todos:
    get:
      tags: [Action]
      operationId: listTodos
      summary: Đọc danh sách việc cần làm
      description: |
        Trả về toàn bộ việc cần làm, đã sắp xếp theo thứ tự: chưa hoàn thành trước, hạn càng gần càng lên trước, không có hạn ở cuối, đã hoàn thành cuối cùng.
        Dữ liệu được lưu trong thư mục người dùng của plugin (`<DSH_HOME>/dsh-pet/todos.json`); trình duyệt và desktop dùng chung một bản.

        **Nhắc nhở do bộ hẹn giờ của host điều khiển, không phụ thuộc trang có mở hay không**: càng gần hạn thì nhắc càng thường xuyên —
        bắt đầu nhắc khi còn dưới 7 ngày (24h → 12h → 4h → 1h → 20m → 5m, tăng dần tần suất),
        sau hạn thì nhắc mỗi 30 phút trong ngày đầu, mỗi 6 giờ trong tuần đầu, sau đó ngừng làm phiền.
        Mỗi lời nhắc do một thú cưng đang hiển thị nói ra (ưu tiên thú cưng hiển thị trên web), ghi vào `pets.<id>.say`.
        Nếu không có đầu nào trực tuyến (không có yêu cầu long-poll đang chờ), bỏ qua cả nhịp đó và nhắc bù khi có đầu kết nối.
      responses:
        "200":
          description: Danh sách việc cần làm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoListResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [Action]
      operationId: createTodo
      summary: Tạo một việc cần làm
      description: |
        `text` là bắt buộc (1–200 điểm mã sau khi trim); `dueAt` là tùy chọn, mili giây epoch hoặc `null` (không có hạn).
        Việc không có hạn sẽ không kích hoạt nhắc nhở nhưng vẫn xuất hiện trong danh sách.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 200
                  example: 交周报
                dueAt:
                  type: [integer, "null"]
                  description: Thời điểm đến hạn (epoch ms); `null` / không truyền = không có hạn
                  example: 1793000000000
      responses:
        "200":
          description: 'Kết quả tạo mới; nếu nội dung rỗng / quá dài hoặc `dueAt` không hợp lệ thì trả `ok: false` + `bad-request`'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TodoResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'Request body không phải đối tượng JSON: `400` + `{"ok":false,"reason":"invalid-json"}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "413":
          description: 'Request body vượt quá 16 KiB: `413` + `{"ok":false,"reason":"payload-too-large"}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /dsh-pet-7340/todos/{id}:
    patch:
      tags: [Action]
      operationId: updateTodo
      summary: Sửa một việc cần làm
      description: |
        Chỉ cập nhật các trường có trong request body; phải cung cấp ít nhất một trong `text` / `dueAt` / `done` (đối tượng rỗng trả `bad-request`).
        Khi đánh dấu hoàn thành sẽ ghi `completedAt`; **mở lại hoặc đổi hạn đều xóa lịch nhắc nhở**, sau đó tính lại theo trạng thái mới.
      parameters:
        - $ref: "#/components/parameters/TodoIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 200
                dueAt:
                  type: [integer, "null"]
                done:
                  type: boolean
      responses:
        "200":
          description: |
            Kết quả cập nhật. Nếu ID không tồn tại thì trả `ok: false` + `todo-not-found`; trường không hợp lệ thì trả `bad-request`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TodoResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 'Request body không phải đối tượng JSON: `400` + `{"ok":false,"reason":"invalid-json"}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags: [Action]
      operationId: deleteTodo
      summary: Xóa một việc cần làm
      description: 'Idempotent: ngay cả khi ID không tồn tại vẫn trả `ok: true`, `removed: 0`.'
      parameters:
        - $ref: "#/components/parameters/TodoIdPath"
      responses:
        "200":
          description: Kết quả xóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoRemovedResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

components:
  parameters:
    PetIdQuery:
      name: pet
      in: query
      required: true
      description: |
        ID vật nuôi mục tiêu (trường `pets[].id` trong cấu hình) — **bắt buộc**.

        Không gửi / chuỗi rỗng / toàn khoảng trắng → `ok: false` + `reason: pet-required`;
        Đã gửi nhưng cấu hình không có vật nuôi này → `ok: false` + `reason: unknown-pet`.
        **Không có giá trị mặc định**: tuyệt đối không chuyển sang "pet desktop hiện tại" hoặc vật nuôi đầu tiên trong danh sách (issue #122 mục 1),
        vì vậy đích nhận cùng một yêu cầu sẽ không thay đổi theo lựa chọn `/pet` của người dùng.
        Có thể chứa dấu chấm và chữ Trung; **không** tách theo `.` để truy xuất khóa đường dẫn do `/state` trả về.
      schema:
        type: string
      example: main

    SurfaceQuery:
      name: surface
      in: query
      required: true
      description: |
        **Bề mặt hiển thị mà bên gọi yêu cầu** — **bắt buộc** (cùng cấp với `pet`, issue #122 mục 1).

        `pet` chỉ cho biết "con nào", không cho biết "hiển thị ở đâu". Nếu dùng vật nuôi có `display: desktop` làm đích trên web,
        host vẫn tiếp nhận như thường nhưng **không renderer nào tiêu thụ lệnh**: bên gọi nhận `ok: true` mà không có gì xảy ra,
        đến khi hết thời gian chờ biên nhận mới biết có vấn đề. Tham số này chuyển trường hợp "chắc chắn không thể thực hiện" thành lỗi tường minh ngay từ đầu.

        Giá trị:

        - `web` — phải hiển thị trên **web** (`display` là `web` / `both`);
        - `desktop` — phải hiển thị trên **desktop** (`display` là `desktop` / `both`);
        - `both` — phải hiển thị **trên cả hai bề mặt** (chỉ khớp `display: both`, chặt hơn "bề mặt nào cũng được");
        - `any` — **không xét chế độ hiển thị**: chấp nhận cả bốn giá trị `display`, **kể cả `none`** (dành cho bên gọi không cần xem kết quả hiển thị,
          ví dụ cửa sổ trò chuyện: bộ nhớ và giá trị trả về không phụ thuộc vào bề mặt hiển thị).

        Có hai trường hợp thất bại (đều trả HTTP 200 + `ok: false`):

        - Thiếu / không hợp lệ (kể cả sai chữ hoa-thường hoặc chuỗi rỗng) → `bad-request`;
        - Không khớp với `display` của vật nuôi (`display: none` chỉ được `any` chấp nhận) → `pet-not-displayed`,
          đồng thời **trả kèm `display` thực tế của vật nuôi** để bên gọi biết cần làm gì.

        **Đây là bước kiểm tra trước, không phải "định tuyến theo bề mặt"**: lệnh vẫn được ghi vào cùng một leaf và nội dung vẫn hoàn toàn giống nhau ở hai bề mặt.
        Muốn "web phát A, desktop phát B", hãy biểu đạt bằng **hai vật nuôi** (`display: web` / `display: desktop`).

        **Các endpoint không nhận tham số này**: `/lock/release` (thao tác giải phóng phải luôn thành công, nếu không sẽ không thể gỡ khóa khi vật nuôi bị ẩn giữa chừng)
        và `GET /chat` (đọc bộ nhớ không liên quan đến bề mặt hiển thị của vật nuôi).
      schema:
        type: string
        enum: [web, desktop, both, any]
      example: web

    LockQuery:
      name: lock
      in: query
      required: false
      description: |
        **Mã khóa chiếm dụng** (`lockId` do `POST /lock` trả về, issue #122 mục 4).

        - **Khi hiện không có khóa**: không gửi tham số này → cho phép như trước (các bên gọi hiện tại tiếp tục hoạt động mà không cần sửa; đây là ranh giới "không gửi lock = giữ nguyên
          không thay đổi trạng thái"); nếu gửi → `lock-lost` + `cause`, vì gửi mã có nghĩa là bên gọi tưởng mình vẫn đang giữ khóa,
          nhưng khóa đã hết hạn / được giải phóng / bị người dùng giành quyền.
        - Khi đang **có** khóa: phải gửi mã hiện có hiệu lực. Không gửi → `lock-required`;
          gửi mã không khớp → `lock-lost` (kèm `cause`).
        - Trong thời gian khóa, **chỉ bên giữ khóa** được thao tác với vật nuôi. Tương tác của người dùng không bị hạn chế: kéo / nhấp vào vật nuôi sẽ trực tiếp hủy khóa
          (dạng `force` của `POST /lock/release`, do renderer báo lên).
      schema:
        type: string
      example: lk-mfh2k1-1

    AssetFile:
      name: file
      in: path
      required: true
      description: |
        Tên tệp, có thể gồm thư mục con. Meme dùng `memes/<素材根>/<名>.png` (cũng chấp nhận dạng cũ `memes/<名>.png`),
        biểu tượng thông báo dùng `<名>.png`.
      schema:
        type: string

    TodoIdPath:
      name: id
      in: path
      required: true
      description: ID việc cần làm (`todos[].id` do `GET /todos` trả về); chỉ chấp nhận ký tự an toàn cho URL.
      schema:
        type: string
      example: todo-mfh2k1-1

  responses:
    MethodNotAllowed:
      description: 'Phương thức này không được hỗ trợ: `405` + `{ "ok": false, "reason": "method-not-allowed", "message": "..." }`'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureResponse"

    InternalError:
      description: 'Lỗi ngoài dự kiến ở host: `500` + `{ "ok": false, "reason": "internal-error", "message": "..." }` (nguyên nhân thực tế chỉ được ghi vào nhật ký host)'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureResponse"

  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
      description: Thao tác đã hoàn tất. Đọc dữ liệu từ `GET /state`.

    FocusSessionResponse:
      type: object
      required: [ok, sessionId, ts]
      properties:
        ok:
          type: boolean
          const: true
        sessionId:
          type: string
          description: ID phiên đã ghi (đã loại bỏ khoảng trắng ở đầu và cuối).
        ts:
          type: integer
          description: |
            Thời điểm ghi (mili giây). Bên tiêu thụ so sánh giá trị này với "mốc đã xử lý" của mình,
            chỉ chuyển phiên khi giá trị lớn hơn mốc đó — nếu trang tải sau thời điểm ghi, cơ chế này phát lại sự kiện thay vì để mốc ban đầu nuốt mất.
      description: |
        Ý định đã được ghi vào `sections.focusSession`. Điều này không có nghĩa trang đã chuyển phiên:
        trang chỉ chuyển khi poll thấy leaf này và `ts` lớn hơn mốc cục bộ.

    SayResponse:
      type: object
      required: [ok, text]
      properties:
        ok:
          type: boolean
          const: true
        text:
          type: string
          description: |
            Nội dung được tạo lần này. Đây là cùng một biến `text` đồng thời được ghi vào `pets.<id>.say` —
            cả hai đầu ra đều cung cấp cùng một văn bản, không có chuyện "một bản từ API, một bản từ luồng trạng thái".
        image:
          type: string
          description: |
            Tên meme hiển thị cùng văn bản (chỉ có khi mục này bật hình minh họa và tìm thấy ảnh phù hợp trong kho; nếu không, trường này bị lược bỏ).
      description: |
        Đã tạo thành công. Văn bản **vẫn** được ghi vào `pets.<id>.say` như trước — các bên tiêu thụ khác (web, desktop, trình nghe bên thứ ba)
        tiếp tục đọc từ `/state`; giá trị trả về chỉ giúp bên khởi tạo tiết kiệm một lượt gọi, không thay đổi luồng hiển thị hiện có.

    EnvironmentWeather:
      type: object
      required: [city, summary, temperatureC, apparentC, humidityPercent, windKph, code, observedAt]
      properties:
        city:
          type: string
          description: Tên trạm thời tiết (tên tiếng Trung do tìm kiếm địa danh trả về, có thể lệch một ký tự so với thành phố suy ra từ IP).
        summary:
          type: string
          description: Mô tả thời tiết ngắn, ví dụ "âm u".
        temperatureC:
          type: number
          description: Nhiệt độ không khí (°C).
        apparentC:
          type: number
          description: Nhiệt độ cảm nhận (°C).
        humidityPercent:
          type: number
          description: Độ ẩm tương đối (%).
        windKph:
          type: number
          description: Tốc độ gió (km/h).
        code:
          type: integer
          description: Mã thời tiết WMO (renderer có thể dùng mã này để chọn biểu tượng).
        observedAt:
          type: string
          description: Thời điểm quan trắc theo giờ địa phương của trạm (chuỗi ISO, không có hậu tố múi giờ).
      description: Ảnh chụp thời tiết hiện tại, có cấu trúc trường giống `WeatherSnapshot` của host.

    EnvironmentResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
        region:
          type: string
          description: Tỉnh / bang, ví dụ "tỉnh Giang Tây"; bị lược bỏ nếu cơ sở dữ liệu IP không cung cấp.
        city:
          type: string
          description: Thành phố, ví dụ "Nam Xương"; bị lược bỏ nếu định vị thất bại.
        weather:
          $ref: "#/components/schemas/EnvironmentWeather"
        petId:
          type: string
          description: |
            Chỉ xuất hiện khi có `?pet=`: kết quả đã được ghi vào `sections.env`; vật nuôi tương ứng sẽ hiển thị bong bóng môi trường.
      description: |
        Kết quả truy vấn. Tỉnh và thành phố được trả về riêng; bên tiêu thụ tự ghép thành câu hoặc hiển thị theo dạng phong phú.
        Mọi trường không lấy được đều bị lược bỏ, không dùng `null` làm giá trị thay thế.

    FailureResponse:
      type: object
      required: [ok, reason]
      properties:
        ok:
          type: boolean
          const: false
        reason:
          type: string
          description: |
            Phân loại nguyên nhân thất bại. `bad-request`: tham số không hợp lệ (văn bản rỗng/quá dài); `provider-missing`: không có nhà cung cấp hội thoại khả dụng;
            `generate-error`: tạo nội dung hoặc IO thất bại; `pet-required`: thiếu pet bắt buộc
            (không gửi / chuỗi rỗng / toàn khoảng trắng); `unknown-pet`: không tồn tại pet desktop được chỉ định;
            `unknown-image`: ảnh minh họa không có trong kho meme của gói; `unknown-animation`: tên hoạt ảnh không có trong kho.

            Khóa chiếm dụng (issue #122 mục 4) có thêm ba nguyên nhân: `locked`: vật nuôi đang bị bên khác chiếm dụng (kèm `expiresAt`);
            `lock-required`: đang có khóa nhưng không gửi `lock`; `lock-lost`: `lock` đã gửi không phải mã đang có hiệu lực
            (kèm `cause`).

            Đối chiếu bề mặt hiển thị (issue #122 mục 1) có thêm nguyên nhân: `pet-not-displayed`: `display` của vật nuôi
            không đáp ứng `surface` trong yêu cầu (kèm `display` = chế độ hiển thị **thực tế** của vật nuôi).

            Trạng thái trực tiếp (`GET /pose`) có thêm nguyên nhân: `pose-unavailable`: cấu hình bật hiển thị trên desktop nhưng chưa nhận được báo cáo nào từ renderer
            (ứng dụng desktop chưa chạy / vừa khởi động lại).

            Biên nhận và menu bên thứ ba có thêm: `unknown-playback` (mã không tồn tại hoặc đã hết hạn),
            `unknown-owner` (owner này chưa được đăng ký). Thiếu khả năng của host là `unsupported`.
            Cấu hình người dùng bị hỏng là `user-config-unparsable` (kèm `needConfirm`, `userFile`).

            Các nguyên nhân lỗi giao thức (`invalid-json` / `method-not-allowed` / `payload-too-large` /
            `internal-error`) cũng xuất hiện trong đối tượng này, chỉ khác là mã trạng thái không phải 200.
          enum:
            [
              bad-request,
              provider-missing,
              generate-error,
              pet-required,
              unknown-pet,
              unknown-image,
              unknown-animation,
              unknown-owner,
              unknown-playback,
              sleeping,
              no-sleep-animations,
              locked,
              lock-required,
              lock-lost,
              pet-not-displayed,
              pose-unavailable,
              unsupported,
              user-config-unparsable,
            ]
        cause:
          type: string
          description: |
            Chỉ `lock-lost` mới có: **khóa bị mất như thế nào** — `expired`: không gia hạn kịp; `released`: đã được giải phóng;
            `preempted`: bị **người dùng** giành quyền (kéo / nhấp / ẩn / đóng); `unknown`: không nhận ra mã này.
          enum: [expired, released, preempted, unknown]
        expiresAt:
          type: integer
          format: int64
          description: |
            Chỉ `locked` mới có: thời điểm **hết hạn** khóa hiện tại (mili giây epoch). Dùng giá trị này để quyết định khi nào thử lại.
          example: 1755000030000
        display:
          type: string
          description: |
            Chỉ `pet-not-displayed` mới có: chế độ hiển thị **thực tế** của vật nuôi (`web` / `desktop` / `both` /
            `none`), được trả nguyên trạng — bên gọi dựa vào đó để quyết định đổi `surface` hay `pet`.
          enum: [web, desktop, both, none]
          example: desktop
        message:
          type: string
          description: Thông tin bổ sung dễ đọc với người dùng (tùy chọn)

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    PlaybackRecord:
      type: object
      description: Bản ghi của một lần phát theo yêu cầu (phần thân phản hồi `GET /playback/{id}` là bản sao nông của đối tượng này cộng với `matched`).
      required: [playbackId, petId, name, status, createdAt, updatedAt, matched]
      properties:
        playbackId:
          type: string
        petId:
          type: string
          description: ID pet desktop mục tiêu
        name:
          type: string
          description: Tên hoạt ảnh (cũng là tên tệp tài nguyên)
        status:
          type: string
          enum: [accepted, playing, ended, failed, cancelled]
        createdAt:
          type: integer
          description: Thời điểm tiếp nhận (mili giây epoch)
        updatedAt:
          type: integer
          description: Thời điểm thay đổi trạng thái gần nhất (mili giây epoch)
        endedAt:
          type: integer
          description: Chỉ xuất hiện khi `status` là `ended` (thời điểm chuyển sang trạng thái kết thúc)
        reason:
          type: string
          description: |
            Chỉ xuất hiện khi `failed` / `cancelled`. Các giá trị hiện tại: `asset-load` (không tải được tài nguyên) /
            `decode-error` (giải mã thất bại) / `play-rejected` (tự động phát bị từ chối) /
            `busy` (hệ thống chuyển động đang bận nên lần phát này không bắt đầu được) / `superseded` (bị ngắt hoặc thay thế) /
            `frozen` (bị **khóa chiếm dụng** đóng băng và ngắt — khi mở khóa, hệ thống trở về idle / khôi phục trạng thái, **không tiếp tục hoạt ảnh này**;
            do đó hoạt ảnh sẽ không chạy đến hết; đây là "ngắt" chứ không phải "tạm dừng").
        matched:
          type: boolean
          description: "`true` = đã đợi đến trạng thái trong `wait`; `false` = trả về do hết thời gian chờ"

    PollState:
      type: object
      required: [counter, sections, pets]
      description: |
        Trạng thái S thống nhất. Mỗi leaf có dạng `{ counter, data }`; `counter` thay đổi nghĩa là leaf đó đã được cập nhật.
        `counter` cấp cao nhất là phiên bản của toàn bộ S (không phải leaf); tín hiệu thay đổi cấu hình cũng là một leaf (`sections.config`).
      properties:
        counter:
          type: integer
          format: int64
          minimum: 0
          description: |
            Phiên bản của toàn bộ S = **mã lần ghi cuối cùng** (ở cấp cao nhất, không phải leaf: không có `data` và không tham gia so sánh leaf).
            Gửi lại dưới dạng `?since=` để cho biết "bản tôi đang có là phiên bản nào"; khác với phiên bản hiện tại nghĩa là đã có thay đổi.
            `0` = chưa từng ghi leaf nào. Giá trị này luôn bằng **counter lớn nhất trong tất cả các leaf** (một bộ đếm tăng đơn điệu toàn cục).
          example: 1755000000007
        sections:
          type: object
          description: Phần toàn cục (mọi bề mặt dùng chung một bản)
          required: [balance, workStatus, notify, config, focusSession]
          properties:
            balance:
              $ref: "#/components/schemas/BalanceLeaf"
            workStatus:
              $ref: "#/components/schemas/WorkStatusLeaf"
            notify:
              $ref: "#/components/schemas/NotifyLeaf"
            config:
              $ref: "#/components/schemas/ConfigLeaf"
            focusSession:
              $ref: "#/components/schemas/FocusSessionLeaf"
        pets:
          type: object
          description: Mỗi vật nuôi có một bản riêng; khóa là ID vật nuôi (**có thể chứa dấu chấm, không tách chuỗi**)
          additionalProperties:
            type: object
            required: [say, anim, position, throw, lock, sleep]
            properties:
              say:
                $ref: "#/components/schemas/SayLeaf"
              anim:
                $ref: "#/components/schemas/AnimLeaf"
              position:
                $ref: "#/components/schemas/PositionLeaf"
              throw:
                $ref: "#/components/schemas/ThrowLeaf"
              lock:
                $ref: "#/components/schemas/LockLeaf"
              sleep:
                $ref: "#/components/schemas/SleepLeaf"
      examples:
        typical:
          summary: Vật nuôi có số dư và lời thì thầm định kỳ
          value:
            counter: 1755000000600
            sections:
              balance:
                counter: 1755000000000
                data:
                  ok: true
                  provider: deepseek-official
                  shape: money
                  data:
                    wallets:
                      - currency: CNY
                        total: "42.00"
                        granted: "10.00"
                        toppedUp: "32.00"
                        fullBalance: "20"
              workStatus:
                counter: 1755000000100
                data:
                  state: working
                  task: 正在读取 src/host/index.ts
              notify:
                counter: 1755000000200
                data:
                  type: session/event
                  event:
                    type: turn/end
                    data:
                      reason:
                        kind: completed
              config:
                counter: 1755000000600
                data: {}
            pets:
              main:
                say:
                  counter: 1755000000300
                  data:
                    text: 主人今天也要加油哦～
                    image: 可爱
                anim:
                  counter: 1755000000400
                  data:
                    name: 东张西望
                    playbackId: pb-mfh2k1-1
                position:
                  counter: 1755000000500
                  data:
                    x: 0.5
                    y: 0.35
                    mode: spring
                throw:
                  counter: 0
                  data: null

    BalanceLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            `BalanceState`; `null` = chưa từng được ghi.
            Được host làm mới định kỳ (`eventsRefreshSec.balance`, mặc định 1800 giây) hoặc ghi bằng `POST /balance`.
          oneOf:
            - $ref: "#/components/schemas/BalanceView"
            - $ref: "#/components/schemas/BalanceUnavailable"
            - type: "null"

    BalanceView:
      type: object
      required: [ok, provider, shape]
      description: Số dư khả dụng
      properties:
        ok:
          type: boolean
          const: true
        provider:
          type: string
          example: deepseek-official
        shape:
          type: string
          description: |
            Dạng hiển thị. `windows` = mức sử dụng của ba cửa sổ (phần trăm, opencode / commandcode);
            `money` = số dư tài khoản (hai tuyến DeepSeek);
            `points` = số dư điểm (đơn vị phi tiền tệ, ví dụ hạn mức tích hợp trong gateway cục bộ).
          enum: [windows, money, points]
        manual:
          type: boolean
          description: |
            Chỉ xuất hiện khi lần ghi này được **kích hoạt thủ công** (`POST /balance`, lệnh `/balance` hoặc mục "Xem số dư" trên desktop).
            Bên tiêu thụ dựa vào đó để quyết định có luôn hiển thị thông báo dạng văn bản khi số dư không khả dụng hay không.
        rolling:
          type: number
          description: opencode / commandcode — mức sử dụng cửa sổ trượt 5 giờ (0–100)
        weekly:
          type: number
          description: opencode / commandcode — mức sử dụng cửa sổ tuần (0–100)
        monthly:
          type: number
          description: opencode / commandcode — mức sử dụng cửa sổ tháng (0–100)
        rollingResetsAt:
          type: string
          format: date-time
          description: opencode / commandcode — thời điểm đặt lại cửa sổ trượt (5 giờ)
        weeklyResetsAt:
          type: string
          format: date-time
          description: opencode / commandcode — thời điểm đặt lại cửa sổ tuần
        monthlyResetsAt:
          type: string
          format: date-time
          description: opencode / commandcode — thời điểm đặt lại cửa sổ tháng
        rollingCapUsd:
          type: number
          description: commandcode — hạn mức tối đa của cửa sổ trượt (5 giờ, USD, do API trả về) — dùng để xác định "cửa sổ cấp bách nhất"
        weeklyCapUsd:
          type: number
          description: commandcode — hạn mức tối đa của cửa sổ tuần (USD, do API trả về)
        monthlyCapUsd:
          type: number
          description: commandcode — hạn mức tối đa của cửa sổ tháng (USD) = mức đã dùng trong kỳ + hạn mức còn lại; bị lược bỏ nếu cả hạn mức và mức dùng đều bằng 0
        usage:
          type: object
          description: |
            windows: tổng mức sử dụng tích lũy trong kỳ; hiện chỉ commandcode trả về.
            Nếu nhà cung cấp không cung cấp được, toàn bộ trường này bị lược bỏ và bong bóng chỉ có hai trang.
            `tokens` là giá trị gộp — API không tách riêng phần cache hit; `requests` và `tokens` được tổng hợp theo lô,
            nên có thể trễ hơn phần trăm cửa sổ vài phút.
          required: [totalTokens, inputTokens, outputTokens, requests, spentUsd]
          properties:
            totalTokens:
              type: integer
              description: Tổng token trong kỳ
            inputTokens:
              type: integer
              description: Token đầu vào gộp (bao gồm phần cache hit, API không cung cấp chi tiết tách riêng)
            outputTokens:
              type: integer
              description: Token đầu ra
            requests:
              type: integer
              description: Số yêu cầu trong kỳ (bao gồm yêu cầu thất bại)
            spentUsd:
              type: number
              description: Chi phí trong kỳ (USD)
        wallets:
          type: array
          description: |
            money: ví đa tiền tệ, **mỗi loại tiền tệ một mục**. Tài khoản có thể đồng thời giữ CNY và USD (ví dụ "USD 0.00 + CNY có số dư"),
            nên trường này là mảng; ngưỡng của các loại tiền tệ khác nhau không thể quy đổi lẫn nhau, hãy tính riêng từng tỷ lệ rồi cộng lại.
            Lớp hiển thị dùng dữ liệu này để chọn ký hiệu, lọc loại tiền có số dư 0 (vẫn hiển thị số âm) và quy đổi mức.
          items:
            type: object
            required: [currency, total, granted, toppedUp]
            properties:
              currency:
                type: string
                example: CNY
              total:
                type: string
                description: Tổng số dư của loại tiền này (chuỗi, giữ nguyên như nguồn; **có thể âm = thấu chi**)
                example: "8.16"
              granted:
                type: string
                description: Hạn mức được tặng (tuyến chính thức chuyển tiếp nguyên trạng; tuyến tài khoản lấy từ ví tiền thưởng cùng loại tiền, nếu không có thì là "0.00")
                example: "3.85"
              toppedUp:
                type: string
                description: Số tiền đã nạp
                example: "4.31"
              fullBalance:
                type: string
                description: |
                  Ngưỡng mức của loại tiền này (đơn vị cùng loại tiền) — số dư ≥ giá trị này được xem là chưa bị sử dụng.
                  Không có giá trị = loại tiền này không có ngưỡng, không tham gia quy đổi mức (không tự đoán giá trị). DeepSeek: CNY 20 / USD 5.
                example: "20"
        points:
          type: object
          description: |
            points: số dư điểm (đơn vị phi tiền tệ). `unit` chỉ là hậu tố hiển thị ghép sau con số,
            không tham gia tính toán nào (khác với vai trò của `wallets[].currency`, vốn là mã tiền tệ).
            Bong bóng hiển thị "Số dư: 800 điểm", không thêm ký hiệu tiền tệ.
          required: [unit, total]
          properties:
            unit:
              type: string
              description: Đơn vị hiển thị (ví dụ "điểm", "điểm thưởng")
              example: 积分
            total:
              type: string
              description: Số dư hiện tại (chuỗi, giữ nguyên như nguồn; không quy đổi hay tính lại)
              example: "800"
            full:
              type: string
              description: |
                Ngưỡng mức (giá trị theo cùng đơn vị `unit`) — số dư ≥ giá trị này được xem là chưa bị sử dụng.
                Không có giá trị = không có ngưỡng; không quy đổi phần trăm, không phát hoạt ảnh theo mức (không tự đoán giá trị).
              example: "1000"

    BalanceUnavailable:
      type: object
      required: [ok, provider, reason]
      description: Số dư không khả dụng (được đánh dấu tường minh, không âm thầm bỏ qua)
      properties:
        ok:
          type: boolean
          const: false
        provider:
          type: string
        manual:
          type: boolean
          description: Tương tự `BalanceView.manual`
        reason:
          type: string
          enum: [unsupported, credential-missing, fetch-error]
          description: |
            `unsupported` = nhà cung cấp này không hỗ trợ tra cứu số dư;
            `credential-missing` = thiếu thông tin xác thực;
            `fetch-error` = truy xuất thất bại.
        message:
          type: string

    WorkStatusLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            `WorkStatusSnapshot`; `null` = chưa từng được ghi.
            Được tổng hợp sau khi host lắng nghe sự kiện phiên DSH (`turn/start`, `tool/call`, `tool/result`,
            `approval/asked`, `turn/end`); cũng có thể ghi từ bên ngoài bằng `POST /work-status`
            vào slot cố định `api`.
          oneOf:
            - $ref: "#/components/schemas/WorkStatusSnapshot"
            - type: "null"

    WorkStatusSnapshot:
      type: object
      required: [state, task]
      properties:
        state:
          description: |
            Mức trạng thái công việc, tương ứng với chỉ số trong mảng cấu hình `animations.events.workStatus`.
            `null` = rảnh.
          oneOf:
            - type: string
              enum: [thinking, working, result, waiting, success, error]
            - type: "null"
        task:
          description: Chi tiết tác vụ hiện tại (do công cụ todo / write cung cấp), có thể là `null`
          oneOf:
            - type: string
            - type: "null"

    NotifyLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            Khung thông báo; `null` = chưa từng được ghi.
            Được tạo khi host lắng nghe sự kiện của DSH; trình duyệt hiển thị thông báo hệ thống khi poll phát hiện thay đổi.
            **Một slot duy nhất**: thông báo mới ghi đè thông báo cũ, không xếp hàng (với chu kỳ poll 1 giây, mỗi lượt chỉ xử lý thông báo mới nhất).
          oneOf:
            - $ref: "#/components/schemas/NotifyFrame"
            - type: "null"

    ConfigLeaf:
      type: object
      required: [counter, data]
      description: |
        **Tín hiệu thay đổi cấu hình** (leaf chỉ chứa tín hiệu). `data` luôn là `{}`, **chỉ `counter` mang thông tin hữu ích**:
        nếu giá trị thay đổi, cấu hình đã được ghi và bên tiêu thụ nên tải lại `GET /config`.

        Vì sao dùng tín hiệu thay vì bản thân cấu hình: cấu hình tổng hợp rất lớn, trong khi mỗi yêu cầu `/state` trả về **đầy đủ data của mọi leaf
        **; đưa cấu hình vào đây đồng nghĩa truyền toàn bộ cấu hình mỗi giây (trên desktop còn một lần cho mỗi cửa sổ/vật nuôi).

        **Bên ghi**: `POST /pet-display` (đổi vị trí hiển thị bằng menu chuột phải trên desktop) và `POST /pet-config` (ghi lại toàn bộ mục)
        — cả hai đều có thể không phải thay đổi cấu hình do chính trang khởi tạo thực hiện. Lưu / đồng bộ cấu hình (`PUT` / `POST /config`) không ghi leaf này,
        vì bên gọi đã nhận được bản cấu hình tổng hợp hoàn chỉnh.

        **Không phát hiện việc người dùng sửa thủ công `main-config.jsonc` / `pet/*.json`**: host không còn đọc đĩa để so sánh mtime
        (cách cũ tương đương đọc đĩa mỗi nhịp); cần tải lại sau khi sửa.
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          type: object
          description: Luôn là `{}` (đối tượng rỗng). Không đọc nội dung cấu hình ở đây — hãy dùng `GET /config`.
          maxProperties: 0

    FocusSessionLeaf:
      type: object
      required: [counter, data]
      description: |
        **Lệnh chuyển phiên** (tín hiệu dùng một lần). `data` có dạng `{ sessionId, ts }`, được ghi bằng `POST /focus-session`.
        `data` là `null` nghĩa là chưa từng được ghi.
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          oneOf:
            - type: "null"
            - type: object
              required: [sessionId, ts]
              properties:
                sessionId:
                  type: string
                  description: ID phiên đích (đã loại bỏ khoảng trắng ở đầu và cuối).
                ts:
                  type: integer
                  format: int64
                  description: Thời điểm ghi (mili giây). Bên tiêu thụ dùng giá trị này để loại trùng, không quay về phiên cũ.

    NotifyFrame:
      oneOf:
        - $ref: "#/components/schemas/TurnEndFrame"
        - $ref: "#/components/schemas/ApprovalFrame"
        - $ref: "#/components/schemas/QuestionFrame"
        - $ref: "#/components/schemas/AgentErrorFrame"
      discriminator:
        propertyName: type
        mapping:
          session/event: "#/components/schemas/TurnEndFrame"
          approval/requested: "#/components/schemas/ApprovalFrame"
          question/requested: "#/components/schemas/QuestionFrame"
          host/agent-error: "#/components/schemas/AgentErrorFrame"

    TurnEndFrame:
      type: object
      required: [type, event]
      description: Một lượt đã kết thúc (chỉ thông báo với `completed` / `error` / `max-tokens`; không thông báo với `aborted` và các trạng thái tương tự)
      properties:
        type:
          type: string
          const: session/event
        sessionId:
          $ref: "#/components/schemas/NotifySessionId"
        event:
          type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: turn/end
            data:
              type: object
              properties:
                reason:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [completed, error, max-tokens]
                    error:
                      type: object
                      properties:
                        message:
                          type: string

    ApprovalFrame:
      type: object
      required: [type]
      description: Mô hình đang yêu cầu quyền sử dụng công cụ
      properties:
        type:
          type: string
          const: approval/requested
        sessionId:
          $ref: "#/components/schemas/NotifySessionId"
        toolName:
          type: string
          description: Tên công cụ yêu cầu quyền (tùy chọn)
        reason:
          type: string
          description: Lý do yêu cầu quyền (tùy chọn)

    QuestionFrame:
      type: object
      required: [type, questions]
      description: Mô hình đã gọi công cụ `ask_user_question` và đang chờ người dùng trả lời
      properties:
        type:
          type: string
          const: question/requested
        sessionId:
          $ref: "#/components/schemas/NotifySessionId"
        questions:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              question:
                type: string

    AgentErrorFrame:
      type: object
      required: [type, message]
      description: |
        Lỗi tạo nội dung không gắn với một lượt cụ thể (sự kiện `agent/error` từ DSH 0.1.5 trở lên).
        **Không có `sessionId`**: payload sự kiện không chứa ID phiên, vì vậy nhấp vào loại thông báo này chỉ đưa cửa sổ lên trước, không chuyển phiên.
      properties:
        type:
          type: string
          const: host/agent-error
        message:
          type: string

    NotifySessionId:
      type: string
      description: |
        ID phiên phát ra thông báo này (host lấy từ tham số phiên của `session/event`; trường bị lược bỏ nếu không lấy được ID thật).
        Khi nhấp thông báo, trang web dùng giá trị này để chuyển đến phiên đó (client `uiWorkspace.openSession`);
        nếu bị lược bỏ (host phiên bản cũ / sự kiện không xác định được phiên) = chỉ đưa cửa sổ lên trước, không tự đoán.

    AnimLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            Hoạt ảnh cần phát cho vật nuôi này; `null` = chưa từng được ghi.
            `counter` tăng sau mỗi lần ghi, vì vậy **phát cùng một hoạt ảnh theo yêu cầu hai lần liên tiếp vẫn được bên tiêu thụ xem là hai lệnh riêng**
            (phát lại). Có hai dạng: `name` (tên cũng là tên tệp tài nguyên `/thumb/<素材根>/<名字>.webm`, do đó tên
            phải có trong kho hoạt ảnh của vật nuôi) hoặc `url` (địa chỉ đầy đủ do bên thứ ba cung cấp, không tra kho) — **chỉ được có một trong hai**;
            được `POST /anim` đảm bảo trước khi ghi.
          oneOf:
            - $ref: "#/components/schemas/Anim"
            - type: "null"

    Anim:
      type: object
      description: |
        Một hoạt ảnh cần phát. Chỉ được có đúng một trong `name` và `url` (được `POST /anim` đảm bảo trước khi ghi).
        `facing` **tùy chọn**: thiếu trường = bên gọi không chỉ định hướng; bên tiêu thụ **giữ nguyên hướng** (không mặc định về `left`).
      properties:
        name:
          type: string
          description: |
            Tên hoạt ảnh cần phát (trùng với một tên có thể chọn trong menu của cấu hình `animations`).
            Bên tiêu thụ ghép "thư mục tài nguyên + tên" thành `/thumb/<素材根>/<名>.webm` để đổi nguồn và áp dụng **ngữ nghĩa menu**
            (loại văn bản được chỉnh gương để luôn quay trái, loại di chuyển dùng chuyển động thực, các loại khác phát một lần).
          example: 东张西望
        url:
          type: string
          description: |
            **Địa chỉ** tài nguyên cần phát (URL đầy đủ do bên thứ ba cung cấp, issue #122 mục 1).
            Bên tiêu thụ **dùng trực tiếp làm `src`, không áp dụng ngữ nghĩa menu** — địa chỉ thuần không cho biết "có phải loại văn bản / loại di chuyển"
            nên chỉ "phát xen kẽ một đoạn" (phát xong thì trở lại chuỗi hoạt ảnh bình thường).
            Cùng cấp với `name`, **phân biệt bằng tên trường** (không dò bằng `startsWith('http')`: nếu tên tình cờ giống
            địa chỉ thì sẽ bị nhận diện sai).
          example: https://cdn.example.com/拉侧栏.webm
        facing:
          type: string
          enum: [left, right]
          description: |
            Hướng do bên gọi **chỉ định tường minh** (`facing` của `POST /anim`). **Thiếu trường = không chỉ định** → bên tiêu thụ
            **giữ nguyên hướng** (giữ hướng hiện tại của vật nuôi, không mặc định về `left`) — vì vậy "không yêu cầu" và "yêu cầu `left`" có thể
            được phân biệt trong cấu trúc dữ liệu. Cả hai dạng `name` / `url` đều có thể chứa trường này.
          example: right

    PositionLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            Vị trí cần di chuyển vật nuôi đến; `null` = chưa từng được ghi.
            **Đây là lệnh, không phải báo cáo trạng thái**: host ghi, renderer đọc để di chuyển vật nuôi và **không ghi ngược lại**.
            Được ghi bằng `POST /position`.
          oneOf:
            - $ref: "#/components/schemas/PositionCue"
            - type: "null"

    PositionCue:
      type: object
      required: [x, y, mode]
      properties:
        x:
          type: number
          description: Tọa độ ngang chuẩn hóa của **tâm** vật nuôi (`0~1`, đã được host giới hạn trước khi ghi)
        y:
          type: number
          description: Tọa độ dọc chuẩn hóa của **tâm** vật nuôi (`0~1`, đã được host giới hạn trước khi ghi)
        mode:
          type: string
          enum: [instant, spring, line]
          description: |
            Chế độ di chuyển: `instant` đến nơi trong một khung hình / `spring` đuổi theo bằng lò xo quá tắt dần / `line` di chuyển thẳng trong thời gian `duration`.
        duration:
          type: number
          description: |
            **Chỉ có khóa này khi `mode: line`** (các chế độ khác không có): thời gian di chuyển (mili giây), số hữu hạn không âm,
            `0` = đến nơi ngay lập tức.

    ThrowLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            Vận tốc ban đầu khi ném vật nuôi; `null` = chưa từng được ghi.
            **Đây là lệnh, không phải báo cáo trạng thái**: host ghi, renderer đọc để ném vật nuôi và **không ghi ngược lại**.
            Được ghi bằng `POST /throw`.
          oneOf:
            - $ref: "#/components/schemas/ThrowCue"
            - type: "null"

    ThrowCue:
      type: object
      required: [angle, power]
      properties:
        angle:
          type: number
          description: |
            Hướng, đơn vị **độ**. `0` = sang phải, **ngược chiều kim đồng hồ là chiều dương** (`90` = lên trên, `-90` = xuống dưới).
        power:
          type: number
          exclusiveMinimum: 0
          description: |
            Hệ số lực. `1.0` = 1200 px/s **trước khi giới hạn tốc độ mềm** (vận tốc ban đầu thực tế khoảng 1021 px/s).

    SayLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            Lệnh nói của vật nuôi; `null` = chưa từng được ghi. **Có hai dạng**: `Say` (hiện bong bóng) và
            `SayClear` (ẩn bong bóng hiện tại, được ghi bằng `POST /bubble/clear`).
            **Lời thì thầm định kỳ, bong bóng từ lệnh và câu trả lời hội thoại dùng chung leaf này** — phía giao diện vốn dùng cùng một luồng hiển thị
            (cùng slot bong bóng và cùng nhóm hoạt ảnh `events.whisper`).
          oneOf:
            - $ref: "#/components/schemas/Say"
            - $ref: "#/components/schemas/SayClear"
            - type: "null"

    SleepLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            **Trạng thái ngủ** của vật nuôi; `null` = chưa từng được ghi (được xem là đang thức). Ghi bằng `POST /sleep` / `POST /wake`.

            **Host chọn tên của cả ba hoạt ảnh rồi ghi cùng lúc vào leaf** (chọn ngẫu nhiên bộ ngoài, rồi chọn ngẫu nhiên từng đoạn); renderer phát theo thứ tự
            "bắt đầu (một lần) → lặp (vô hạn) → thức dậy (một lần)", không tự chọn lại — nếu không, hai bề mặt có thể phát hai bộ khác nhau.

            **Đây là trạng thái, không phải lệnh**: renderer đọc để quyết định có ngủ hay không. Khi đang ngủ, chuỗi ngẫu nhiên, nguồn tự động (lời thì thầm /
            số dư / trạng thái công việc / nhắc việc cần làm) và các kích hoạt thủ công (nói / trò chuyện / phát hoạt ảnh theo yêu cầu) đều được xử lý như trạng thái ngủ;
            vẫn kéo được nhưng giữ tư thế ngủ. Host cũng dựa vào trạng thái này để bỏ qua vòng lặp tự động và từ chối API.
          oneOf:
            - $ref: "#/components/schemas/SleepState"
            - type: "null"

    SleepState:
      description: Hai dạng trạng thái ngủ, được phân biệt bằng trường `sleeping`.
      oneOf:
        - $ref: "#/components/schemas/SleepOn"
        - $ref: "#/components/schemas/SleepOff"

    SleepOn:
      type: object
      required: [sleeping, start, loop, end]
      description: Đang ngủ — host chọn tên cho cả ba hoạt ảnh.
      properties:
        sleeping:
          type: boolean
          const: true
        start:
          type: string
          description: Chuyển tiếp vào giấc ngủ (phát một lần).
          example: 睡觉-开始
        loop:
          type: string
          description: Vòng lặp ngủ (phát vô hạn, không kích hoạt `ended`).
          example: 睡觉-循环
        end:
          type: string
          description: Chuyển tiếp thức dậy (phát một lần); phát xong thì quay lại chuỗi ngẫu nhiên.
          example: 睡觉-起来

    SleepOff:
      type: object
      required: [sleeping]
      description: Đang thức (bao gồm vừa được đánh thức).
      properties:
        sleeping:
          type: boolean
          const: false

    LockLeaf:
      type: object
      required: [counter, data]
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: |
            **Trạng thái khóa chiếm dụng** của vật nuôi (issue #122 mục 4); `null` = chưa từng được ghi (được xem là không bị chiếm dụng).
            Được ghi bằng `POST /lock` / `POST /lock/release`; host cũng ghi bổ sung khi khóa hết hạn
            (việc hết hạn được **kiểm tra lười**, không có bộ định thời).

            **Đây là trạng thái, không phải lệnh** (khác với `anim` / `position` / `throw`): renderer đọc để quyết định
            "có đóng băng chính nó hay không" — không chọn ngẫu nhiên, tạm dừng hoạt ảnh tự phát hiện tại, bỏ qua biểu hiện số dư và trạng thái công việc từ nguồn **tự động**;
            không chặn các lệnh tường minh (`say` / `anim` / `position` / `throw`). Host không thể dừng một video đang phát,
            vì vậy renderer mới là bên thực hiện việc "đứng yên hoàn toàn".

            **`expiresAt` là nguồn dữ liệu duy nhất**: host không phát thông báo "khóa đã hết" khi đến hạn; renderer tự đặt giờ mở khóa dựa trên giá trị này.
            Do đó, nếu `expiresAt` **đã qua** thì xem như không có khóa (bắt buộc xử lý như vậy khi trang tải lại và nhận leaf cũ).

            **Không chứa `lockId`**: đây là thông tin xác thực của bên giữ khóa, không đưa vào `/state` mà mọi người đều đọc được.
          oneOf:
            - $ref: "#/components/schemas/LockState"
            - type: "null"

    LockState:
      description: Hai dạng khóa chiếm dụng, được phân biệt bằng trường `locked`.
      oneOf:
        - $ref: "#/components/schemas/LockOn"
        - $ref: "#/components/schemas/LockOff"

    LockOn:
      type: object
      required: [locked, expiresAt]
      description: Đang bị bên thứ ba chiếm dụng — vật nuôi cần được đóng băng.
      properties:
        locked:
          type: boolean
          const: true
        expiresAt:
          type: integer
          format: int64
          description: Thời điểm khóa lần này hết hạn (mili giây epoch).
          example: 1755000030000

    LockOff:
      type: object
      required: [locked]
      description: Không bị chiếm dụng (trạng thái bình thường — vật nuôi tiếp tục phát hoạt ảnh ngẫu nhiên, tự di chuyển, thì thầm, hiển thị số dư và trạng thái công việc).
      properties:
        locked:
          type: boolean
          const: false

    Say:
      type: object
      required: [text]
      description: Hiện một bong bóng thoại.
      properties:
        text:
          type: string
          description: Văn bản cần hiển thị (bên tiêu thụ sẽ loại bỏ văn bản rỗng)
        image:
          type: string
          description: |
            **Tên** ảnh minh họa tùy chọn (không phải URL): khóa trong cấu hình `memes`, cũng là tên tệp ảnh (không gồm phần mở rộng).
            Chỉ xuất hiện khi cấu hình bật `whisperImageEnabled` / `chatImageEnabled` và chọn được ảnh trong kho.
            Bên tiêu thụ (trình duyệt / desktop) ghép thư mục tài nguyên để tạo đường dẫn `/dsh-pet-7340/pic/memes/<素材根>/<名>.png`
            lấy ảnh; thư mục tài nguyên = khóa mục của vật nuôi (`assetRoot`).
            Cùng cấp với `url`, **phân biệt bằng tên trường**; **chỉ `POST /broadcast` ghi dạng `url`**.
        url:
          type: string
          description: |
            **Địa chỉ** ảnh minh họa tùy chọn (ảnh do bên thứ ba cung cấp, URL đầy đủ, issue #122 mục 1).
            Bên tiêu thụ dùng trực tiếp làm `src`, **không ghép đường dẫn meme**.
            Chỉ `POST /broadcast` ghi trường này (`image` / `url` được host đảm bảo chỉ có một).
        duration:
          type: number
          minimum: 0
          description: |
            Thời lượng hiển thị bong bóng (mili giây). **Mặc định 10 giây** (host cũ không ghi trường này thì vẫn dùng 10 giây);
            `0` = nghĩa đen là "không hiển thị" (giá trị hợp lệ; bên tiêu thụ không render bong bóng này).
            Chỉ `POST /broadcast` ghi trường này (giá trị mặc định cũng được điền tường minh); lời thì thầm và câu trả lời hội thoại không ghi.
          example: 10000
        anim:
          type: boolean
          description: |
            Lần này có kích hoạt hoạt ảnh `events.whisper` hay không. **Mặc định `true`** (host cũ không ghi trường này thì vẫn kích hoạt);
            `false` tường minh = chỉ hiện bong bóng, không tra kho hoạt ảnh và không đổi nguồn.
            Tương tự, chỉ `POST /broadcast` ghi trường này; lời thì thầm và câu trả lời hội thoại không ghi.
          example: true
        voiceTo:
          type: string
          enum: [web, desktop]
          description: |
            **Bề mặt nào sẽ đọc câu này thành tiếng**. Có hai quy tắc chọn giá trị:
            Các route có `?surface=` (`POST /whisper`, `POST /broadcast`) dùng bề mặt trong yêu cầu — `surface=web` / `desktop`
            được giữ nguyên; `both` / `any` không chỉ rõ một bề mặt nên chuyển sang quy tắc thứ hai; riêng `POST /broadcast` còn yêu cầu body có
            `speak: true`; nếu không thì chỉ hiện bong bóng, không ghi trường này; các nguồn khác (lời thì thầm định kỳ, nhắc việc cần làm, câu trả lời hội thoại,
            lệnh `/chat`) suy ra từ `display`: nếu có `desktop` thì ghi `desktop`; chỉ ghi `web` nếu chỉ hiển thị trên web —
            desktop luôn có cửa sổ miễn là helper đang chạy, còn trang web có thể bị đóng bất cứ lúc nào.
            Không có giá trị = không bề mặt nào đọc thành tiếng. Bên tiêu thụ so khớp với bề mặt của mình: nếu không khớp thì chỉ hiện bong bóng, không phát âm thanh; nếu có nhiều trang trên cùng bề mặt thì mỗi trang tự so khớp.

    SayClear:
      type: object
      required: [clear]
      description: |
        **Lệnh xóa** (đích ghi của `POST /bubble/clear`): ẩn bong bóng thoại hiện đang hiển thị của vật nuôi.
        Khi renderer phát hiện `counter` thay đổi và `data` có dạng này, nó ẩn bong bóng, **không ảnh hưởng hoạt ảnh đang phát**.

        Vì sao cần một dạng riêng: `readSay` của bên tiêu thụ xem văn bản rỗng là không hợp lệ và bỏ qua toàn bộ lượt,
        nên không thể biểu đạt "xóa" bằng `{ "text": "" }`.
      properties:
        clear:
          type: boolean
          const: true
          description: Luôn là `true`. Bên tiêu thụ chỉ chấp nhận **giá trị đúng kiểu `true`**; mọi giá trị khác đều được xử lý như văn bản thông thường.

    Counter:
      type: integer
      format: int64
      minimum: 0
      description: |
        Phiên bản leaf. Mỗi lần ghi sẽ cập nhật giá trị thành `Date.now()` và **tăng nghiêm ngặt**
        (nhiều lần ghi trong cùng một mili giây sẽ tăng thêm 1); giá trị không giảm khi host khởi động lại.
        **Dùng giá trị này để xác định "có thay đổi hay không"**: nếu bằng giá trị đã ghi lần trước thì bỏ qua render.
        `0` nghĩa là chưa từng được ghi.

    ChatMemoryMessage:
      type: object
      required: [role, content, ts]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: Nội dung tin nhắn (không gồm dấu đánh dấu ảnh / hành động)
        ts:
          type: integer
          format: int64
          description: Dấu thời gian ghi (mili giây)
        image:
          type: object
          description: |
            Ảnh người dùng tải lên trong lượt này, chỉ xuất hiện trong tin nhắn `user`; bị lược bỏ = lượt này không có ảnh.
            Lưu tham chiếu tệp đính kèm DSH (**không chứa dữ liệu ảnh**); cần đọc byte theo tham chiếu để lấy ảnh. Chỉ dùng để hiển thị lịch sử, không đưa vào ngữ cảnh.
          required: [attachmentId, mediaType, bytes, width, height]
          properties:
            attachmentId:
              type: string
              description: ID tệp đính kèm định danh theo nội dung (sha256), không phải đường dẫn tệp
            mediaType:
              type: string
              enum: [image/png, image/jpeg, image/webp, image/gif]
            bytes:
              type: integer
              description: Số byte sau mã hóa (dùng để kiểm tra tính toàn vẹn khi đọc ảnh)
            width:
              type: integer
            height:
              type: integer
        meme:
          type: string
          description: |
            Tên meme AI chọn cho lượt này (khóa trong cấu hình `memes`), chỉ xuất hiện trong tin nhắn `assistant`; bị lược bỏ = không có ảnh minh họa.
            Có thể khôi phục ảnh từ tên theo `/pic/memes/<素材根>/<名称>.png`; chỉ dùng để hiển thị lịch sử, không đưa vào ngữ cảnh.
        action:
          type: string
          description: |
            Tên hành động AI thực hiện trong lượt này (tên trong `animations.categories`), chỉ xuất hiện trong tin nhắn `assistant`;
            bị lược bỏ = lượt này không thực hiện hành động. Giống `meme`: chỉ dùng để hiển thị lịch sử trò chuyện, không đưa vào ngữ cảnh.

    Provider:
      type: object
      required: [id, name, models]
      properties:
        id:
          type: string
        name:
          type: string
          description: Tên hiển thị; nếu thiếu thì dùng `id`
        models:
          type: array
          description: Các model của nhà cung cấp này (mảng rỗng nếu không liệt kê được)
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string

    StorageEntry:
      type: object
      description: Một vị trí lưu trên đĩa
      properties:
        label:
          type: string
        path:
          type: string
      additionalProperties: true

    ModelSelection:
      type: object
      description: |
        Chỉ định model ở cấp mục. **`provider` và `model` phải đồng thời để trống hoặc đồng thời có giá trị** —
        cả hai để trống = dùng model của hội thoại hiện tại; chỉ điền một trường được xem là cấu hình không hợp lệ.
      required: [provider, model]
      properties:
        provider:
          type: string
        model:
          type: string

    Position:
      type: object
      required: [corner, marginX, marginY]
      properties:
        corner:
          type: string
          description: Góc neo
          enum: [top-left, top-right, bottom-left, bottom-right]
        marginX:
          type: number
          description: Lề ngang (pixel)
        marginY:
          type: number
          description: Lề dọc (pixel)

    PetEntry:
      type: object
      description: Mục vật nuôi nằm trong danh sách cho phép (dạng đầu vào của `PUT /config`)
      required: [id, name, size, balanceEnabled, display, position]
      properties:
        id:
          type: string
          maxLength: 64
          description: ID vật nuôi. **Không được chứa ký tự không hợp lệ trong tên tệp** (ký tự dành riêng của Windows + ký tự điều khiển)
        name:
          type: string
          description: Tên hiển thị; nếu để trống, host dùng `id` và đưa ra cảnh báo
        size:
          type: number
          exclusiveMinimum: 0
          description: Kích thước vật nuôi (pixel)
        sizePercent:
          type: number
          minimum: 1
          default: 100
          description: |
            Giới hạn chiều rộng màn hình (%; mặc định 100, không giới hạn trên). Khung hiển thị được tính theo tỷ lệ chiều rộng nhân vật chiếm trên màn hình; `size` vẫn là giới hạn của khung:
            100 ≈ không giới hạn (trong cửa sổ rộng, kết quả giống hiển thị theo px); đặt 30–50 để vật nuôi nhỏ rõ rệt trên màn hình điện thoại dọc,
            đặt 150 để nhân vật rộng hơn màn hình, nhưng khung vẫn bị giới hạn bởi `size`.
            Chỉ phân tích một lần khi tải trang; cần làm mới sau khi đổi kích thước cửa sổ.
            Chỉ áp dụng cho phía trình duyệt; cửa sổ desktop trong suốt luôn dùng `size`. Giá trị nhỏ hơn 1 hoặc không phải số sẽ trở về 100.
        balanceEnabled:
          type: boolean
        whisperEnabled:
          type: boolean
          description: Có bật lời thì thầm định kỳ hay không (**không chi phối** `POST /whisper`)
        workStatusEnabled:
          type: boolean
        fixedEnabled:
          type: boolean
          description: |
            Cố định vật nuôi: `true` = chuỗi hoạt ảnh ngẫu nhiên không chọn hai mức "quay hướng / di chuyển" (vật nuôi không tự đổi hướng hoặc tự đi chỗ khác,
            chỉ phát hoạt ảnh chờ tại chỗ và cử động nhỏ ngẫu nhiên). **Chỉ ảnh hưởng chuỗi ngẫu nhiên** — phát từ menu chuột phải, `POST /anim`,
            hoạt ảnh sự kiện (số dư / lời thì thầm / trạng thái công việc), phản hồi khi nhấp và thao tác kéo đều không bị ảnh hưởng. Mặc định `false` nếu thiếu.
        display:
          type: string
          enum: [web, desktop, both, none]
          description: Hiển thị ở đâu — chỉ trình duyệt / chỉ desktop / cả hai / không hiển thị
        position:
          $ref: "#/components/schemas/Position"

    SaveConfigRequest:
      type: object
      required: [pets]
      properties:
        pets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PetEntry"
        notificationsEnabled:
          type: boolean
        notifyWhenFocused:
          type: boolean
          description: |
            Vẫn nhắc khi trang đang ở tiền cảnh và có tiêu điểm (mặc định `false`): khi bật, thông báo hệ thống vẫn xuất hiện khi trang đang hiển thị và có tiêu điểm,
            đồng thời vẫn đọc trạng thái công việc; nếu thiếu khóa thì xem là `false`, giữ nguyên hành vi của cấu hình cũ.
        whisperImageEnabled:
          type: boolean
        chatImageEnabled:
          type: boolean
        chatAnimationEnabled:
          type: boolean
          description: |
            Công tắc liên kết hành động hội thoại (mặc định toàn cục): khi bật, gửi toàn bộ danh sách hành động trong `animations.categories` cho model trong lúc hội thoại,
            để model chọn và thực hiện một hành động phù hợp với ngữ cảnh; khi tắt thì chỉ có văn bản. Đây là công tắc "Liên kết hành động hội thoại" trong thẻ "Công tắc toàn cục" ở trang cài đặt.
        confineToScreen:
          type: boolean
        voiceEnabled:
          type: boolean
          description: |
            Công tắc đọc thành tiếng thủ công (mặc định toàn cục): có đọc lời thì thầm và câu trả lời hội thoại được kích hoạt từ menu chuột phải hoặc lệnh slash hay không.
            Cùng cấp với `voiceWhisperEnabled` / `voiceTodoEnabled` / `voiceNotifyEnabled`; mỗi công tắc hoạt động độc lập.
            Đây là công tắc "Đọc thủ công" trong thẻ "Đọc bằng giọng nói" ở trang cài đặt. Mặc định `false` nếu thiếu.
        voiceName:
          type: string
          description: |
            ID giọng đọc cụ thể (`provider/giọng đọc`); xem các giá trị tại `/voice/voices`; nếu nhập sai hoặc để trống thì không phân giải được,
            tổng hợp sẽ thất bại với `bad-request` và cảnh báo, không tự chuyển sang giọng đọc khác. Đây là giá trị của danh sách chọn giọng trong thẻ "Đọc bằng giọng nói" ở trang cài đặt.
        speechProvider:
          type: string
          description: |
            ID triển khai nhận dạng giọng nói (ví dụ `dsh`); xem các giá trị tại `/voice/hear-providers`; nếu nhập sai hoặc để trống thì không phân giải được,
            nhận dạng sẽ thất bại với `bad-request` và cảnh báo, không tự chuyển sang triển khai khác. Đây là giá trị của danh sách chọn nhận dạng giọng nói trong thẻ "Đọc bằng giọng nói" ở trang cài đặt.
        voiceVolume:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Hệ số âm lượng phát: 0–1, 1 = âm lượng tối đa, 0 = tắt tiếng; cả bốn loại giọng nói dùng chung mức âm lượng này.
            Chỉ đổi âm lượng phát, không tổng hợp lại âm thanh. Đây là giá trị trong ô nhập âm lượng ở thẻ "Đọc bằng giọng nói" trên trang cài đặt. Mặc định là 1 nếu thiếu.
        voiceWhisperEnabled:
          type: boolean
          description: |
            Có đọc lời thì thầm định kỳ thành tiếng hay không (mặc định toàn cục).
            Đây là công tắc "Đọc lời thì thầm" trong thẻ "Đọc bằng giọng nói" ở trang cài đặt. Mặc định `false` nếu thiếu.
        voiceTodoEnabled:
          type: boolean
          description: |
            Có đọc nhắc việc cần làm thành tiếng hay không (mặc định toàn cục).
            Đây là công tắc "Đọc nhắc việc" trong thẻ "Đọc bằng giọng nói" ở trang cài đặt. Mặc định `false` nếu thiếu.
        voiceNotifyEnabled:
          type: boolean
          description: |
            Có đọc trạng thái công việc thành tiếng hay không (mặc định toàn cục): khi tác vụ hoàn tất / gặp lỗi / chờ bạn xác nhận, đọc một câu được cấu hình cho mức trạng thái đó;
            giống thông báo hệ thống, chỉ đọc khi người dùng không ở trên trang này. Chỉ đọc câu thoại đã cấu hình, không đọc `task`.
            Đây là công tắc "Đọc thông báo" trong thẻ "Đọc bằng giọng nói" trên trang cài đặt. Mặc định `false` nếu thiếu.
        chatMemoryRounds:
          type: integer
          minimum: 0
          description: |
            Số lượt lịch sử hội thoại (mặc định toàn cục): số lượt gần nhất được gửi kèm mỗi yêu cầu hội thoại; 1 lượt = 1 câu hỏi và 1 câu trả lời,
            0 = không gửi lịch sử. `memory.json` lưu toàn bộ, không xóa; giá trị này chỉ quyết định bao nhiêu nội dung được đưa vào ngữ cảnh.
            Đây là giá trị trong ô số ở mục "Model AI và ngữ cảnh hội thoại" của trang cài đặt. Mặc định là 5 nếu thiếu.
        chatImageLimit:
          type: integer
          minimum: 0
          description: |
            Giới hạn số ảnh minh họa hội thoại (mặc định toàn cục): số meme tối đa gửi cho model khi trò chuyện ("N ảnh đầu" = N mục đầu tiên được ghi trong cấu hình;
            thứ tự khai báo `memes` chính là thứ tự áp dụng; hãy đưa ảnh muốn ưu tiên lên trước).
            **0 = không giới hạn (gửi tất cả)**.
            Lý do cần giới hạn: toàn bộ danh sách được đính kèm trong mỗi tin nhắn, số token tăng tuyến tính theo số ảnh; giới hạn giúp kiểm soát chi phí ảnh minh họa.
            Đây là giá trị trong ô số ở mục "Model AI và ngữ cảnh hội thoại" của trang cài đặt. Mặc định là 10 nếu thiếu.

    PetConfigEntry:
      type: object
      description: |
        Cấu hình mục sau khi được bộ hợp nhất điền đầy đủ. Có nhiều trường hơn `PetEntry`, bao gồm
        `whisperPrompt`, `chatMemoryRounds`, `whisperModel`, `chatModel`, `memes`,
        `workStatusTexts`, `physics`, `animations`, `eventsRefreshSec`, `animationWeights` và các trường khác.
        Xem đầy đủ trường và giá trị mặc định trong `assets/config.jsonc` của gói (có chú thích; đây là nguồn giá trị mặc định duy nhất).
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: number
        balanceEnabled:
          type: boolean
        whisperEnabled:
          type: boolean
        workStatusEnabled:
          type: boolean
        fixedEnabled:
          type: boolean
          description: Cố định vật nuôi (chuỗi ngẫu nhiên không chọn hai mức "quay hướng / di chuyển"; các kích hoạt chủ động không bị ảnh hưởng)
        display:
          type: string
          enum: [web, desktop, both, none]
        position:
          $ref: "#/components/schemas/Position"
        whisperPrompt:
          type: string
          description: Prompt thiết lập tính cách cho vật nuôi (dùng chung cho lời thì thầm và hội thoại)
        chatMemoryRounds:
          type: integer
          description: Số lượt ghi nhớ hội thoại (1 lượt = 1 câu hỏi và 1 câu trả lời)
        whisperModel:
          $ref: "#/components/schemas/ModelSelection"
        chatModel:
          $ref: "#/components/schemas/ModelSelection"
        whisperImageEnabled:
          type: boolean
        chatImageEnabled:
          type: boolean
        chatAnimationEnabled:
          type: boolean
          description: Công tắc liên kết hành động hội thoại (khi bật, model có thể chọn và thực hiện một hành động trong `categories`)
        chatImageLimit:
          type: integer
          minimum: 0
          description: Giới hạn số ảnh minh họa hội thoại (0 = không giới hạn); chỉ ảnh hưởng việc chọn ảnh cho hội thoại, lời thì thầm chỉ kèm ảnh được chọn ngẫu nhiên
        memes:
          type: object
          description: Kho meme — khóa là tên ảnh, giá trị là mô tả ngữ cảnh của ảnh (để model lựa chọn)
          additionalProperties:
            type: string
        workStatusTexts:
          type: array
          description: Nội dung bong bóng trạng thái công việc; chỉ số phải khớp chính xác với `animations.events.workStatus`
          items:
            type: string
        eventsRefreshSec:
          type: object
          description: Khoảng thời gian làm mới định kỳ (giây). Cả hai chu kỳ do **bộ định thời của host** điều khiển; frontend không poll chúng.
          properties:
            balance:
              type: integer
              default: 1800
              description: Chu kỳ làm mới số dư
            whisper:
              type: integer
              default: 300
              description: Khoảng thời gian giữa các lời thì thầm định kỳ
      additionalProperties: true

    Todo:
      type: object
      required: [id, text, dueAt, done, createdAt, updatedAt, completedAt]
      properties:
        id:
          type: string
          description: Duy nhất trong phiên bản này; là đoạn đường dẫn của PATCH / DELETE
        text:
          type: string
          description: Nội dung (sau trim có 1–200 điểm mã)
        dueAt:
          type: [integer, "null"]
          description: Thời điểm đến hạn (epoch ms); null = không thời hạn, không bao giờ nhắc
        done:
          type: boolean
        createdAt:
          type: integer
        updatedAt:
          type: integer
        completedAt:
          type: [integer, "null"]
        lastRemindedAt:
          type: [integer, "null"]
          description: Thời điểm nhắc gần nhất; trường nội bộ, bảng điều khiển frontend không sử dụng

    TodoListResponse:
      type: object
      required: [ok, todos]
      properties:
        ok:
          type: boolean
        todos:
          type: array
          items:
            $ref: "#/components/schemas/Todo"

    TodoResponse:
      type: object
      required: [ok, todo]
      properties:
        ok:
          type: boolean
        todo:
          $ref: "#/components/schemas/Todo"
        reason:
          type: string
          description: 'Nguyên nhân thất bại (ví dụ `bad-request` / `todo-not-found`)'
        message:
          type: string

    TodoRemovedResponse:
      type: object
      required: [ok, removed]
      properties:
        ok:
          type: boolean
        removed:
          type: integer
          description: Số mục đã xóa; 0 = vốn không có mục nào (tính lũy đẳng)


