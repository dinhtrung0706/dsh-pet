openapi: 3.1.0

info:
  title: dsh-pet HTTP API
  version: 0.4.9
  summary: Giao diện HTTP phía host của plugin thú cưng DSH
  description: |
    Nửa phía host của dsh-pet đăng ký **một route có tiền tố** `/dsh-pet-7340` thông qua dịch vụ `webServer` của DSH.
    Nửa trình duyệt, nửa Electron trên desktop và trang cài đặt đều dùng chung một triển khai (`handlePetRoute`).
    Tệp này là hợp đồng công khai của route đó: mọi plugin / script bên thứ ba đều có thể dùng nó để truy cập các khả năng của thú cưng.

    ## Hình thức triển khai

    Giao diện được gắn vào **dịch vụ Web của chính DSH**, vì vậy không có cổng cố định:

    - `http://127.0.0.1:{port}` trong `servers` chỉ là chỗ giữ chỗ — `{port}` chính là `ctx.webServer.port`,
      tức địa chỉ được in ra khi chạy `dsh web` (mặc định là 3080 nếu không chỉ định cổng).
      Bản thân plugin không nghe trên một cổng cố định; nó chỉ gắn route vào dịch vụ Web của host.
    - Chỉ lắng nghe trên **127.0.0.1**, không công khai ra Internet và **không có xác thực**: mọi tiến trình truy cập được cổng trên máy này đều có thể gọi.
      Không chuyển tiếp / proxy cổng này ra Internet.
    - Nửa desktop không dùng HTTP; scheme tùy chỉnh `dsh-pet-bridge://` được chuyển tiếp qua pipe của tiến trình chính tới **cùng một**
      `handlePetRoute`. Vì vậy mọi đường dẫn bên dưới có hành vi hoàn toàn giống nhau ở cả hai phía.

    ## Bắt đầu trong hai phút

    ```bash
    BASE=http://127.0.0.1:3080/dsh-pet-7340

    # 1. Lấy trạng thái thống nhất một lần (chỉ đọc, không tác dụng phụ, có thể thăm dò tùy ý)
    curl -s $BASE/state

    # 2. Yêu cầu thú cưng main nói ngay một câu (phản hồi kèm text; cùng nội dung cũng được ghi vào /state)
    curl -s -X POST "$BASE/whisper?pet=main"
    curl -s $BASE/state   # → pets.main.say.data.text (trùng khớp từng ký tự với text trả về ở trên)
    ```

    ## Luồng dữ liệu: vì sao có cả "endpoint hành động" lẫn "/state"

    Đây là quy ước quan trọng nhất của API này; hiểu điều này thì các phần còn lại chỉ là chi tiết:

    1. **Chỉ có một đầu ra dữ liệu**: `GET /state`. Nó trả về một "trạng thái đã công bố" S trong bộ nhớ của host,
       gồm một số **lá (leaf)**, mỗi lá có dạng `{ counter, data }`.
    2. **Endpoint hành động chỉ xác nhận, không chuyển dữ liệu**: `POST /balance`, `POST /broadcast`, `POST /bubble/clear`,
       `POST /anim` chỉ trả `{ ok: true }`, nghĩa là "hành động này đã hoàn tất". Chúng **ghi** kết quả vào S bên trong host;
       bên gọi có thể thấy kết quả khi lấy `/state` ở lượt tiếp theo.

       Ngoại lệ là **hai endpoint tạo nội dung**: khi thành công, `POST /whisper` và `POST /chat` **trả kèm**
       `text` được tạo ra (nếu có ảnh thì kèm `image`). Việc này chỉ tiết kiệm một lượt gọi, không tạo thêm đầu ra dữ liệu — cùng một văn bản
       vẫn được ghi vào S như trước, hành vi của các bên tiêu thụ khác hoàn toàn không đổi.
    3. **`counter` là tín hiệu duy nhất cho biết "có thay đổi hay không"**: nó là `Date.now()` và **tăng nghiêm ngặt** (nếu ghi liên tiếp trong cùng một mili giây thì tăng +1),
       cũng không giảm sau khi host khởi động lại. Bên tiêu thụ chỉ so sánh `counter` với giá trị ghi nhận lần trước; nếu giống nhau thì bỏ qua kết xuất.
       Nhờ vậy, frontend có thể xử lý thống nhất mọi lá mà không cần biết logic nghiệp vụ.

    Vì vậy, cách tiêu thụ được khuyến nghị là:

    - **Cần dữ liệu** → gọi `GET /state` mỗi giây, so sánh `counter`, chỉ xử lý các lá đã thay đổi.
    - **Cần kích hoạt hành vi** → gọi `POST` tới endpoint hành động tương ứng; sau khi nhận `ok`, gọi lại `GET /state` **ngay lập tức**,
      để nhận kết quả với độ trễ bằng 0 (không phải đợi chu kỳ polling tiếp theo).

    Quy ước mã trạng thái (dùng thống nhất trong toàn plugin):

    - **Lỗi nghiệp vụ → `200`**: yêu cầu đã tới trình xử lý và có kết luận (thiếu tham số, không biết thú cưng, đang bị chiếm, tạo nội dung thất bại,
      không phân tích được cấu hình), luôn trả `200` + `FailureResponse`; `reason` cho biết loại lỗi.
      Bên gọi phân nhánh theo `reason`, **không dùng mã trạng thái để xác định nghiệp vụ**.
    - **Lỗi giao thức → mã trạng thái thực**: đường dẫn không tồn tại `404`, sai phương thức `405`, body không phải JSON hợp lệ `400`,
      body vượt giới hạn `413`, ngoại lệ ngoài dự kiến `500`. Các lỗi này được xác định trước khi xử lý nghiệp vụ; body phản hồi vẫn cùng một thực thể lỗi.
    - **Endpoint tài nguyên** (`/thumb`, `/pic`, `/font`, `/sound`, `/notify-icon`) trả về luồng tệp:
      thành công là dữ liệu nhị phân, không tìm thấy thì trả `404` văn bản thuần, **không bọc** trong thực thể lỗi.

